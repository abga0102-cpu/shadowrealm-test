name: Apply combat impact v153
on:
  push:
    paths:
      - '.github/workflows/apply-combat-impact-v153.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load combat impact V153
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_comment = '<!-- Combat fluidity V152 · build 2026.09.08.152 -->'
          new_comment = '<!-- Combat impact V153 · build 2026.09.08.153 -->'
          if old_comment not in s:
              raise SystemExit('build 152 comment anchor missing')
          s = s.replace(old_comment, new_comment, 1)

          old_meta = '<meta name="shadowreach-build" content="2026.09.08.152">'
          new_meta = '<meta name="shadowreach-build" content="2026.09.08.153">'
          if old_meta not in s:
              raise SystemExit('build 152 meta anchor missing')
          s = s.replace(old_meta, new_meta, 1)

          anchor = '<script src="game-3.js?v=2026.09.08.151"></script>'
          inject = anchor + '<script src="combat-impact-v153.js?v=2026.09.08.153"></script>'
          if 'combat-impact-v153.js' not in s:
              if anchor not in s:
                  raise SystemExit('game-3 script anchor missing')
              s = s.replace(anchor, inject, 1)

          old_runtime = "(function(){var V='2026.09.08.152';"
          new_runtime = "(function(){var V='2026.09.08.153';"
          if old_runtime not in s:
              raise SystemExit('dynamic loader build anchor missing')
          s = s.replace(old_runtime, new_runtime, 1)

          p.write_text(s)
          PY
      - name: Syntax and boot wiring checks
        run: |
          node --check combat-fluidity-v152.js
          node --check combat-impact-v153.js
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          grep -F 'shadowreach-build" content="2026.09.08.153' index.html
          grep -F 'combat-impact-v153.js?v=2026.09.08.153' index.html
          grep -F "var V='2026.09.08.153'" index.html
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fluidité impacts combat' -m 'Charge la couche visuelle V153 après le renderer de combat, renforce la lisibilité des impacts, critiques et morts sans modifier les dégâts, HP, cooldowns, récompenses ou progression. Build 2026.09.08.153.'
          git push
