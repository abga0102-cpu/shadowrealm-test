name: Apply Rebirth damage reduction V172

on:
  push:
    branches: [main]
    paths:
      - '.github/rebirth_dmgred_v172.py'
      - '.github/workflows/apply-rebirth-dmgred-v172.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V172 patch
        run: python3 .github/rebirth_dmgred_v172.py
      - name: Syntax check
        run: node --check game-1.js
      - name: Verify V172
        run: |
          grep -F 'key: "dmgred"' game-1.js | grep -F 'max: 20' | grep -F 'perLvl: 2' | grep -F 'costDiv: 1'
          grep -F '2026.09.08.172' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-1.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rebalance Rebirth damage reduction V172'
          git push origin main
