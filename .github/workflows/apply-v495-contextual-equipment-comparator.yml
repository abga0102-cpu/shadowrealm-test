name: V495 contextual equipment comparator
on:
  push:
    branches: [v495-contextual-equipment-comparator]
    paths:
      - '.github/workflows/apply-v495-contextual-equipment-comparator.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v495-contextual-equipment-comparator
      - name: Apply V495
        run: python3 scripts/apply_v495.py
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          cat game-1.js game-2.js game-3.js game-4.js game-5.js > /tmp/all.js
          node --check /tmp/all.js
          grep -q 'equipCompareScores' game-4.js
          grep -q 'Puissance globale' game-4.js
          grep -q 'Plus offensif' game-4.js
          grep -q 'Plus défensif' game-4.js
          grep -q 'Choix situationnel' game-4.js
          grep -q 'computePower(previewState)' game-4.js
      - name: Commit V495
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-4.js
          git commit -m "V495 · Comparateur d'équipement contextuel" -m "Ajoute Puissance globale, Offense, Survie et un verdict contextuel au mode test. Les scores Offense/Survie sont purement informatifs et ne modifient ni combat, ni computePower, ni sauvegarde."
          git push
