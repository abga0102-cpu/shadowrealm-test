name: Apply Boost UX V174
on:
  push:
    paths:
      - 'boost-inventory-v174.js'
      - '.github/apply_boost_ux_v174.py'
      - '.github/workflows/apply-boost-ux-v174.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch build
        run: python3 .github/apply_boost_ux_v174.py
      - name: Syntax check
        run: node --check boost-inventory-v174.js
      - name: Verify build
        run: |
          grep -q 'Boost UX V174' index.html
          grep -q 'boost-inventory-v174.js?v=2026.09.08.174' index.html
          grep -q 'data-sanct-v130="boost"' sanctuary-endgame-v130.js
          grep -q 'sanctuaryReadOnly' boost-inventory-v174.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'shadowreach-bot'
          git config user.email 'shadowreach-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply Boost UX V174'
          git push origin main
