name: Bottom navigation V188 browser check

on:
  push:
    branches:
      - canonical-bottom-nav-v188
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bottom-nav-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Start local game server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/shadowreach-http.log 2>&1 &
          echo $! >/tmp/shadowreach-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/shadowreach-http.log
          exit 1

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Run V188 visual regression matrix in Chrome
        env:
          CI: "true"
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']
            });
            try {
              const page = await browser.newPage();
              page.on('console', msg => console.log('[browser]', msg.text()));
              page.on('pageerror', err => console.error('[pageerror]', err.message));
              await page.goto('http://127.0.0.1:8080/bottom-nav-visual-test-v188.html', {waitUntil: 'domcontentloaded', timeout: 15000});
              await page.waitForFunction(() => window.__bottomNavV188Results && window.__bottomNavV188Results.done === true, {timeout: 120000});
              const result = await page.evaluate(() => window.__bottomNavV188Results);
              console.log(JSON.stringify(result, null, 2));
              if (!result || result.fail !== 0) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err && err.stack || err);
            process.exit(1);
          });
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/shadowreach-http.log || true
