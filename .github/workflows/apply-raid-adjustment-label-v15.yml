# trigger-v18-2
name: Apply equipment upgrade clarity v18
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve dust efficiency and item stat clarity
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('game-2.js')
          s = p.read_text()
          reps = [
              ('next = Math.round(Number(it.baseDamage || 0) * (1 + steps * 0.0035) * 100) / 100;',
               'next = Math.round(Number(it.baseDamage || 0) * (1 + steps * 0.00375) * 100) / 100;'),
              ('next = Math.round(Number(it.baseHp || 0) * (1 + steps * 0.0035) * 100) / 100;',
               'next = Math.round(Number(it.baseHp || 0) * (1 + steps * 0.00375) * 100) / 100;'),
              ('|| "2026.09.06.17";', '|| "2026.09.06.18";'),
          ]
          for old,new in reps:
              if new not in s:
                  if old not in s: raise SystemExit('game-2 anchor missing: ' + old)
                  s = s.replace(old,new,1)
          p.write_text(s)

          p = Path('game-5.js')
          s = p.read_text()
          anchor = '  const upgradePreview = itemUpgradePreview(it);\n'
          add = '\n'.join([
              '  const isWeaponStat = !!it.baseDamage;',
              '  const basePrimary = Number(isWeaponStat ? (it.baseDamage || it.damage || 0) : (it.baseHp || it.hp || 0));',
              '  const currentPrimary = Number(isWeaponStat ? (it.damage || 0) : (it.hp || 0));',
              '  const addedPrimary = Math.max(0, currentPrimary - basePrimary);',
          ]) + '\n'
          if add not in s:
              if anchor not in s: raise SystemExit('item modal helper anchor missing')
              s = s.replace(anchor, anchor + add, 1)

          swaps = [
              ('? st("ATTAQUE DE BASE", "+" + equipStat(it.damage), "#FF9C6B")',
               '? st("ATTAQUE DE BASE", "+" + equipStat(basePrimary), "#FF9C6B")'),
              (': st("SANTÉ DE BASE", "+" + equipStat(it.hp), "var(--redLit)")) +',
               ': st("SANTÉ DE BASE", "+" + equipStat(basePrimary), "var(--redLit)")) +'),
              ('      st("PUISSANCE", equipStat(it.power), "var(--goldLit)") +',
               '      st(it.baseDamage ? "BONUS D\'ATTAQUE" : "BONUS DE SANTÉ", "+" + equipStat(addedPrimary), "var(--greenLit)") +\n      st("PUISSANCE TOTALE", equipStat(it.power), "var(--goldLit)") +'),
              ('      st("NIVEAU D\'AMÉLIORATION", "+" + it.level, "var(--goldLit)") +\n', '')
          ]
          for old,new in swaps:
              if new and new in s: continue
              if old not in s: raise SystemExit('game-5 anchor missing: ' + old)
              s = s.replace(old,new,1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if '2026.09.06.18' not in s:
              if '2026.09.06.17' not in s: raise SystemExit('index .17 anchor missing')
              s = s.replace('2026.09.06.17','2026.09.06.18')
          p.write_text(s)
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          e=Path('game-2.js').read_text()
          u=Path('game-5.js').read_text()
          h=Path('index.html').read_text()
          seg=e[e.index('function itemUpgradePreview'):e.index('function itemUpgradeChance')]
          assert seg.count('0.00375') >= 2
          assert '0.0035' not in seg
          modal=u[u.index('const upgradePreview = itemUpgradePreview(it)'):u.index('BONUS DE STATS',u.index('const upgradePreview = itemUpgradePreview(it)'))]
          assert 'BONUS DE SANTÉ' in modal
          assert 'PUISSANCE TOTALE' in modal
          assert 'NIVEAU D\'AMÉLIORATION' not in modal
          assert '2026.09.06.18' in h
          assert '|| "2026.09.06.18";' in e
          assert 'Math.floor(dmg * 0.30)' in e
          assert 'function campaignBossStatMul(floor)' in e
          print('v18 checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already applied'
            exit 0
          fi
          git add game-2.js game-5.js index.html
          git commit -m 'Stats Équipement' -m 'Améliore légèrement l’efficacité des Poussières : chaque niveau réussi ajoute désormais 0,375 % de la statistique de référence au lieu de 0,35 %. Le détail d’un équipement affiche maintenant Santé de base, Bonus de santé et Puissance totale pour les pièces défensives, avec l’équivalent Attaque de base / Bonus d’attaque pour les armes. Le Niveau d’amélioration est retiré de ce bloc car il est déjà visible dans le nom de l’objet. Build 2026.09.06.18.'
          git push
