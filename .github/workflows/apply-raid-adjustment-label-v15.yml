# trigger-arena-equipment-v42-1
name: Arena equipment removal v42
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove equipment from arena world
        run: python .github/remove_arena_equipment_v42.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check social-v1.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); social=Path('social-v1.js').read_text(); idx=Path('index.html').read_text()
          home=g4[g4.find('function scrAccueil()'):g4.find('/* ---------------- PERSONNAGE')]
          assert 'ARENA_EQUIPMENT_REMOVED_V42' in g4
          assert 'worldAction(worldPrimary[1], "worldEquip")' not in home
          assert 'worldAction(worldPrimary[0], "worldRebirth")' in home
          assert 'worldAction(worldPrimary[2], "worldDev")' in home
          assert 'worldAction(worldPrimary[3], "worldDefis")' in home
          assert 'data-arg="equipement"' in home  # combat loadout access remains outside the arena decor
          assert '2026.09.06.42' in g2 and '2026.09.06.42' in idx
          assert 'social-v1.js?v=2026.09.06.42' in idx
          assert 'SKILL_SLOTS_BASE: 3' in g1
          assert 'ARENA_STABILITY_V36' in g3
          assert 'SANCTUARY_DRAG_MERGE_V34' in g5
          print('v42 arena equipment removal checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-2.js game-4.js index.html
          git commit -m 'Arène Épurée' -m 'Retire le bouton Équipement du décor de l’arène. Rebirth, Développement, Défis et le menu compact restent intégrés au monde. L’accès à l’équipement reste disponible depuis les écrans prévus à cet effet et depuis la barre de combat, sans modifier la campagne, la Forge, le combat, le Sanctuaire, l’économie ni les sauvegardes. Build 2026.09.06.42.'
          git push
