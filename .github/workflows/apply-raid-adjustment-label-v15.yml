# trigger-chat-compact-v50-4
name: Chat compact arena v50
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact arena chat
        run: python .github/chat_compact_v50.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check social-v1.js
          test ! -f social-p2p-v1.js || node --check social-p2p-v1.js
          test ! -f social-forge-layout-v1.js || node --check social-forge-layout-v1.js
          test ! -f social-bot-testers-v1.js || node --check social-bot-testers-v1.js
          test ! -f social-bot-ui-v1.js || node --check social-bot-ui-v1.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g2=Path('game-2.js').read_text(); social=Path('social-v1.js').read_text(); idx=Path('index.html').read_text()
          assert 'CHAT_COMPACT_OVERLAY_V50' in social
          assert 'background:rgba(7,11,19,.36)' in social
          assert 'ar.width*.72' in social
          assert 'Math.min(268,ar.height-margin*2)' in social
          assert 'desired=ar.right-ap.left-b.offsetWidth*.46' in social
          assert 'app.clientWidth-20' in social
          assert 'backdrop-filter:blur(3px)' not in social
          assert '2026.09.06.50' in g2 and '2026.09.06.50' in idx
          assert 'social-v1.js?v=2026.09.06.50' in idx
          print('v50 compact chat checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add social-v1.js game-2.js index.html
          git commit -m 'Chat Combat Compact' -m 'Rend le chat nettement plus discret pendant la Campagne : panneau ancré sur le côté droit de l’arène, largeur réduite à environ 72 %, fond à 36 % d’opacité sans flou et hauteur limitée à la zone de combat. Le bouton est accroché au bord extérieur de l’arène. Hors Campagne, le chat reste compact au lieu de devenir presque plein écran. La Forge, le combat, la progression, le Sanctuaire, l’économie et les sauvegardes restent inchangés. Build 2026.09.06.50.'
          git push
