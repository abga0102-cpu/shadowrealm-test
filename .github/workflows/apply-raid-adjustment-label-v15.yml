# trigger-chat-arena-overlay-v48-2
name: Chat arena overlay v48
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chat arena overlay
        run: python .github/chat_arena_overlay_v48.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check social-v1.js
          test ! -f social-p2p-v1.js || node --check social-p2p-v1.js
          test ! -f social-forge-layout-v1.js || node --check social-forge-layout-v1.js
          test ! -f social-bot-testers-v1.js || node --check social-bot-testers-v1.js
          test ! -f social-bot-ui-v1.js || node --check social-bot-ui-v1.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); social=Path('social-v1.js').read_text(); idx=Path('index.html').read_text()
          assert 'CHAT_ARENA_OVERLAY_V48' in social
          assert 'function dockSocialUI()' in social
          assert 'background:rgba(7,11,19,.66)' in social
          assert 'backdrop-filter:blur(3px)' in social
          assert 'Math.min(286,ar.height-margin*2)' in social
          assert 'dockObserver' in social
          assert '2026.09.06.48' in g2 and '2026.09.06.48' in idx
          assert 'social-v1.js?v=2026.09.06.48' in idx
          assert 'SCROLL_STABILITY_V47' in g5
          assert 'ARENA_STABILITY_V36' in g3
          assert 'ARENA_EQUIPMENT_REMOVED_V45' in g4
          assert 'SKILL_SLOTS_BASE: 3' in g1
          print('v48 chat arena overlay checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add social-v1.js game-2.js index.html
          git commit -m 'Chat Arène Transparent' -m 'Place le bouton Chat au bord de l’arène sur la Campagne et transforme le chat ouvert en panneau translucide limité à la hauteur de l’arène. Le combat reste visible derrière et la Forge n’est plus recouverte. Le panneau se recale après les rerenders et les changements d’orientation. Les systèmes de combat, progression, économie, Sanctuaire, Forge et sauvegardes restent inchangés. Build 2026.09.06.48.'
          git push
