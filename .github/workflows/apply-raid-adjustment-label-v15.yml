# trigger-v25-1
name: Smooth combat v25
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smooth movement attacks and skills
        run: |
          python <<'PY'
          from pathlib import Path

          arena=Path('game-3.js'); s=arena.read_text()

          old='''    const idle = Math.sin(t * 0.0042) * 2 + Math.sin(t * 0.0017) * 1;\n    const hop = heroMoving ? -Math.abs(Math.sin(t * 0.017)) * 5 : 0;\n    const tilt = heroMoving ? Math.sin(t * 0.017) * 4 : Math.sin(t * 0.0032) * 1.6;\n    const lunge = c.heroAttacking > 0 ? 12 : 0;\n    const knock = c.heroHit > 0 ? -6 : 0;'''
          new='''    // Marche naturelle : aucun saut vertical. Le déplacement vient de heroX,\n    // avec seulement un léger transfert de poids pour éviter l'effet de glisse.\n    const walkPhase = t * 0.0115;\n    const idle = heroMoving ? 0 : Math.sin(t * 0.0036) * 0.8;\n    const hop = 0;\n    const tilt = heroMoving ? Math.sin(walkPhase) * 1.8 : Math.sin(t * 0.0030) * 0.8;\n    const attackP = c.heroAttacking > 0 ? Math.max(0, Math.min(1, 1 - c.heroAttacking / ATTACK_WINDOW)) : 0;\n    const lunge = c.heroAttacking > 0 ? Math.sin(attackP * Math.PI) * 7 : 0;\n    const knock = c.heroHit > 0 ? -Math.min(4, c.heroHit * 14) : 0;'''
          if old not in s: raise SystemExit('hero movement anchor missing')
          s=s.replace(old,new,1)

          old='''    const lunge = (e.attacking > 0 ? -12 : 0) + (e.recoil > 0 ? e.recoil * 46 : 0);\n    const knock = e.hitFlash > 0 ? 7 : 0;'''
          new='''    const enemyAttackP = e.attacking > 0 ? Math.max(0, Math.min(1, 1 - e.attacking / ATTACK_WINDOW)) : 0;\n    const lunge = (e.attacking > 0 ? -Math.sin(enemyAttackP * Math.PI) * 8 : 0) + (e.recoil > 0 ? e.recoil * 38 : 0);\n    const knock = e.hitFlash > 0 ? Math.min(5, e.hitFlash * 18) : 0;'''
          if old not in s: raise SystemExit('enemy lunge anchor missing')
          s=s.replace(old,new,1)

          old='''  const p = Math.max(0, Math.min(1, 1 - fx.life / dur));   // 0 -> 1 over the effect\n  const col = fx.color;\n  const fade = 1 - p;'''
          new='''  const rawP = Math.max(0, Math.min(1, 1 - fx.life / dur));\n  // Courbe d'animation continue : départ et fin sans cassure visuelle.\n  const p = rawP * rawP * (3 - 2 * rawP);\n  const col = fx.color;\n  const fade = Math.pow(1 - rawP, 0.72);'''
          if old not in s: raise SystemExit('skill vfx anchor missing')
          s=s.replace(old,new,1)

          old='''const VFX_DUR = {\n  impact: 0.80, pierce: 0.90, vortex: 1.45, bolt: 0.90, wave: 1.30,\n  meteor: 1.70, aura: 1.60, curse: 1.35, poison: 1.60, heal: 1.45, cataclysm: 2.30,\n};'''
          new='''const VFX_DUR = {\n  // Effets plus réactifs : ils restent lisibles mais ne bloquent plus le rythme du combat.\n  impact: 0.62, pierce: 0.72, vortex: 1.10, bolt: 0.70, wave: 0.96,\n  meteor: 1.28, aura: 1.18, curse: 1.02, poison: 1.18, heal: 1.05, cataclysm: 1.65,\n};'''
          if old not in s: raise SystemExit('VFX duration anchor missing')
          s=s.replace(old,new,1)

          # Weapon idle sway is intentionally restrained while preserving attack anchors.
          old='''  const sway = Math.sin(t * 0.0034) * 5;'''
          new='''  const sway = Math.sin(t * 0.0034) * 2.5;'''
          if old not in s: raise SystemExit('weapon sway anchor missing')
          s=s.replace(old,new,1)

          arena.write_text(s)

          eng=Path('game-2.js'); e=eng.read_text()
          if '|| "2026.09.06.24";' not in e: raise SystemExit('APP_BUILD .24 anchor missing')
          eng.write_text(e.replace('|| "2026.09.06.24";', '|| "2026.09.06.25";', 1))

          idx=Path('index.html'); h=idx.read_text()
          if h.count('2026.09.06.24') != 7: raise SystemExit('Unexpected index build reference count')
          idx.write_text(h.replace('2026.09.06.24','2026.09.06.25'))
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g5=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert 'const hop = 0;' in g3
          assert 'walkPhase = t * 0.0115' in g3
          assert 'Math.sin(attackP * Math.PI) * 7' in g3
          assert 'Math.sin(enemyAttackP * Math.PI) * 8' in g3
          assert 'rawP * rawP * (3 - 2 * rawP)' in g3
          assert 'cataclysm: 1.65' in g3
          assert 'const sway = Math.sin(t * 0.0034) * 2.5;' in g3
          assert 'SCROLL_PRESERVE_V24' in g5
          assert 'DECISION_HIERARCHY_V23' in g5
          assert '|| "2026.09.06.25";' in g2
          assert idx.count('2026.09.06.25') == 7
          print('v25 smooth combat checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-3.js game-2.js index.html
          git commit -m 'Combat Fluide' -m 'Supprime le petit saut du héros pendant la marche et remplace ce mouvement par une marche au sol avec léger transfert de poids. Adoucit les avancées d’attaque et les réactions aux impacts du héros et des ennemis. Les effets de compétences utilisent désormais une interpolation continue et des durées plus réactives pour rendre les combats plus naturels et fluides, sans modifier les dégâts, la vitesse réelle de déplacement, l’économie, la progression ou les sauvegardes. Build 2026.09.06.25.'
          git push