# trigger-v27-1
name: Move stat points to hero v27
on:
  push:
    paths: ['.github/workflows/apply-raid-adjustment-label-v15.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move stat points into Hero
        run: |
          python <<'PY'
          from pathlib import Path

          hud=Path('game-3.js'); s=hud.read_text()
          old='''    '<div class="pbox" data-act="go" data-arg="personnage">' +'''
          new='''    '<div class="pbox" data-act="go" data-arg="heros" title="Héros · Points de statistiques">' +'''
          if old not in s: raise SystemExit('hero HUD anchor missing')
          s=s.replace(old,new,1)

          old='''        '<div class="row gap6"><span class="pname flex1">' + esc(S.playerName) + "</span>" +
          '<span class="power">' + ic("swords", 11) + fmt(S.power) + "</span>" + "</div>" +'''
          new='''        '<div class="row gap6"><span class="pname flex1">' + esc(S.playerName) + "</span>" +
          '<span class="power">' + ic("swords", 11) + fmt(S.power) + "</span>" +
          (S.statPoints > 0 ? '<span class="dot" style="position:static;flex:0 0 auto" title="Points de statistiques disponibles"></span>' : "") + "</div>" +'''
          if old not in s: raise SystemExit('hero row anchor missing')
          s=s.replace(old,new,1)

          old='''        '<div class="curr" data-act="resInfo" data-arg="pa" title="Points de Statistique" style="cursor:pointer;border-color:' + (S.statPoints > 0 ? '#FFD65E88' : 'var(--line)') + ';color:' + (S.statPoints > 0 ? '#FFD65E' : 'var(--textDim)') + '">' + ic("pa", 15) + "<b>" + fmt(S.statPoints) + "</b>" +
          '<span class="plus" data-act="go" data-arg="heros">' + ic("plus", 10) + "</span></div>" +
'''
          if old not in s: raise SystemExit('stat points chip anchor missing')
          s=s.replace(old,'',1)
          hud.write_text(s)

          home=Path('game-4.js'); h=home.read_text()
          old='''    { label: "Équipement", icon: "swords", color: "#5A7099", go: "equipement", badge: S.statPoints > 0 || S.inventory.length > 0 },'''
          new='''    { label: "Équipement", icon: "swords", color: "#5A7099", go: "equipement", badge: S.inventory.length > 0 },'''
          if old not in h: raise SystemExit('equipment badge anchor missing')
          home.write_text(h.replace(old,new,1))

          eng=Path('game-2.js'); e=eng.read_text()
          if '|| "2026.09.06.25";' not in e: raise SystemExit('APP_BUILD fallback anchor missing')
          eng.write_text(e.replace('|| "2026.09.06.25";','|| "2026.09.06.27";',1))

          idx=Path('index.html'); i=idx.read_text()
          if i.count('2026.09.06.26') != 8: raise SystemExit('Unexpected index .26 reference count')
          idx.write_text(i.replace('2026.09.06.26','2026.09.06.27'))
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert 'data-arg="heros" title="Héros · Points de statistiques"' in g3
          assert 'data-arg="pa" title="Points de Statistique"' not in g3
          assert 'Points de statistiques disponibles' in g3
          assert 'badge: S.inventory.length > 0' in g4
          assert 'badge: S.statPoints > 0 || S.inventory.length > 0' not in g4
          assert 'function scrHerosStats()' in g4
          assert 'heros: scrHerosStats' in g5
          assert 'const hop = 0;' in g3
          assert 'SCROLL_PRESERVE_V24' in g5
          assert 'DECISION_HIERARCHY_V23' in g5
          assert 'function raidIntroDifficultyMul' in g1
          assert '|| "2026.09.06.27";' in g2
          assert idx.count('2026.09.06.27') == 8
          assert 'audio-v26.js?v=2026.09.06.27' in idx
          print('v27 hero HUD checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-2.js game-3.js game-4.js index.html
          git commit -m 'Héros Épuré' -m 'Retire complètement le compteur de Points de Statistique de la rangée des ressources du HUD. Le bloc Héros à gauche ouvre désormais directement l’écran Héros où les points sont consultés et attribués. Un indicateur discret apparaît sur le bloc Héros lorsqu’il reste des points à dépenser. Le badge Équipement ne s’allume plus à cause des Points de Statistique, uniquement pour son propre contenu. Aucun changement d’économie, de progression, de sauvegarde ou d’équilibrage. Build 2026.09.06.27.'
          git push