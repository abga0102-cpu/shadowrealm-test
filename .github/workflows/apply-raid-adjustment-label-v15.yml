# trigger-v21-1
name: Apply Hick hierarchy v21
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply action hierarchy
        run: |
          python <<'PY'
          from pathlib import Path

          css=Path('style.css'); s=css.read_text()
          marker='/* HICK_ACTION_HIERARCHY_V21 */'
          if marker not in s:
              s += '''\n/* HICK_ACTION_HIERARCHY_V21\n   Une seule action dominante par zone. Les actions secondaires restent\n   disponibles mais visuellement plus calmes, afin de réduire le nombre de\n   décisions concurrentes sans supprimer de fonctionnalité. */\n:root { --primary-action-ring: rgba(127,212,255,.34); }\n[data-primary-action="true"] {\n  position: relative;\n  z-index: 1;\n  font-weight: 800;\n  transform: translateZ(0);\n  box-shadow: 0 0 0 2px var(--primary-action-ring), 0 8px 22px rgba(0,0,0,.22);\n}\n[data-secondary-action="true"] { opacity: .82; }\n[data-secondary-action="true"]:hover, [data-secondary-action="true"]:focus-visible { opacity: 1; }\n@media (prefers-reduced-motion: no-preference) {\n  [data-primary-action="true"] { transition: filter .15s ease, box-shadow .15s ease; }\n}\n'''
          css.write_text(s)

          ui=Path('game-5.js'); s=ui.read_text()
          marker='// HICK_ACTION_HIERARCHY_V21'
          if marker not in s:
              s += '''\n// HICK_ACTION_HIERARCHY_V21\n// Hiérarchie contextuelle non destructive : on ne cache aucune fonction.\n// Chaque groupe visible d'actions reçoit au maximum une action dominante.\nconst HICK_PRIMARY_HINTS_V21 = [\n  /continuer|combattre|combat|boss|réessayer|reessayer|lancer|invoquer|améliorer|ameliorer|rechercher|réclamer|reclamer|équiper|equiper|forger|valider|confirmer/i\n];\nconst HICK_SECONDARY_HINTS_V21 = /aperçu|apercu|détail|detail|info|fermer|annuler|retour/i;\nfunction hickActionTextV21(el) {\n  return ((el && (el.getAttribute("aria-label") || el.getAttribute("title") || el.textContent)) || "").replace(/\\s+/g," ").trim();\n}\nfunction hickVisibleV21(el) {\n  if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return false;\n  const r=el.getBoundingClientRect();\n  const cs=getComputedStyle(el);\n  return r.width>0 && r.height>0 && cs.display!=="none" && cs.visibility!=="hidden";\n}\nfunction hickGroupV21(el) {\n  return el.closest(".modal,.popup,.panel,.card,.screen,.page,.view,section,main") || el.parentElement || document.body;\n}\nfunction refreshActionHierarchyV21() {\n  document.querySelectorAll('[data-primary-action="true"],[data-secondary-action="true"]').forEach(function(el){\n    el.removeAttribute("data-primary-action"); el.removeAttribute("data-secondary-action");\n  });\n  const groups=new Map();\n  document.querySelectorAll("[data-act],button").forEach(function(el){\n    if (!hickVisibleV21(el)) return;\n    const g=hickGroupV21(el);\n    if (!groups.has(g)) groups.set(g,[]);\n    groups.get(g).push(el);\n  });\n  groups.forEach(function(actions){\n    if (actions.length < 2) return;\n    let primary=actions.find(function(el){ return el.getAttribute("data-primary") === "true"; });\n    if (!primary) primary=actions.find(function(el){ return HICK_PRIMARY_HINTS_V21.some(function(rx){ return rx.test(hickActionTextV21(el)); }); });\n    if (primary) primary.setAttribute("data-primary-action","true");\n    actions.forEach(function(el){\n      if (el !== primary && HICK_SECONDARY_HINTS_V21.test(hickActionTextV21(el))) el.setAttribute("data-secondary-action","true");\n    });\n  });\n}\nlet hickRefreshQueuedV21=false;\nfunction queueActionHierarchyV21(){\n  if(hickRefreshQueuedV21) return;\n  hickRefreshQueuedV21=true;\n  requestAnimationFrame(function(){ hickRefreshQueuedV21=false; refreshActionHierarchyV21(); });\n}\nfunction startActionHierarchyV21(){\n  refreshActionHierarchyV21();\n  new MutationObserver(queueActionHierarchyV21).observe(document.body,{childList:true,subtree:true});\n}\nif(document.readyState === "loading") document.addEventListener("DOMContentLoaded",startActionHierarchyV21,{once:true});\nelse startActionHierarchyV21();\n'''
          ui.write_text(s)

          eng=Path('game-2.js'); s=eng.read_text()
          if '|| "2026.09.06.21";' not in s:
              if '|| "2026.09.06.20";' not in s: raise SystemExit('APP_BUILD .20 anchor missing')
              s=s.replace('|| "2026.09.06.20";', '|| "2026.09.06.21";', 1)
          eng.write_text(s)

          idx=Path('index.html'); s=idx.read_text()
          if '2026.09.06.21' not in s:
              if '2026.09.06.20' not in s: raise SystemExit('index .20 anchor missing')
              s=s.replace('2026.09.06.20','2026.09.06.21')
          idx.write_text(s)
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); ui=Path('game-5.js').read_text(); css=Path('style.css').read_text(); idx=Path('index.html').read_text()
          assert 'HICK_ACTION_HIERARCHY_V21' in css and 'HICK_ACTION_HIERARCHY_V21' in ui
          assert 'data-primary-action' in ui and 'data-secondary-action' in ui
          assert '|| "2026.09.06.21";' in g2
          assert idx.count('2026.09.06.21') == 7
          # Conserver le rééquilibrage précédent et les correctifs d'accessibilité.
          assert 'function raidIntroDifficultyMul' in g1
          assert 'if (level <= 1) return 0.65;' in g1 and 'if (level === 2) return 0.80;' in g1
          assert 'const firstBossMul = opts.boss && opts.floor === 10 && !opts.noFastback ? 0.80 : 1;' in g2
          assert 'ACCESSIBILITY_SIMPLICITY_V20' in css and 'ACCESSIBILITY_KEYBOARD_V20' in ui
          assert 'Math.floor(dmg * 0.30)' in g2
          seg=g2[g2.index('function itemUpgradePreview'):g2.index('function itemUpgradeChance')]
          assert seg.count('0.005') >= 2
          print('v21 hierarchy checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add style.css game-5.js game-2.js index.html
          git commit -m 'Hiérarchie Claire' -m 'Réduit la concurrence visuelle entre les choix : chaque zone d’actions met désormais en avant au maximum une action principale contextuelle, tandis que les actions secondaires comme retour, détails, annulation ou fermeture restent accessibles mais plus discrètes. Aucune fonctionnalité n’est supprimée et aucun changement n’est apporté à l’économie, aux sauvegardes ou à l’équilibrage. Conserve le rééquilibrage des premiers Raids et du Boss 10 ainsi que les correctifs d’accessibilité. Build 2026.09.06.21.'
          git push