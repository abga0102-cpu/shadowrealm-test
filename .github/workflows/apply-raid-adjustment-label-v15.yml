# trigger-v24-1
name: Fix combat scroll v24
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve scroll during live rerenders
        run: |
          python <<'PY'
          from pathlib import Path
          ui=Path('game-5.js'); s=ui.read_text()
          marker='// SCROLL_PRESERVE_V24'
          if marker not in s:
              anchor='/* ---------------- go ---------------- */'
              if anchor not in s: raise SystemExit('go anchor missing')
              block=r'''
// SCROLL_PRESERVE_V24
// Les rafraîchissements de combat peuvent reconstruire #screen. On mémorise
// sa position tant que la route ne change pas, afin de ne jamais remonter
// automatiquement le joueur en haut de la page pendant une action live.
const renderBaseV24=render;
render=function(){
  const screen=document.getElementById("screen");
  const beforeRoute=typeof route!=="undefined"?route:null;
  const beforeTop=screen?screen.scrollTop:0;
  const beforeMax=screen?Math.max(0,screen.scrollHeight-screen.clientHeight):0;
  const wasNearBottom=screen?beforeMax-beforeTop<=24:false;
  const out=renderBaseV24.apply(this,arguments);
  const restore=function(){
    const sc=document.getElementById("screen");
    if(!sc||beforeRoute!==(typeof route!=="undefined"?route:null))return;
    const max=Math.max(0,sc.scrollHeight-sc.clientHeight);
    sc.scrollTop=wasNearBottom?max:Math.min(beforeTop,max);
  };
  restore();
  requestAnimationFrame(restore);
  return out;
};

'''
              s=s.replace(anchor,block+anchor,1)
          ui.write_text(s)

          eng=Path('game-2.js'); e=eng.read_text()
          if '|| "2026.09.06.23";' not in e: raise SystemExit('APP_BUILD .23 anchor missing')
          eng.write_text(e.replace('|| "2026.09.06.23";', '|| "2026.09.06.24";', 1))

          idx=Path('index.html'); h=idx.read_text()
          if h.count('2026.09.06.23') != 7: raise SystemExit('Unexpected index build reference count')
          idx.write_text(h.replace('2026.09.06.23','2026.09.06.24'))
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); ui=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert ui.count('SCROLL_PRESERVE_V24') == 1
          assert 'const renderBaseV24=render;' in ui
          assert 'wasNearBottom' in ui and 'requestAnimationFrame(restore)' in ui
          assert 'DECISION_HIERARCHY_V23' in ui
          assert '|| "2026.09.06.24";' in g2
          assert idx.count('2026.09.06.24') == 7
          assert 'function raidIntroDifficultyMul' in g1
          print('v24 scroll preservation checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-5.js game-2.js index.html
          git commit -m 'Scroll Stable' -m 'Conserve la position de défilement pendant les rafraîchissements live du combat. Le joueur reste exactement à sa position, ou collé en bas s’il y était déjà, tant qu’il ne change pas d’écran. Aucun changement d’économie, de progression, de sauvegarde ou d’équilibrage. Build 2026.09.06.24.'
          git push