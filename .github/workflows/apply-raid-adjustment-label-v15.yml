name: Apply boss normalization v16
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize campaign boss scaling
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('game-2.js')
          s = p.read_text()
          if 'function campaignBossStatMul(floor)' not in s:
              anchor = 'function makeEnemy(mode, opts) {\n'
              if anchor not in s:
                  raise SystemExit('makeEnemy anchor missing')
              target = '\n'.join([
                  'function campaignBossStatMul(floor) {',
                  '  // La rareté du Boss reste visuelle et thématique, mais ne provoque plus de',
                  '  // saut brutal de statistiques. Boss 10 à 100 suivent une échelle régulière.',
                  '  const bossNo = Math.max(1, Math.min(10, Math.floor((Number(floor) || 10) / RULES.BOSS_EVERY)));',
                  '  return 1 + 0.06 * (bossNo - 1);',
                  '}',
                  ''
              ])
              s = s.replace(anchor, target + '\n' + anchor, 1)
          old = '    hp = Math.floor(enemyHP(opts.floor) * t.hpMul * mulH * tier.mul);\n    dmg = Math.floor(enemyDamage(opts.floor) * t.dmgMul * mulD * tier.mul);'
          new = '    const statMul = opts.boss ? campaignBossStatMul(opts.floor) : tier.mul;\n    hp = Math.floor(enemyHP(opts.floor) * t.hpMul * mulH * statMul);\n    dmg = Math.floor(enemyDamage(opts.floor) * t.dmgMul * mulD * statMul);'
          if new not in s:
              if old not in s:
                  raise SystemExit('campaign stat multiplier anchor missing')
              s = s.replace(old, new, 1)
          if '|| "2026.09.06.16";' not in s:
              if '|| "2026.09.06.14";' not in s:
                  raise SystemExit('APP_BUILD fallback anchor missing')
              s = s.replace('|| "2026.09.06.14";', '|| "2026.09.06.16";', 1)
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text()
          if '2026.09.06.16' not in s:
              if '2026.09.06.15' not in s:
                  raise SystemExit('build .15 anchor missing')
              s = s.replace('2026.09.06.15', '2026.09.06.16')
          p.write_text(s)
          PY
      - name: Syntax and balance checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python -c "vals=[1+0.06*(i-1) for i in range(1,11)]; assert all(vals[i]>vals[i-1] for i in range(1,len(vals))); assert abs(vals[0]-1)<1e-9 and abs(vals[-1]-1.54)<1e-9; print(vals)"
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already applied'
            exit 0
          fi
          git add game-2.js index.html
          git commit -m 'Boss Normalisés' -m 'Normalise la difficulté des Boss de campagne pour supprimer les bonds liés à leur rareté. Les Boss 10 à 100 utilisent désormais un multiplicateur statistique régulier de x1,00 à x1,54, tandis que leur rareté, identité et mécaniques restent inchangées. Le traitement spécifique du Boss 40 est conservé. Cela réduit le mur du Boss 50 et empêche le Boss 60 de retomber artificiellement en difficulté. Build 2026.09.06.16.'
          git push
