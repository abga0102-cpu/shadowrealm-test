# trigger-v18-5
name: Apply equipment upgrade clarity v18
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dust 0.50 percent
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('game-2.js')
          s = p.read_text()
          pairs = [
              ('next = Math.round(Number(it.baseDamage || 0) * (1 + steps * 0.00375) * 100) / 100;',
               'next = Math.round(Number(it.baseDamage || 0) * (1 + steps * 0.005) * 100) / 100;'),
              ('next = Math.round(Number(it.baseHp || 0) * (1 + steps * 0.00375) * 100) / 100;',
               'next = Math.round(Number(it.baseHp || 0) * (1 + steps * 0.005) * 100) / 100;'),
          ]
          for old,new in pairs:
              if new not in s:
                  if old not in s: raise SystemExit('upgrade anchor missing: ' + old)
                  s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          e=Path('game-2.js').read_text()
          u=Path('game-5.js').read_text()
          h=Path('index.html').read_text()
          seg=e[e.index('function itemUpgradePreview'):e.index('function itemUpgradeChance')]
          assert seg.count('0.005') >= 2
          assert '0.00375' not in seg and '0.0035' not in seg
          assert 'BONUS DE SANTÉ' in u
          assert 'PUISSANCE TOTALE' in u
          assert '2026.09.06.18' in h
          assert '|| "2026.09.06.18";' in e
          assert 'Math.floor(dmg * 0.30)' in e
          assert 'function campaignBossStatMul(floor)' in e
          print('v18 checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already applied'
            exit 0
          fi
          git add game-2.js
          git commit -m 'Stats Équipement' -m 'Augmente définitivement l’efficacité des Poussières à 0,50 % de la statistique de référence par niveau réussi. L’affichage détaillé déjà présent conserve Santé de base, Bonus de santé et Puissance totale, sans niveau d’amélioration redondant. Build 2026.09.06.18.'
          git push
