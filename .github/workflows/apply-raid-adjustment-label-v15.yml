# trigger-v30-3
name: Sanctuary merge v30
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align build anchor
        run: sed -i 's/2026.09.06.28/2026.09.06.29/' game-2.js
      - name: Apply sanctuary merge patch
        run: python .github/sanctuaire_merge_v30.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert 'SANCT_MERGE_ORDER' in g4
          assert 'SANCT_BOARD_SIZE = 16' in g4
          assert 'function sanctSupplierPrice(level)' in g4
          assert '2500*Math.max(1,level)*Math.max(1,level)' in g4
          assert 'function sanctMergeState()' in g4
          assert 'Fusion manuelle' in g4
          assert 'ACTION RECOMMANDÉE' in g4
          assert 'Livre de Fusion' in g4
          assert 'sanctMergeBuy:' in g5
          assert 'sanctMergeTile:' in g5
          assert 'sanctRecipeCraft:' in g5
          assert 'S.gold-=price' in g5
          assert 'st.mergeBoard[sel]=null; st.mergeBoard[i]=nx' in g5
          sanct=g5[g5.index('  // sanctuaire'):g5.index('\n  // tree',g5.index('  // sanctuaire'))]
          assert 'S.minerai-=' not in sanct and 'S.eclat-=' not in sanct and 'S.essence-=' not in sanct and 'S.poussiere-=' not in sanct
          assert 'const hop = 0;' in g3
          assert 'SCROLL_PRESERVE_V24' in g5
          assert 'DECISION_HIERARCHY_V23' in g5
          assert '|| "2026.09.06.30";' in g2
          assert idx.count('2026.09.06.30') >= 7
          print('v30 sanctuary merge checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-2.js game-4.js game-5.js index.html
          git commit -m 'Sanctuaire Merge' -m 'Transforme complètement le Sanctuaire en mini-jeu de merge manuel. L’Or achète une couleur de base au prix fixe du niveau d’approvisionnement, chaque achat remplit sa jauge, et deux couleurs identiques fusionnent manuellement vers la rareté suivante sur un plateau de 16 cases. Les anciennes ressources Minerai, Éclat, Essence et Poussière ne sont plus consommées par le Sanctuaire. Le Livre de Fusion, les recettes secrètes, l’action recommandée, les Sceaux de stabilité et les accélérateurs sont conservés et adaptés au nouveau système. Aucun effacement de sauvegarde. Build 2026.09.06.30.'
          git push
