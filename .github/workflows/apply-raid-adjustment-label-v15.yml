# trigger-v36-1
name: Image stability v36
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply image stability fix
        run: python .github/fix_image_jump_v36.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert 'ARENA_STABILITY_V36' in g3 and 'arenaCombatRef !== combat' in g3
          assert 'SANCTUARY_GOLD_REBASE_V35' in g1
          assert 'Fusion par glisser-déposer' in g4
          assert 'SANCTUARY_DRAG_MERGE_V34' in g5
          assert '2026.09.06.36' in g2 and '2026.09.06.36' in idx
          print('v36 image stability checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-3.js game-2.js index.html
          git commit -m 'Image Stable' -m 'Supprime le sursaut visuel occasionnel de l’arène en conservant les positions lissées du héros et des ennemis lors des re-rendus d’interface. Les positions ne sont réinitialisées que lorsqu’un nouveau combat commence réellement. Les animations, combats, Sanctuaire, sauvegardes et économies restent inchangés. Build 2026.09.06.36.'
          git push
