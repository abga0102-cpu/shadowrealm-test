# trigger-v28-1
name: Sanctuary clarity v28
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sanctuary UX patch
        run: python .github/sanctuaire_v28.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); idx=Path('index.html').read_text()
          assert 'function sanctRecipeAffordableUI' in g4
          assert 'ACTION RECOMMANDÉE' in g4
          assert 'MAÎTRISE DU SANCTUAIRE' in g4
          assert 'sanctPrepare' in g4 and 'sanctPrepare: (a)' in g5
          assert 'Les coûts et récompenses du Sanctuaire n’ont pas été modifiés.' in g4
          assert 'const hop = 0;' in g3
          assert 'SCROLL_PRESERVE_V24' in g5
          assert 'DECISION_HIERARCHY_V23' in g5
          assert 'function raidIntroDifficultyMul' in g1
          assert '|| "2026.09.06.28";' in g2
          assert idx.count('2026.09.06.28') >= 7
          print('v28 sanctuary checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-2.js game-4.js game-5.js index.html
          git commit -m 'Sanctuaire Clair' -m 'Rend le Sanctuaire plus lisible et utile sans modifier son économie : progression des recettes, action recommandée, indication immédiate des recettes réalisables, coûts et récompenses visibles, bouton Préparer en un toucher et état clair des ressources insuffisantes. Les recettes, coûts, récompenses, sauvegardes et règles de fusion restent inchangés. Build 2026.09.06.28.'
          git push