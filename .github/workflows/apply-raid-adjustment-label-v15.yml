# trigger-v39-1
name: Campaign world navigation v39
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply campaign world navigation
        run: python .github/home_world_v37.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g3=Path('game-3.js').read_text(); g4=Path('game-4.js').read_text(); g5=Path('game-5.js').read_text(); css=Path('style.css').read_text(); idx=Path('index.html').read_text()
          home=g4[g4.find('function scrAccueil()'):g4.find('/* ---------------- PERSONNAGE')]
          assert 'CAMPAIGN_WORLD_NAV_V37' in g4
          assert 'worldRebirth' in g4 and 'go:"rebirth"' in g4
          assert 'worldEquip' in g4 and 'worldDev' in g4 and 'worldDefis' in g4
          assert 'worldMenuPanel' in g4 and 'go: "ascension"' in g4
          assert 'progressionGoalHTML(S) +' not in home
          assert 'homeNavPrimary' not in home and 'homeMore mt4' not in home
          assert 'CAMPAIGN_WORLD_NAV_V37' in css and '.campaignWorld' in css
          assert 'ARENA_STABILITY_V36' in g3 and 'arenaCombatRef !== combat' in g3
          assert 'SANCTUARY_GOLD_REBASE_V35' in g1
          assert 'Fusion par glisser-déposer' in g4 and 'SANCTUARY_DRAG_MERGE_V34' in g5
          assert '2026.09.06.39' in g2 and '2026.09.06.39' in idx
          print('v39 campaign world navigation checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-4.js style.css game-2.js index.html
          git commit -m 'Campagne Monde' -m 'Intègre les accès principaux directement dans l’arène sans modifier sa taille ni sa structure. Rebirth devient visible en haut à gauche, Équipement, Développement et Défis flottent dans le monde, tandis que Clan, Boutique, Ascension, Événement et Classement sont regroupés dans un menu compact superposé. Les grilles et fenêtres de navigation sous la Forge sont retirées afin de réduire fortement le scroll de l’écran Campagne. La Forge, le combat, les compétences, les sauvegardes et les économies restent inchangés. Build 2026.09.06.39.'
          git push
