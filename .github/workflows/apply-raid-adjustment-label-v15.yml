# trigger-v17-2
name: Apply dragon flight balance v17
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Soften melee penalty during Dragon flight
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('game-2.js')
          s = p.read_text()
          old = '''      // in the air a sword swings at nothing; arrows and spells still reach him
      if (src !== "weapon" || RANGED_IDS.indexOf(D.weapon) >= 0) return dmg;
      c.floats.push({ id: rid(), x: e.x, val: 0, crit: false, color: "#B15CF6",
        born: Date.now(), text: "HORS D'ATTEINTE" });
      return 0;'''
          new = '''      // Ranged weapons and skills keep full damage. Melee can still clip the Dragon
      // during Envol, but at only 30%, so the phase remains a meaningful disadvantage
      // without turning a melee build completely off for four seconds.
      if (src !== "weapon" || RANGED_IDS.indexOf(D.weapon) >= 0) return dmg;
      const glancing = Math.max(1, Math.floor(dmg * 0.30));
      c.floats.push({ id: rid(), x: e.x, val: glancing, crit: false, color: "#B15CF6",
        born: Date.now(), text: "ENVOL · 30%" });
      return glancing;'''
          if new not in s:
              if old not in s:
                  raise SystemExit('Dragon Envol anchor missing')
              s = s.replace(old, new, 1)
          if '|| "2026.09.06.17";' not in s:
              if '|| "2026.09.06.16";' not in s:
                  raise SystemExit('APP_BUILD fallback .16 missing')
              s = s.replace('|| "2026.09.06.16";', '|| "2026.09.06.17";', 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if '2026.09.06.17' not in s:
              if '2026.09.06.16' not in s:
                  raise SystemExit('build .16 anchor missing')
              s = s.replace('2026.09.06.16', '2026.09.06.17')
          p.write_text(s)
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          s=Path('game-2.js').read_text()
          assert 'Math.floor(dmg * 0.30)' in s
          assert 'ENVOL · 30%' in s
          assert 'return glancing;' in s
          assert 'function campaignBossStatMul(floor)' in s
          assert '|| "2026.09.06.17";' in s
          h=Path('index.html').read_text()
          assert '2026.09.06.17' in h
          print('Dragon Envol melee damage = 30%; boss normalization preserved')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already applied'
            exit 0
          fi
          git add game-2.js index.html
          git commit -m 'Envol Dragon' -m 'Réduit la pénalité de mêlée pendant l’Envol du Dragon des Cendres. Les attaques d’arme de mêlée infligent désormais 30 % de leurs dégâts au lieu de 0 %, tandis que les armes à distance et les compétences restent inchangées. La durée de l’Envol, le Souffle, l’Intimidation et la normalisation des Boss restent identiques. Build 2026.09.06.17.'
          git push
