# trigger-v19-2
name: Apply accessible interface v19
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply accessibility and simplicity pass
        run: |
          python <<'PY'
          from pathlib import Path

          css = Path('style.css')
          s = css.read_text()
          marker = '/* ACCESSIBILITY_SIMPLICITY_V19 */'
          css_lines = [
            '/* ACCESSIBILITY_SIMPLICITY_V19 */',
            'html { -webkit-text-size-adjust: 100%; }',
            'body { overflow-x: hidden; }',
            'button, [data-act], [role="button"], input, select { touch-action: manipulation; }',
            'button:focus-visible, [data-act]:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #7FD4FF; outline-offset: 2px; }',
            'button:disabled, [aria-disabled="true"] { opacity: .48; cursor: not-allowed; filter: saturate(.65); }',
            '@media (pointer: coarse) {',
            '  button, [role="button"] { min-height: 44px; }',
            '  input, select, textarea { min-height: 44px; font-size: 16px; }',
            '}',
            '@media (prefers-reduced-motion: reduce) {',
            '  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .001ms !important; }',
            '}',
          ]
          if marker not in s:
              s += '\n' + '\n'.join(css_lines) + '\n'
          css.write_text(s)

          ui = Path('game-5.js')
          s = ui.read_text()
          marker = '// ACCESSIBILITY_KEYBOARD_V19'
          js_lines = [
            '// ACCESSIBILITY_KEYBOARD_V19',
            'document.addEventListener("keydown", function accessibilityActivate(e) {',
            '  if (e.key !== "Enter" && e.key !== " ") return;',
            '  const target = e.target && e.target.closest ? e.target.closest("[data-act]") : null;',
            '  if (!target || target.getAttribute("aria-disabled") === "true") return;',
            '  e.preventDefault();',
            '  target.click();',
            '});',
            'function enhanceInteractiveAccessibility(root) {',
            '  const scope = root && root.querySelectorAll ? root : document;',
            '  scope.querySelectorAll("[data-act]").forEach(function (el) {',
            '    if (!el.hasAttribute("tabindex") && el.tagName !== "BUTTON") el.setAttribute("tabindex", "0");',
            '    if (!el.hasAttribute("role") && el.tagName !== "BUTTON") el.setAttribute("role", "button");',
            '    if (!el.hasAttribute("aria-label")) {',
            '      const label = (el.getAttribute("title") || el.textContent || "").replace(/\\s+/g, " ").trim();',
            '      if (label) el.setAttribute("aria-label", label.slice(0, 120));',
            '    }',
            '  });',
            '}',
            'document.addEventListener("DOMContentLoaded", function () {',
            '  enhanceInteractiveAccessibility(document);',
            '  const observer = new MutationObserver(function (mutations) {',
            '    mutations.forEach(function (m) {',
            '      m.addedNodes.forEach(function (node) {',
            '        if (node && node.nodeType === 1) enhanceInteractiveAccessibility(node);',
            '      });',
            '    });',
            '  });',
            '  observer.observe(document.body, { childList: true, subtree: true });',
            '});',
          ]
          if marker not in s:
              s += '\n' + '\n'.join(js_lines) + '\n'
          ui.write_text(s)

          eng = Path('game-2.js')
          s = eng.read_text()
          if '|| "2026.09.06.19";' not in s:
              if '|| "2026.09.06.18";' not in s: raise SystemExit('APP_BUILD .18 anchor missing')
              s = s.replace('|| "2026.09.06.18";', '|| "2026.09.06.19";', 1)
          eng.write_text(s)

          idx = Path('index.html')
          s = idx.read_text()
          if '2026.09.06.19' not in s:
              if '2026.09.06.18' not in s: raise SystemExit('index .18 anchor missing')
              s = s.replace('2026.09.06.18', '2026.09.06.19')
          idx.write_text(s)
          PY
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          python <<'PY'
          from pathlib import Path
          css=Path('style.css').read_text()
          ui=Path('game-5.js').read_text()
          eng=Path('game-2.js').read_text()
          idx=Path('index.html').read_text()
          assert 'ACCESSIBILITY_SIMPLICITY_V19' in css
          assert 'min-height: 44px' in css
          assert 'prefers-reduced-motion: reduce' in css
          assert 'ACCESSIBILITY_KEYBOARD_V19' in ui
          assert 'MutationObserver' in ui
          assert '|| "2026.09.06.19";' in eng
          assert '2026.09.06.19' in idx
          assert 'Math.floor(dmg * 0.30)' in eng
          assert 'function campaignBossStatMul(floor)' in eng
          seg=eng[eng.index('function itemUpgradePreview'):eng.index('function itemUpgradeChance')]
          assert seg.count('0.005') >= 2
          print('v19 checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already applied'
            exit 0
          fi
          git add style.css game-5.js game-2.js index.html
          git commit -m 'Interface Accessible' -m 'Améliore l’accessibilité et la simplicité d’utilisation sans modifier l’équilibrage : zones tactiles renforcées sur mobile, focus clavier visible, activation clavier des contrôles personnalisés, états désactivés plus clairs, prévention du zoom involontaire sur les champs iOS et respect du réglage Réduire les animations. Aucun changement de sauvegarde, d’économie ou de combat. Build 2026.09.06.19.'
          git push
