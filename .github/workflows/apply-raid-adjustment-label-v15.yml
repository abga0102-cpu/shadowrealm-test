# trigger-v31-2
name: Economy refund v31
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply economy refund
        run: python .github/economy_refund_v31.py
      - name: Syntax checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          node --check audio-v26.js
      - name: Regression checks
        run: |
          python <<'PY'
          from pathlib import Path
          g1=Path('game-1.js').read_text(); g2=Path('game-2.js').read_text(); g4=Path('game-4.js').read_text(); idx=Path('index.html').read_text()
          assert '250*Math.max(1,level)*Math.max(1,level)' in g4
          assert '2500*Math.max(1,level)*Math.max(1,level)' not in g4
          assert 'ECONOMY_REFUND_V31' in g1 and 'sanctuaryMergeRefundV31' in g1
          for x in ['refund.minerai += 200','refund.eclat += 20; refund.essence += 20','refund.poussiere += 150; refund.minerai += 250','refund.eclat += 50; refund.essence += 50','refund.poussiere += 500; refund.essence += 100']:
              assert x in g1
          assert 'autonomyGoldRebaseV31' in g1
          assert 'harvestRates(merged).gold * secs / 3600' in g1
          assert 'gold: raidReward("or", s.raids.or.level) * 0.25' in g1
          assert 'SANCT_MERGE_ORDER' in g4 and 'SANCT_BOARD_SIZE = 16' in g4
          assert '2026.09.06.31' in g2 and '2026.09.06.31' in idx
          print('v31 economy checks passed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Already applied'; exit 0; fi
          git add game-1.js game-2.js game-4.js index.html
          git commit -m 'Économie Merge Rééquilibrée' -m 'Réduit de 90 % le prix d’achat des couleurs du Sanctuaire sans changer le système Or -> couleurs -> merge manuel. Rembourse une fois les ressources historiques dont la dépense est prouvée par les recettes découvertes de l’ancien Sanctuaire. Revalorise aussi la réserve d’Or d’Autonomie encore non réclamée au taux actuel de 25 % du Raid Or par heure. Aucun effacement de sauvegarde. Build 2026.09.06.31.'
          git push
