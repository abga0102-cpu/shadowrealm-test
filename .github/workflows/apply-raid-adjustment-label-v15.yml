name: Apply raid adjustment label v15
on:
  push:
    paths:
      - '.github/workflows/apply-raid-adjustment-label-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clearer raid adjustment wording
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('game-5.js')
          s=p.read_text()
          old='''      '<span style="color:var(--goldLit)">' + fmt(pay.repaid) + ' utilisé' + (pay.repaid > 1 ? 's' : '') +\n      ' pour le rééquilibrage historique</span><br>' +'''
          new='''      '<span style="color:var(--goldLit)">Ajustement de progression : -' + fmt(pay.repaid) + " " + meta.reward + '</span><br>' +'''
          if old not in s:
            raise SystemExit('raid result wording anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          if '2026.09.06.14' not in s:
            raise SystemExit('build .14 anchor missing')
          p.write_text(s.replace('2026.09.06.14','2026.09.06.15'))
          PY
      - name: Syntax check
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-5.js index.html
          git commit -m 'Ajustement Progression' -m 'Clarifie le résultat des Raids lorsqu’une ancienne sauvegarde rembourse encore un ajustement économique. Le texte « utilisés pour le rééquilibrage historique » devient « Ajustement de progression : -X ressource », tandis que la récompense produite et le montant réellement crédité restent visibles. Aucun changement aux montants ni à l’économie. Build 2026.09.06.15.'
          git push
