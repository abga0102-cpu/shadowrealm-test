name: Apply Rebirth Caps V171
on:
  push:
    paths:
      - '.github/workflows/apply-rebirth-caps-v171.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/rebirth_caps_v171.py
      - run: node --check game-1.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-1.js index.html
          git diff --cached --quiet || git commit -m "Apply Rebirth caps V171"
          git push
