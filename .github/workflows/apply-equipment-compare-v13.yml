name: Apply equipment compare v13
on:
  push:
    paths:
      - '.github/workflows/apply-equipment-compare-v13.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build 2026.09.06.13
        run: python3 scripts/apply_v13.py
      - name: Syntax and regression checks
        run: |
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          cat game-1.js game-2.js game-3.js game-4.js game-5.js > /tmp/all.js
          node --check /tmp/all.js
          grep -q '2026.09.06.13' index.html
          grep -q 'equipCompareSticky' game-4.js
          grep -q 'Équipements stockés' game-4.js
          grep -q 'v13 equipment sticky comparison' style.css
          grep -q 'position:sticky' style.css
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-2.js game-4.js style.css index.html
          git commit -m "Comparaison Équipement" -m "Réorganise l’écran Équipement : l’équipement porté est désormais placé en haut, les statistiques de combat sont positionnées juste au-dessus des équipements stockés et restent visibles pendant le défilement. Le mode test continue d’afficher les valeurs actuelles et les valeurs après test afin de comparer un objet du stock sans perdre les statistiques de vue. Build 2026.09.06.13."
          git push
