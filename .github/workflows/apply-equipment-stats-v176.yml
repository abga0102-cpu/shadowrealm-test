name: Apply Equipment Stats V176
on:
  push:
    branches: [main]
    paths:
      - 'equipment-stats-collapse-v176.js'
      - '.github/equipment_stats_collapse_v176.py'
      - '.github/workflows/apply-equipment-stats-v176.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        run: python3 .github/equipment_stats_collapse_v176.py
      - name: Syntax check
        run: node --check equipment-stats-collapse-v176.js
      - name: Verify
        run: |
          grep -q 'Equipment Stats V176' index.html
          grep -q 'equipment-stats-collapse-v176.js?v=2026.09.08.176' index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy collapsible combat stats V176'
          git push origin main
