name: Apply Boss 40 v6
on:
  push:
    paths:
      - '.github/workflows/apply-boss40-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted Boss 40 balance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game-2.js')
          s = p.read_text()
          old = '    const mulH = opts.boss ? 6 : opts.elite ? 2.3 : 1;'
          new = '    const mulH = opts.boss ? (opts.floor === 40 ? 5.1 : 6) : opts.elite ? 2.3 : 1;'
          if old not in s:
              raise SystemExit('Boss HP pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('|| "2026.09.06.5";', '|| "2026.09.06.6";', 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if '2026.09.06.5' not in s:
              raise SystemExit('Build .5 not found in index')
          p.write_text(s.replace('2026.09.06.5', '2026.09.06.6'))
          PY
          node --check game-2.js
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-2.js index.html
          git commit -m "Boss 40 ajusté" -m "Réduit uniquement les PV du Boss de l’étage 40 de 15 %, sans modifier les calculs ni la progression de difficulté des Boss suivants. Build 2026.09.06.6."
          git push
