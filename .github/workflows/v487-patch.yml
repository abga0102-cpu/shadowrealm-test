name: V487 patch
on:
  push:
    branches: [balance/v487-mega-unlock-level15]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/v487-mega-unlock-level15
      - name: Apply V487
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('weekly-mega-v71.js')
          s=p.read_text()
          assert 'const UNLOCK_LEVEL=18;' in s
          s=s.replace('const UNLOCK_LEVEL=18;','const UNLOCK_LEVEL=15;',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          assert 'shadowreach-build" content="2026.09.30.486"' in s
          assert 'weekly-mega-v71.js?v=2026.09.15.330' in s
          s=s.replace('shadowreach-build" content="2026.09.30.486"','shadowreach-build" content="2026.09.30.487"',1)
          s=s.replace('weekly-mega-v71.js?v=2026.09.15.330','weekly-mega-v71.js?v=2026.09.30.487',1)
          s=s.replace("var V='2026.09.30.486'","var V='2026.09.30.487'",1)
          p.write_text(s)

          p=Path('tests/phase-weekly-mega-render-lifecycle.spec.js')
          s=p.read_text()
          s += '''\n\ntest('V487 unlocks Mega Boss at hero level 15 while preserving history unlock', async ({ page }) => {\n  expect(source).toContain('const UNLOCK_LEVEL=15');\n  await page.goto('/index.html?smoke=1');\n  await page.waitForFunction(() => typeof megaRaidUnlocked === 'function' && window.__srMegaRewardsV329);\n  const out = await page.evaluate(() => ({\n    level14: megaRaidUnlocked({level:14,megaBossClears:{}}),\n    level15: megaRaidUnlocked({level:15,megaBossClears:{}}),\n    history: megaRaidUnlocked({level:1,megaBossClears:{'10':true}}),\n    advertised: window.__srMegaRewardsV329.unlockLevel\n  }));\n  expect(out).toEqual({level14:false,level15:true,history:true,advertised:15});\n});\n'''
          p.write_text(s)
          PY
          rm .github/workflows/v487-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weekly-mega-v71.js index.html tests/phase-weekly-mega-render-lifecycle.spec.js .github/workflows/v487-patch.yml
          git commit -m 'V487: unlock Mega Boss at hero level 15'
          git push origin HEAD:balance/v487-mega-unlock-level15
