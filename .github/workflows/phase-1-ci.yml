name: Phase 1 regression guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: phase-1-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Static game regression
    runs-on: ubuntu-24.04
    # Full baseline + current browser suites take ~46 minutes each on CI.
    # Keep the complete regression comparison; allow both to finish.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .phase1-base

      - name: Checkout previous main revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          path: .phase1-base

      - name: Set up Node for test tooling only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve merged PR architecture context
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"${GITHUB_SHA}\") | .number" | sed -n '1p')"
          if [ -n "$pr_number" ]; then
            echo "ARCH_MERGED_VIA_PR=1" >> "$GITHUB_ENV"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.body // ""' > .phase1-associated-pr-body.txt
          else
            echo "ARCH_MERGED_VIA_PR=0" >> "$GITHUB_ENV"
            : > .phase1-associated-pr-body.txt
          fi

      - name: Enforce architecture-first file placement
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          PR_BODY_FILE: ${{ github.event_name == 'push' && '.phase1-associated-pr-body.txt' || '' }}
        run: node tests/architecture-file-placement-guard.js .phase1-base .

      - name: Install development test tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate save import payloads
        run: node tests/import-save-validation-v508.test.js

      - name: Compare historical Node source contracts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: node tests/source-contract-ratchet.js .phase1-base .

      - name: Verify recovery preserves active saves before replacement
        run: node tests/restore-backup-failclosed-v509.test.js

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Verify save import in Chromium and iPhone WebKit
        run: npx playwright test -c tests/playwright.config.js tests/phase-import-validation-v508.spec.js

      - name: Verify restoration in Chromium and iPhone WebKit
        run: npx playwright test -c tests/playwright.config.js tests/phase-restore-backup-v509.spec.js --reporter=list

      - name: Enforce moving legacy smoke ratchet
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: node tests/smoke-ratchet.js .phase1-base .

      - name: Prepare Playwright comparison baseline
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: node tests/prepare-playwright-baseline.js .phase1-base

      # Diagnostic only: compare the two intermittently failing WebKit navigation
      # scenarios on the exact PR baseline and head. The full ratchet below
      # remains the release gate; these observations never suppress its failures.
      - name: Diagnose WebKit Home navigation on baseline and Forge branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/forge-panel-literal-newline-syntax-v512'
        shell: bash
        run: |
          set -uo pipefail
          specs=(tests/phase-ui-stability-observer-removal-proof.spec.js tests/phase4e-home-layout-ownership.spec.js)
          for revision in baseline current; do
            if [ "$revision" = baseline ]; then root=".phase1-base"; else root="."; fi
            echo "::group::WebKit isolated navigation: $revision (3 repetitions per test)"
            set +e
            (cd "$root" && CI=1 "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test -c tests/playwright.config.js "${specs[@]}" --project=webkit-iphone --repeat-each=3 --workers=1 --reporter=line) > "$GITHUB_WORKSPACE/.phase1-diagnostic-${revision}.log" 2>&1
            status=$?
            set -e
            echo "WebKit isolated $revision exit=$status (diagnostic; NOT a release gate)"
            tail -n 100 "$GITHUB_WORKSPACE/.phase1-diagnostic-${revision}.log"
            echo "::endgroup::"
          done

      - name: Enforce moving Playwright regression ratchet
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          PHASE1_SMOKE_RATCHET_DONE: '1'
        run: node tests/playwright-ratchet.js .phase1-base .

      - name: Run standalone static localhost regression tests
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            .phase1-diagnostic-*.log
          if-no-files-found: ignore
          retention-days: 7
