name: Apply recycle boss v9
on:
  push:
    paths:
      - '.github/workflows/apply-recycle-boss-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build 2026.09.06.9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:80]}')
              s=s.replace(old,new,count); p.write_text(s)

          # Boss: slightly lower damage; on defeat always return exactly one floor,
          # ignoring a checkpoint that may itself be the boss floor.
          rep('game-2.js','const mulD = opts.boss ? 1.8 : opts.elite ? 1.4 : 1;','const mulD = opts.boss ? 1.7 : opts.elite ? 1.4 : 1;')
          rep('game-2.js','if (c.boss) { s.pendingBossFloor = s.floor; s.floor = Math.max(cp, s.floor - 1); }','if (c.boss) { s.pendingBossFloor = s.floor; s.floor = Math.max(1, s.floor - 1); }')
          rep('game-2.js','|| "2026.09.06.8";','|| "2026.09.06.9";')

          # Inventory selection + multi-slot recycling helpers.
          marker='let recycleRarity = "COMMUN";\n'
          add='''let recycleRarity = "COMMUN";\nlet recycleSelectMode = false;\nlet recycleSelectedIds = new Set();\nlet recycleSlots = new Set();\nfunction selectedRecycleItems() { return S.inventory.filter((x) => recycleSelectedIds.has(x.id)); }\nfunction recycleItemsByIds(ids) {\n  const set = new Set(ids);\n  const hit = S.inventory.filter((x) => set.has(x.id));\n  const dust = hit.reduce((a,x)=>a+recycleValue(x),0);\n  if (!hit.length) return {n:0,dust:0};\n  update((st)=>{ st.inventory=st.inventory.filter((x)=>!set.has(x.id)); st.poussiere+=dust; });\n  return {n:hit.length,dust};\n}\nfunction showRecycleSlotsPicker() {\n  const rows=SLOTS.map((slot)=>{ const hit=S.inventory.filter(x=>x.slot===slot); const on=recycleSlots.has(slot); return '<div class="itemRow" data-act="toggleRecycleSlot" data-arg="'+slot+'" style="cursor:pointer;border-left-color:'+(on?'var(--purple)':'var(--line)')+'"><div class="flex1"><div class="b small">'+SLOT_LABEL[slot]+'</div><div class="mute tiny">'+hit.length+' objet'+(hit.length>1?'s':'')+'</div></div><span class="pill" style="color:'+(on?'var(--greenLit)':'var(--textMute)')+';border-color:'+(on?'#3FB950':'var(--line)')+'">'+(on?'Sélectionnée':'Choisir')+'</span></div>'; }).join('');\n  const hit=S.inventory.filter(x=>recycleSlots.has(x.slot)); const dust=hit.reduce((a,x)=>a+recycleValue(x),0);\n  openModal(rows+'<div class="notice mt6">'+hit.length+' objet'+(hit.length>1?'s':'')+' · +'+fmt(dust)+' poussière</div><div class="row gap6 mt8">'+btn('Fermer',{cls:'ghost',small:true,act:'closeModal'})+btn(ic('trash',12)+' Recycler catégories',{cls:'red',small:true,act:'askRecycleSlots',dis:!hit.length})+'</div>','Recycler par catégories');\n}\nfunction askRecycleIds(ids,title) {\n  const hit=S.inventory.filter(x=>ids.includes(x.id)); if(!hit.length){toast('Aucun objet sélectionné');return;}\n  const dust=hit.reduce((a,x)=>a+recycleValue(x),0);\n  openModal('<div class="center">'+ic('trash',30)+'</div><div class="modalT center mt6">'+hit.length+' OBJET'+(hit.length>1?'S':'')+'</div><div class="dim small center mt6">Tu récupères <b style="color:var(--purpleLit)">'+fmt(dust)+'</b> poussière.<br>L’équipement porté ne sera jamais touché.</div><div class="mute tiny center mt6">Action irréversible.</div><div class="row gap6 mt8">'+btn('Annuler',{cls:'ghost',small:true,act:'closeModal'})+btn(ic('trash',12)+' Recycler',{cls:'red',small:true,act:'doRecycleSelected',arg:ids.join(',')})+'</div>',title);\n}\n'''
          rep('game-4.js',marker,add)

          # Add controls under equipment category tabs.
          old='''    '<div class="sect" style="margin:16px 0 8px">Inventaire</div><div class="seg">'+filters.map((f)=>'<span class="'+(invFilter===f?'on':'')+'" data-act="invFilter" data-arg="'+f+'">'+(f==='ALL'?'Tout':SLOT_LABEL[f])+'</span>').join('')+'</div>' +\n    (sorted.length===0 ?'''
          new='''    '<div class="sect" style="margin:16px 0 8px">Inventaire</div><div class="seg">'+filters.map((f)=>'<span class="'+(invFilter===f?'on':'')+'" data-act="invFilter" data-arg="'+f+'">'+(f==='ALL'?'Tout':SLOT_LABEL[f])+'</span>').join('')+'</div>' +\n    '<div class="row gap6 mt6">'+btn(recycleSelectMode?'Annuler sélection':'Sélection manuelle',{small:true,cls:recycleSelectMode?'blue':'ghost',act:'toggleRecycleSelect'})+btn('Recycler catégories',{small:true,cls:'dark',act:'recycleSlotsPicker'})+'</div>' +\n    (recycleSelectMode ? '<div class="row gap6 mt6">'+btn('Tout sélectionner'+(invFilter==='ALL'?'':' · '+SLOT_LABEL[invFilter]),{small:true,cls:'ghost',act:'selectVisibleRecycle',dis:!sorted.length})+btn(ic('trash',11)+' Recycler '+recycleSelectedIds.size,{small:true,cls:'red',act:'askRecycleSelected',dis:!recycleSelectedIds.size})+'</div>' : '') +\n    (sorted.length===0 ?'''
          rep('game-4.js',old,new)

          # Make each inventory row selectable in manual mode, while keeping normal controls otherwise.
          old2='''sorted.map((it)=>'<div class="itemRow" style="border-left-color:'+RARITY[it.rarity].c+'"><div class="imini"'''
          new2='''sorted.map((it)=>'<div class="itemRow" '+(recycleSelectMode?'data-act="toggleRecycleItem" data-arg="'+it.id+'" ':'')+'style="border-left-color:'+RARITY[it.rarity].c+(recycleSelectedIds.has(it.id)?';box-shadow:inset 0 0 0 2px #B15CF6':'')+'"><div class="imini"'''
          rep('game-4.js',old2,new2)
          old3='''+'</div>'+rtag(it.rarity)+'<div class="col gap4">'+btn(previewBySlot[it.slot]&&previewBySlot[it.slot].id===it.id?"Testé":"Tester",{small:true,cls:"blue",act:"previewEquip",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+btn("Équiper",{small:true,cls:"green",act:"equip",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+btn(ic("cycle",10)+recycleValue(it),{small:true,cls:"dark",act:"recycle",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+'</div></div>').join('')) +'''
          new3='''+'</div>'+rtag(it.rarity)+(recycleSelectMode?'<span class="pill" style="color:'+(recycleSelectedIds.has(it.id)?'var(--greenLit)':'var(--textMute)')+';border-color:'+(recycleSelectedIds.has(it.id)?'#3FB950':'var(--line)')+'">'+(recycleSelectedIds.has(it.id)?'Choisi':'Choisir')+'</span>':'<div class="col gap4">'+btn(previewBySlot[it.slot]&&previewBySlot[it.slot].id===it.id?"Testé":"Tester",{small:true,cls:"blue",act:"previewEquip",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+btn("Équiper",{small:true,cls:"green",act:"equip",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+btn(ic("cycle",10)+recycleValue(it),{small:true,cls:"dark",act:"recycle",arg:it.id,style:"padding:5px 8px;font-size:10.5px"})+'</div>')+'</div>').join('')) +'''
          rep('game-4.js',old3,new3)

          # Actions.
          anchor='''  invFilter: (a) => { invFilter = a; render(); },\n'''
          acts='''  invFilter: (a) => { invFilter = a; if(recycleSelectMode) recycleSelectedIds.clear(); render(); },\n  toggleRecycleSelect: () => { recycleSelectMode=!recycleSelectMode; recycleSelectedIds.clear(); render(); },\n  toggleRecycleItem: (a) => { if(!recycleSelectMode)return; recycleSelectedIds.has(a)?recycleSelectedIds.delete(a):recycleSelectedIds.add(a); render(); },\n  selectVisibleRecycle: () => { const list=invFilter==='ALL'?S.inventory:S.inventory.filter(x=>x.slot===invFilter); list.forEach(x=>recycleSelectedIds.add(x.id)); render(); },\n  askRecycleSelected: () => askRecycleIds(Array.from(recycleSelectedIds),'Recycler la sélection'),\n  doRecycleSelected: (a) => { const ids=String(a||'').split(',').filter(Boolean); const r=recycleItemsByIds(ids); recycleSelectedIds.clear(); recycleSelectMode=false; recycleSlots.clear(); closeModal(); toast(r.n?r.n+' objet'+(r.n>1?'s':'')+' recyclé'+(r.n>1?'s':'')+' · +'+fmt(r.dust)+' poussière':'Rien à recycler',!!r.n); render(); },\n  recycleSlotsPicker: () => { recycleSlots.clear(); showRecycleSlotsPicker(); },\n  toggleRecycleSlot: (a) => { recycleSlots.has(a)?recycleSlots.delete(a):recycleSlots.add(a); showRecycleSlotsPicker(); },\n  askRecycleSlots: () => { const ids=S.inventory.filter(x=>recycleSlots.has(x.slot)).map(x=>x.id); askRecycleIds(ids,'Recycler les catégories'); },\n'''
          rep('game-5.js',anchor,acts)

          # Build cache bust.
          for f in ['index.html']:
              p=Path(f); s=p.read_text().replace('2026.09.06.8','2026.09.06.9'); p.write_text(s)
          PY
          node --check game-2.js
          node --check game-4.js
          node --check game-5.js
          cat game-1.js game-2.js game-3.js game-4.js game-5.js > /tmp/all.js
          node --check /tmp/all.js
          grep -q '2026.09.06.9' index.html
          grep -q 'Recycler catégories' game-4.js
          grep -q 'Math.max(1, s.floor - 1)' game-2.js
          grep -q 'opts.boss ? 1.7' game-2.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-2.js game-4.js game-5.js index.html
          git commit -m "Recyclage & Boss" -m "Ajoute la sélection manuelle d'équipements à recycler et le recyclage en un clic de plusieurs catégories. Corrige la défaite contre un Boss pour revenir exactement à l'étage précédent avec un bouton BOSS de revanche, et réduit légèrement les dégâts des Boss. Build 2026.09.06.9."
          git push
