name: Apply boss lock v10
on:
  push:
    paths:
      - '.github/workflows/apply-recycle-boss-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build 2026.09.06.10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,count))

          rep('game-2.js','const mulD = opts.boss ? 1.7 : opts.elite ? 1.4 : 1;','const mulD = opts.boss ? (opts.floor === 40 ? 1.7 : 1.8) : opts.elite ? 1.4 : 1;')
          rep('game-2.js','function startCampaign() { combat = spawnCampaign(S); }','''function startCampaign() {\n  const pending = Number(S.pendingBossFloor || 0);\n  if (pending && S.floor >= pending) update((st) => { st.floor = Math.max(1, pending - 1); st.step = 1; });\n  combat = spawnCampaign(S);\n}''')
          rep('game-2.js','''        const clearedFloor = s.floor;\n        s.step = 1;\n        s.floor += 1;\n        // Saut d'étage''','''        const clearedFloor = s.floor;\n        s.step = 1;\n        const pendingBoss = Number(s.pendingBossFloor || 0);\n        if (!(pendingBoss && pendingBoss === s.floor + 1)) s.floor += 1;\n        // Saut d'étage''')
          rep('game-2.js','if (weakFight && skipPct > 0 && !isElite(nextFloor)','if (!(pendingBoss && pendingBoss === s.floor + 1) && weakFight && skipPct > 0 && !isElite(nextFloor)')
          rep('game-2.js','|| "2026.09.06.9";','|| "2026.09.06.10";')

          rep('game-4.js',"btn(ic('trash',11)+' Recycler '+recycleSelectedIds.size,{small:true,cls:'red',act:'askRecycleSelected',dis:!recycleSelectedIds.size})","btn(ic('trash',11)+' Recycler '+recycleSelectedIds.size+' · +'+fmt(selectedRecycleItems().reduce((a,x)=>a+recycleValue(x),0))+' Poussière',{small:true,cls:'red',act:'askRecycleSelected',dis:!recycleSelectedIds.size})")

          p=Path('index.html'); p.write_text(p.read_text().replace('2026.09.06.9','2026.09.06.10'))
          PY
          node --check game-1.js
          node --check game-2.js
          node --check game-3.js
          node --check game-4.js
          node --check game-5.js
          cat game-1.js game-2.js game-3.js game-4.js game-5.js > /tmp/all.js
          node --check /tmp/all.js
          grep -q '2026.09.06.10' index.html
          grep -q 'pendingBoss && pendingBoss === s.floor + 1' game-2.js
          grep -q 'opts.floor === 40 ? 1.7 : 1.8' game-2.js
          grep -q 'Poussière' game-4.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-2.js game-4.js index.html
          git commit -m "Boss Lock" -m "Après une défaite contre un Boss, le joueur reste sur l’étage précédent et peut le farmer sans relancer automatiquement le Boss. Seul le bouton BOSS permet une revanche. La réduction de dégâts est limitée au Boss 40 et le recyclage manuel affiche désormais la Poussière totale sélectionnée. Build 2026.09.06.10."
          git push
