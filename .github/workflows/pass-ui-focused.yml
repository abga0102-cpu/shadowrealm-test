name: Pass UI focused regression
on:
  pull_request:
    paths:
      - 'accomplishments-canonical-v139.js'
      - 'tests/phase3-compatibility.spec.js'
      - 'tests/phase-ui-stability-observer-removal-proof.spec.js'
      - '.github/workflows/pass-ui-focused.yml'
permissions:
  contents: read
concurrency:
  group: pass-ui-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify filters and existing modal navigation on both engines
        run: npm run test:e2e -- phase3-compatibility.spec.js phase-ui-stability-observer-removal-proof.spec.js --grep "Progression Pass filters preserve|V83 modal lifecycle remains complete" --workers=1
