name: SHADOWREACH AUTO-RELEASE

# Runs with write permission ONLY from the trusted default branch.
# Never checkout or execute code supplied by a candidate PR.
on:
  pull_request:
    paths:
      - '.github/workflows/shadowreach-auto-release.yml'
      - 'tests/release-control-workflow.test.cjs'
  workflow_run:
    workflows:
      - Phase 1 regression guard
      - pages build and deployment
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect, publish an approved safe PR, or verify GitHub Pages'
        required: true
        type: choice
        default: inspect
        options: [inspect, publish, verify]
      pr_number:
        description: 'PR number for inspect / publish'
        required: false
        type: string

concurrency:
  group: shadowreach-autorelease-\${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release controller contracts
        run: node --test tests/release-control-workflow.test.cjs

  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'verify') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Phase 1 regression guard' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
      pages: write
    steps:
      - name: Inspect exact tested SHA and conditionally merge
        uses: actions/github-script@v7
        env:
          RELEASE_MODE: \${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'auto' }}
          RELEASE_PR: \${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (owner !== 'abga0102-cpu' || repo !== 'shadowrealm-test') throw Error('Unexpected repository');
            const triggered = context.payload.workflow_run;
            const mode = process.env.RELEASE_MODE;
            let number = Number(process.env.RELEASE_PR);
            if (context.eventName === 'workflow_run') {
              if (!triggered || triggered.event !== 'pull_request' || triggered.conclusion !== 'success') return;
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: triggered.head_sha, per_page: 100
              });
              const eligible = associated.data.filter(p => p.state === 'open' && p.head.sha === triggered.head_sha);
              number = eligible.length === 1 ? eligible[0].number : 0;
            }
            if (!Number.isSafeInteger(number) || number <= 0) {
              core.notice('Aucune PR unique et ouverte correspondante. Aucune fusion.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const { data: mainRef } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const mainSha = mainRef.object.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: number, per_page: 100});
            const { data: delta } = await github.rest.repos.compareCommits({owner, repo, base: mainSha, head: pr.head.sha});
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: pr.head.sha, per_page: 100
            });
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: pr.head.sha, per_page: 100
            });
            const recent = runs.filter(r => r.name === 'Phase 1 regression guard' && r.event === 'pull_request'
              && r.head_sha === pr.head.sha).sort((a,b) => new Date(b.run_started_at || b.created_at) - new Date(a.run_started_at || a.created_at))[0];

            const problems = [];
            const labels = new Set((pr.labels || []).map(x => x.name));
            const lowRisk = files.length > 0 && files.every(f =>
              ['added','modified'].includes(f.status) && !f.previous_filename &&
              (/^docs\/[a-zA-Z0-9_.\/-]+\.md$/.test(f.filename) || ['README.md','style.css'].includes(f.filename)));
            if (pr.state !== 'open' || pr.draft) problems.push('PR closed or draft');
            if (pr.base.ref !== 'main' || pr.base.sha !== mainSha) problems.push('Wrong or changed base');
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) problems.push('Fork not allowed');
            if (!pr.mergeable || delta.behind_by !== 0 || delta.ahead_by <= 0) problems.push('Conflicting or stale branch');
            if (!lowRisk) problems.push('Gameplay, saves, tests, workflows or other unreviewed files: manual merge only');
            if (/do not merge|never merge|experimental|exp.rimental|ne pas fusionner|fusion interdite/i.test((pr.title || '') + ' ' + (pr.body || ''))) problems.push('Explicit experimental / do-not-merge warning');
            for (const label of ['do-not-merge','release-blocked','breaking-change']) if (labels.has(label)) problems.push('Blocked label: ' + label);
            if (!recent || recent.status !== 'completed' || recent.conclusion !== 'success') problems.push('Required full CI is not green at this head');
            if (triggered && recent && triggered.id !== recent.id) problems.push('Old CI event is not the latest run');
            for (const check of checks) if (check.status !== 'completed' || !['success','neutral','skipped'].includes(check.conclusion)) problems.push('Check not green: ' + check.name);
            const approved = mode === 'publish' || (mode === 'auto' && labels.has('auto-release-approved'));
            if (!approved) problems.push('Inspection only: explicit publish mode or auto-release-approved label required');

            await core.summary.addRaw('### SHADOWREACH release control\n\n' +
              '- PR #' + number + ' / SHA ' + pr.head.sha + '\n' +
              '- main ' + mainSha + '\n' +
              '- Files: ' + files.map(x => x.filename).join(', ') + '\n' +
              '- CI: ' + (recent ? recent.html_url : 'none') + '\n' +
              (problems.length ? problems.map(x=>'- BLOCKED: ' + x + '\n').join('') : '- ALL RELEASE GUARDS PASSED\n')).write();
            if (problems.length) { core.notice('Aucune fusion : ' + problems.join('; ')); return; }

            // Recheck immediately before merging; never force-push or modify the PR.
            const [freshPR,freshMain] = await Promise.all([
              github.rest.pulls.get({owner,repo,pull_number:number}),
              github.rest.git.getRef({owner,repo,ref:'heads/main'})
            ]);
            if (freshPR.data.head.sha !== pr.head.sha || freshMain.data.object.sha !== mainSha || !freshPR.data.mergeable)
              throw Error('Main/PR moved; canceled safe merge.');
            const {data: result} = await github.rest.pulls.merge({
              owner,repo,pull_number:number,sha:pr.head.sha,merge_method:'merge'
            });
            if (!result.merged || !result.sha) throw Error('GitHub did not confirm merge');
            core.notice('FUSION CONFIRMÉE : ' + result.sha);

            // GitHub-token merges do NOT automatically trigger push CI or Pages.
            // workflow_dispatch and explicit Pages-build requests avoid false LIVE claims.
            const postMergeErrors=[];
            try {
              await github.rest.actions.createWorkflowDispatch({ owner,repo,workflow_id:'phase-1-ci.yml',ref:'main' });
            } catch(e) { postMergeErrors.push('post-merge CI: ' + (e.status || e.message)); }
            try {
              await github.rest.repos.requestPagesBuild({owner,repo});
            } catch(e) { postMergeErrors.push('Pages build: ' + (e.status || e.message)); }
            await core.summary.addRaw('\n- MERGED: ' + result.sha + '\n' +
              (postMergeErrors.length ? '- PUBLICATION NOT CONFIRMED: ' + postMergeErrors.join('; ') : '- Post-merge CI and Pages build requested; LIVE pending external verification') + '\n').write();
            if (postMergeErrors.length) core.setFailed('Merged, but follow-up incomplete: ' + postMergeErrors.join('; '));

  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'verify') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'pages build and deployment')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Compare published assets with the latest main commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if (owner !== 'abga0102-cpu' || repo !== 'shadowrealm-test') throw Error('Unexpected repository');
            const run=context.payload.workflow_run;
            if (run && (run.conclusion !== 'success' || run.head_branch !== 'main')) {
              core.setFailed('Pages was not successfully built from main'); return;
            }
            const {data:ref}=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const sha=ref.object.sha;
            if (run && run.head_sha !== sha) {
              core.notice('Old Pages build, not evidence for current main'); return;
            }
            const publicBase='https://abga0102-cpu.github.io/shadowrealm-test/';
            const files=['index.html','style.css','game-4.js'];
            let all=true;
            for(const path of files){
              const {data:source}=await github.rest.repos.getContent({owner,repo,path,ref:sha});
              if(!source || Array.isArray(source) || source.encoding !== 'base64') throw Error('Missing expected source: '+path);
              const expected=Buffer.from(source.content.replace(/\s/g,''),'base64').toString('utf8');
              const response=await fetch(publicBase+path+'?_sha='+sha.slice(0,16),{
                headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(25000)});
              const actual=response.ok?await response.text():'';
              const match=response.ok && actual===expected;
              all=all&&match;
              await core.summary.addRaw('- '+path+': HTTP '+response.status+', '+(match?'MATCH':'MISMATCH')+'\n').write();
            }
            await core.summary.addRaw('- main: '+sha+'\n- LIVE: '+(all?'CONFIRMED':'NOT CONFIRMED')+'\n').write();
            if(!all)core.setFailed('Public Pages content does not match the current main revision');
