<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bottom navigation V188 visual fixture</title>
<link rel="stylesheet" href="style.css?v=2026.09.08.151">
<style>
  html,body{margin:0;min-height:100%;background:#07101e;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  #app{position:relative;width:100%;min-height:100vh;display:flex;flex-direction:column}
  #hud{height:50px;flex:0 0 50px}
  #screen{flex:1 1 auto;min-height:80px}
  #tabs{position:relative}
  .fixtureStatus{position:fixed;left:8px;top:8px;z-index:9999;padding:5px 8px;background:#07101eee;border:1px solid #31405d;border-radius:7px;font:700 11px/1.2 system-ui;pointer-events:none}
</style>
</head>
<body>
<div id="app" class="srHomeFullArena">
  <div id="hud"></div>
  <div id="screen"></div>
  <div id="tabs"></div>
</div>
<div class="fixtureStatus" id="fixtureStatus">V188 test…</div>
<script>
'use strict';
var route='accueil';
var TABS_FIXTURE=[
  {id:'accueil',label:'Accueil'},
  {id:'equipement',label:'Équipement'},
  {id:'developpement',label:'Développement'},
  {id:'parametres',label:'Réglages'}
];
function rawIcon(){return '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg></span>'}
function renderTabsFixture(){
  var root=document.getElementById('tabs');
  var exact=TABS_FIXTURE.some(function(t){return t.id===route})?route:null;
  root.innerHTML=TABS_FIXTURE.map(function(t){
    var badge=t.id==='equipement'||t.id==='developpement';
    return '<div class="tab'+(exact===t.id?' on':'')+'" data-act="go" data-arg="'+t.id+'">'+
      rawIcon()+'<span>'+t.label+'</span>'+(badge?'<div class="dot"></div>':'')+'</div>';
  }).join('');
}
function nav(to){route=String(to||'accueil');renderTabsFixture()}
renderTabsFixture();
</script>
<script src="bottom-nav-v53.js?v=2026.09.08.188"></script>
<script src="home-layout-fix-v119.js?v=2026.09.08.188"></script>
<script src="bottom-nav-layout-v183.js?v=2026.09.08.188"></script>
<script src="bottom-nav-development-v186.js?v=2026.09.08.188"></script>
<script src="bottom-nav-active-normalize-v187.js?v=2026.09.08.188"></script>
<script src="bottom-nav-canonical-v188.js?v=2026.09.08.188"></script>
<script src="bottom-nav-interaction-v188.js?v=2026.09.08.188"></script>
<script>
(function(){
  'use strict';
  var pass=0,fail=0,details=[];
  function record(ok,msg){details.push({ok:!!ok,msg:msg});if(ok)pass++;else fail++}
  function near(a,b,t){return Math.abs(Number(a)-Number(b))<=(t==null?.8:t)}
  function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  function raf(){return new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})})}
  async function settle(){await sleep(30);await raf();await sleep(20)}
  function target(tab){return tab.getAttribute('data-nav-target')||tab.getAttribute('data-arg')||''}
  function box(el,parent){var a=el.getBoundingClientRect(),b=parent.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height,cx:(a.left+a.right)/2-b.left}}
  function snap(){
    return Array.from(document.querySelectorAll('#tabs>.tab')).map(function(tab){
      var icon=tab.querySelector('.fantasyNavIcon');
      var label=tab.querySelector(':scope>.navLabel')||tab.querySelector(':scope>span:not(.ico):not(.fantasyNavIcon)');
      return{target:target(tab),tab:box(tab,document.getElementById('tabs')),icon:icon?box(icon,tab):null,label:label?box(label,tab):null};
    });
  }
  function same(a,b){return near(a.icon.x,b.icon.x,.7)&&near(a.icon.y,b.icon.y,.7)&&near(a.icon.w,b.icon.w,.5)&&near(a.icon.h,b.icon.h,.5)&&near(a.label.x,b.label.x,.7)&&near(a.label.y,b.label.y,.7)&&near(a.label.w,b.label.w,.7)&&near(a.label.h,b.label.h,.7)}
  async function clickTarget(id){
    var tab=Array.from(document.querySelectorAll('#tabs>.tab')).find(function(t){return target(t)===id});
    if(!tab)return false;
    tab.click();await settle();
    return route===id;
  }
  async function run(){
    await settle();
    var compact=matchMedia('(max-width:370px),(max-height:720px)').matches;
    var expectedIcon=compact?31:34,expectedTab=compact?54:58,expectedTop=compact?2:3,expectedLabel=compact?36:40;
    record(document.querySelector('meta[name="viewport"]').content.indexOf('viewport-fit=cover')!==-1,'viewport-fit=cover');
    var canonicalStyle=document.getElementById('srBottomNavCanonicalV188');
    record(!!canonicalStyle&&canonicalStyle.textContent.indexOf('env(safe-area-inset-bottom)')!==-1,'safe-area bottom contract');
    var audit=window.__srBottomNavV188Audit&&window.__srBottomNavV188Audit();
    record(!!audit&&audit.ok,'four canonical navigation destinations');

    var routes=[['accueil','accueil'],['equipement','equipement'],['heros','equipement'],['developpement','developpement'],['competences','developpement'],['familiers','developpement'],['arbre','developpement'],['parametres','parametres']];
    var baseline={};
    for(var r=0;r<routes.length;r++){
      nav(routes[r][0]);await settle();
      var tabs=Array.from(document.querySelectorAll('#tabs>.tab'));
      var active=tabs.filter(function(t){return t.classList.contains('on')||t.getAttribute('aria-current')==='page'});
      record(active.length===1&&target(active[0])===routes[r][1],routes[r][0]+' has exactly one owner: '+routes[r][1]);
      var s=snap(),ok=s.length===4,why='';
      s.forEach(function(v){
        if(!ok)return;
        if(!v.icon||!v.label){ok=false;why=v.target+' missing canonical child';return}
        if(!near(v.tab.h,expectedTab,.8)){ok=false;why=v.target+' tab height '+v.tab.h;return}
        if(!near(v.icon.w,expectedIcon,.8)||!near(v.icon.h,expectedIcon,.8)){ok=false;why=v.target+' icon '+v.icon.w+'x'+v.icon.h;return}
        if(!near(v.icon.cx,v.tab.w/2,.9)){ok=false;why=v.target+' icon off center';return}
        if(!near(v.icon.y,expectedTop,.9)){ok=false;why=v.target+' icon top '+v.icon.y;return}
        if(!near(v.label.y,expectedLabel,1)){ok=false;why=v.target+' label top '+v.label.y;return}
        if(v.icon.y+v.icon.h>v.label.y+.5){ok=false;why=v.target+' icon overlaps label';return}
        if(!baseline[v.target])baseline[v.target]=v;else if(!same(baseline[v.target],v)){ok=false;why=v.target+' changes geometry when selected';return}
      });
      record(ok,routes[r][0]+' geometry stable'+(why?' — '+why:''));
    }

    nav('accueil');await settle();
    var badgeOk=true,badgeWhy='';
    var tabs2=Array.from(document.querySelectorAll('#tabs>.tab'));
    for(var i=0;i<tabs2.length;i++){
      var before=snap()[i],dot=tabs2[i].querySelector(':scope>.dot'),added=false;
      if(!dot){dot=document.createElement('div');dot.className='dot';tabs2[i].appendChild(dot);added=true}
      await settle();var after=snap()[i];
      if(!same(before,after)){badgeOk=false;badgeWhy=target(tabs2[i])+' moved with badge'}
      else if(getComputedStyle(dot).pointerEvents!=='none'){badgeOk=false;badgeWhy=target(tabs2[i])+' badge steals taps'}
      if(added)dot.remove();await settle();if(!badgeOk)break;
    }
    record(badgeOk,'badges do not move geometry or intercept taps'+(badgeWhy?' — '+badgeWhy:''));

    var pointerOk=true,pointerWhy='';
    Array.from(document.querySelectorAll('#tabs>.tab')).forEach(function(tab){
      var icon=tab.querySelector('.fantasyNavIcon'),label=tab.querySelector('.navLabel'),b=tab.getBoundingClientRect();
      if(!icon||!label){pointerOk=false;pointerWhy=target(tab)+' missing child';return}
      if(getComputedStyle(icon).pointerEvents!=='none'||getComputedStyle(label).pointerEvents!=='none'){pointerOk=false;pointerWhy=target(tab)+' child steals taps';return}
      if(b.height<44){pointerOk=false;pointerWhy=target(tab)+' target '+b.height+'px'}
    });
    record(pointerOk,'all full tab cells are >=44px touch targets'+(pointerWhy?' — '+pointerWhy:''));

    var clickOk=true;
    for(var c=0;c<TABS_FIXTURE.length;c++)if(!await clickTarget(TABS_FIXTURE[c].id)){clickOk=false;break}
    record(clickOk,'full tab click routes Accueil → Équipement → Développement → Réglages');

    window.__bottomNavV188Results={done:true,pass:pass,fail:fail,details:details,viewport:{width:innerWidth,height:innerHeight,compact:compact}};
    document.getElementById('fixtureStatus').textContent=(fail?'FAIL':'PASS')+' '+pass+'/'+(pass+fail);
    document.title=(fail?'FAIL':'PASS')+' — Bottom navigation V188 visual fixture';
  }
  run().catch(function(err){window.__bottomNavV188Results={done:true,pass:pass,fail:fail+1,error:String(err&&err.stack||err),details:details};document.getElementById('fixtureStatus').textContent='FAIL exception'});
})();
</script>
</body>
</html>
