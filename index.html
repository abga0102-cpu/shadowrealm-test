            '<span class="pill">Niv. ' + lv + "/" + mx + "</span></div>" +
          '<div class="row gap10 mt6">' +
            '<span class="b small row gap4" style="color:#FF9C6B">' + ic("sword", 12) + "+" + fmt(Math.round(pct * (1 + treeDmg / 100))) + "%</span>" +
            '<span class="b small row gap4" style="color:var(--redLit)">' + ic("heart", 12) + "+" + fmt(Math.round(pct)) + "%</span>" +
          "</div>" +
          '<div class="mt6">' + meter((lv / mx) * 100, rc, lv + " / " + mx) + "</div></div></div>" +
          '<div class="tiny b mt6 row gap4" style="color:' + petElement(p).c + '">' +
            ic(petElement(p).icon, 11) + petElement(p).desc + "</div>" +
          (treeDmg > 0 ? '<div class="tiny b mt6 row gap4" style="color:#8FEFF4">' + ic("bolt", 10) +
            "Arbre : +" + treeDmg + "% aux dégâts des Familiers</div>" : "") +
          '<div class="divider"></div>' +
          (lv >= mx
            ? '<div class="center"><span class="pill" style="border-color:#3FB950;color:var(--greenLit)">Amélioration maximale</span>' +
              '<div class="mute tiny mt6">Fusionne pour atteindre la rareté suivante</div></div>'
            : '<div class="between"><div class="mute tiny b">PROCHAIN NIVEAU</div>' +
              '<div class="b tiny" style="color:var(--greenLit)">+' + fmt(Math.round(pct)) + "% → +" + fmt(Math.round(nextPct)) + "%</div></div>" +
              '<div class="mt6">' + btn(ic("essence", 13) + "Améliorer · " + fmt(cost),
                { small: true, act: "upgradePet", arg: p.id, dis: S.essence < cost,
                  style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03" }) + "</div>") +
        "</div>";
      })() +
      '<div class="card mt6"><div class="between"><div><div class="bb gt" style="font-size:13px;letter-spacing:1px">MAÎTRISE FAMILIER</div>' +
        starRow("pet", "#FFC29B") +
        '<div class="mute tiny b">' + S.petMastery.progress + "/" + mreq + " invocations</div></div>" +
        '<b style="color:#FFC29B;font-size:18px;text-shadow:0 0 12px ' + ORANGE + '80">' + S.petMastery.level + "/" + RULES.MASTERY_MAX + "</b></div>" +
        '<div class="mt6">' + meter((S.petMastery.progress / mreq) * 100, ORANGE, S.petMastery.progress + " / " + mreq) + "</div>" +
        ascendCta("pet") +
        ratesTable(rates, S.petMastery.level < RULES.MASTERY_MAX ? getRates("pet", S.petMastery.level + 1, S.ascension, starsOf(S, "pet")) : null,
          "Actuel", "Niv." + (S.petMastery.level + 1)) +
        '<div class="row gap6 mt6">' +
          btn(ic("egg", 14) + "Invoquer · 10", { small: true, act: "summonEgg", arg: 1,
            dis: S.essence < 10 || S.eggs.length >= S.eggSlots,
            style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03" }) +
          btn("x" + Math.max(1, S.eggSlots - S.eggs.length), { small: true, act: "summonEgg", arg: S.eggSlots,
            dis: S.essence < 10 || S.eggs.length >= S.eggSlots,
            style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03;max-width:62px" }) +
        "</div>" +
        (S.eggs.length >= S.eggSlots ? '<div class="mute tiny center mt6">Tous les emplacements d\'œufs sont occupés</div>' : "") +
      "</div>" +
      '<div class="sect" style="margin:16px 0 9px">Œufs (' + S.eggs.length + "/" + S.eggSlots + ")</div>" +
      '<div class="slotGrid">' + eggCells + "</div>" +
      (S.eggSlots < RULES.EGG_SLOT_MAX ? '<div class="mt4" style="margin-top:4px">' +
        btn("+1 Emplacement · " + ic("gem", 12) + "300" + (S.level < 10 ? " · niv. 10" : ""),
          { cls: "purple", small: true, act: "buyEggSlot",
            dis: S.level < 10 || S.gems < 300, style: "padding:4px 9px;font-size:10.5px" }) + "</div>" : "") +
      '<div class="sect" style="margin:16px 0 9px">Collection (' + S.pets.length + ")</div>" +
      '<div class="mute tiny" style="margin-bottom:2px;line-height:1.35">Fusion : ' +
        RARITY_ORDER.slice(0, -1).map((r) => petFuseNeed(r) + " " + RARITY[r].label).join(" → ") +
        " → " + RARITY[RARITY_ORDER[RARITY_ORDER.length - 1]].label +
        ". Les doublons les moins améliorés partent en premier.</div>" +
      (S.pets.length === 0 ? '<div class="mute tiny center" style="padding:6px 0">Aucun familier. Fais éclore un œuf.</div>'
        : RARITY_ORDER.filter((r) => byRar[r]).map((r) => {
        const list = byRar[r];
        const rc = RARITY[r].c;
        const need = petFuseNeed(r);
        const isTop = RARITY_ORDER.indexOf(r) >= RARITY_ORDER.length - 1;
        const canFuse = need > 0 && list.length >= need;
        const best = list.slice().sort((a, b) => (b.level || 0) - (a.level || 0))[0];
        const activeHere = list.some((p) => p.id === S.activePetId);
        return '<div class="itemRow" style="border-left-color:' + rc + ';flex-wrap:wrap">' +
          '<div class="imini" style="width:32px;height:32px;border-color:' + rc + '80;box-shadow:0 0 10px ' +
            rc + '3d">' + ic("paw", 19) + "</div>" +
          '<div class="flex1"><div class="b small" style="color:' + rc + '">' + RARITY[r].label + " ×" + list.length + "</div>" +
          '<div class="mute tiny b row gap6">' +
            '<span>' + ic("sword", 9) + " base +" + fmt(PET_BASE[r]) + "%</span>" +
            '<span>' + ic("heart", 9) + " base +" + fmt(PET_BASE[r]) + "%</span>" +
            '<span>max +' + fmt(Math.round(petBonusAt(r, petMaxLevel(r), starsOf(S, "pet")))) + "%</span>" +
          "</div>" +
          (best ? '<div class="mute tiny b">Meilleur : ' + esc(petFullName(best)) +
            " · niv. " + (best.level || 0) + "/" + petMaxLevel(r) + "</div>" : "") +
          '<div class="row gap4 mt6" style="flex-wrap:wrap">' +
            PET_ELEMENTS.map((el) => {
              const cnt = list.filter((p) => petElement(p).id === el.id).length;
              return cnt ? '<span class="tag" style="color:' + el.c + ";border-color:" + el.c +
                '66">' + ic(el.icon, 9) + el.label + " ×" + cnt + "</span>" : "";
            }).join("") + "</div>" +
          "</div>" +
          '<div class="col gap4">' +
          (activeHere
            ? '<span class="pill" style="color:var(--greenLit);border-color:#3FB950">Actif</span>'
            : btn("Activer", { small: true, cls: "ghost", act: "setPet", arg: best.id, style: "padding:5px 8px;font-size:10.5px" })) +
          (isTop ? "" : btn("Fusion", { small: true, cls: "purple", act: "fuse", arg: r,
            dis: !canFuse, style: "padding:5px 8px;font-size:10.5px" })) +
          "</div>" +
          (isTop ? "" : '<div style="width:100%;margin-top:7px">' +
            '<div class="between tiny b" style="margin-bottom:3px">' +
              '<span class="mute">DOUBLONS POUR FUSION</span>' +
              '<span style="color:' + (canFuse ? "var(--greenLit)" : "var(--textMute)") + '">' +
              Math.min(list.length, need) + " / " + need + "</span></div>" +
            meter((Math.min(list.length, need) / need) * 100, canFuse ? C.green : rc) + "</div>") +
          "</div>";
      }).join("")) +
    '<div style="height:2px"></div></div>';
}
/* ---------------- RAID ---------------- */
function scrRaid() {
  const running = combat && combat.ctx === "raid" && !combat.trial;
  if (S.level < RULES.RAID_UNLOCK_LEVEL) {
    return topbar("Raids") + '<div class="pad mt6"><div class="notice center">Les Raids se débloquent au Niveau ' +
      RULES.RAID_UNLOCK_LEVEL + ".</div></div>";
  }
  if (running) {
    const rm = RAIDS[combat.raidId];
    return topbar(rm.name) + '<div id="arenaSlot"></div>' + combatBarHTML() +
      '<div class="pad mt6"><div class="card frame center">' +
      '<div class="row gap8" style="justify-content:center">' + ic(rm.icon, 22) +
      '<span class="bb gt" style="font-size:14px;letter-spacing:1.2px">RAID EN COURS</span></div>' +
      '<div class="mute small mt6">Niveau ' + combat.raidLevel + " · récompense " +
      '<b style="color:' + rm.color + '">' + fmt(raidReward(combat.raidId, combat.raidLevel)) + " " + rm.reward + "</b></div>" +
      '<div class="mt10">' + btn("Abandonner", { cls: "dark", small: true, act: "abortRaid" }) + "</div></div></div>";
  }
  const cards = RAID_IDS.map((id) => {
    const r = S.raids[id], meta = RAIDS[id];
    const bonus = S.raidKeyBonus === id ? 1 : 0;
    const cap = RULES.RAID_KEY_CAP + bonus;
    const detail = "Niv " + r.level + "/" + RULES.RAID_MAX_LEVEL + " · rec " + r.record +
      " · " + raidEnemyCount(id, r.level) + " ennemis · " + fmt(raidEnemyHP(id, r.level)) + " PV";
    return '<div class="raidCard" style="border-left-color:' + meta.color + '" title="' + esc(detail) +
      " · " + fmt(raidEnemyDamage(id, r.level)) + ' dégâts">' +
      '<div class="row gap8">' +
        '<div class="imini" style="width:28px;height:28px;background:linear-gradient(180deg,' + meta.color + '33,' + meta.color +
        '0f);border-color:' + meta.color + ';box-shadow:0 0 11px ' + meta.color + '47">' + ic(meta.icon, 16) + "</div>" +
        '<div class="flex1"><div class="b small row gap4" style="justify-content:space-between">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + meta.name + "</span>" +
          '<span style="color:' + meta.color + ';flex:0 0 auto">+' + fmt(raidReward(id, r.level)) + " " + meta.reward + "</span></div>" +
        '<div class="mute tiny b row gap4">' + ic("key", 10) + r.keys + "/" + cap + " · " + detail + "</div></div>" +
        btn(ic("key", 12) + "Lancer", { small: true, cls: "green", act: "startRaid", arg: id, arg2: "0",
          dis: r.keys <= 0, style: "width:auto;padding:5px 9px" }) +
        btn(ic("star", 12), { small: true, cls: "ghost", act: "startRaid", arg: id, arg2: "1",
          dis: S.universalKeys <= 0, style: "width:auto;padding:5px 8px" }) +
      "</div></div>";
  }).join("");

  return topbar("Raids", '<span class="pill" data-act="resInfo" data-arg="key" style="cursor:pointer;color:var(--goldLit);border-color:var(--goldDim)">' + ic("key", 11) + S.universalKeys + "</span>") +
    '<div class="pad mt6">' +
      '<div class="card frame"><div class="between"><div><div class="bb small">Clés universelles</div>' +
        '<div class="mute tiny b">' + S.universalKeys + "/" + RULES.UNIVERSAL_KEY_CAP + " · " +
        (RULES.UNIVERSAL_KEY_DAILY - S.adKeysToday) + " pub restantes aujourd'hui</div></div>" +
        btn(ic("tv", 14) + "+1 clé", { small: true, cls: "blue", act: "adKey",
          dis: S.universalKeys >= RULES.UNIVERSAL_KEY_CAP || S.adKeysToday >= RULES.UNIVERSAL_KEY_DAILY,
          style: "width:auto;padding:7px 10px" }) + "</div>" +
        '<div class="mt8">' + meter((S.universalKeys / RULES.UNIVERSAL_KEY_CAP) * 100, C.gold,
          S.universalKeys + " / " + RULES.UNIVERSAL_KEY_CAP) + "</div>" +
        '<div class="mute tiny mt6">' + RULES.RAID_FREE_KEYS + " clés gratuites par raid chaque jour, plafond " +
        RULES.RAID_KEY_CAP + ". L\'étoile lance avec une clé universelle.</div></div>" +
      '<div class="sect">Raids disponibles</div>' + cards +
      '<div class="mute tiny center mt6">Victoire : +1 niveau et la récompense. Défaite : la clé est consommée, le niveau reste.</div>' +
    '<div style="height:2px"></div></div>';
}

/* ---------------- ARBRE ---------------- */
function scrArbre() {
  const now = Date.now();
  const active = S.tree.active;
  const remain = active ? (S.tree.activeEnd - now) / 1000 : 0;
  const activeNode = active ? TREE_BY_ID[active] : null;
  const activeLv = S.tree.activeLevel || 1;
  const activeTotal = activeNode ? treeTime(S, activeNode, activeLv) : 1;
  const accelBtns = ACCEL_DEFS.filter((a) => (S.accels[a.key] || 0) > 0).map((a) =>
    '<span class="pill" data-act="accel" data-arg="' + a.key + '" data-arg2="tree"' +
    ' style="cursor:pointer;color:#8FEFF4;border-color:var(--cyan)">' + ic("bolt", 10) + a.label + " ×" + S.accels[a.key] + "</span>").join("");

  const owned = TREE_NODES.reduce((t, n) => t + treeLv(S, n.id), 0);
  const accelPct = treeSum(S, "accel");
  const freeKeys = raidKeyFree(S);
  const alloc = RAID_IDS.filter((r) => (S.raidKeyAlloc[r] || 0) > 0)
    .map((r) => RAIDS[r].reward + " +" + S.raidKeyAlloc[r]).join(" · ");

  const bonusRows = [
    ["minerai", "Minerais obtenus", "+"],
    ["essence", "Essence animale", "+"],
    ["skillPts", "Points de Compétence", "+"],
    ["dust", "Poussière obtenue", "+"],
    ["petDmg", "Dégâts des Familiers", "+"],
    ["skillDmg", "Dégâts des Compétences", "+"],
    ["raidMinerai", "Minerais du Raid Minerai", "+"],
    ["forgeTime", "Temps de Forge", "-"],
    ["forgeCost", "Coût amélioration Forge", "-"],
    ["hatch_COMMUN", "Éclosion Commun", "-"],
    ["hatch_RARE", "Éclosion Rare", "-"],
    ["hatch_EPIQUE", "Éclosion Épique", "-"],
    ["hatch_MYTHIQUE", "Éclosion Mythique", "-"],
    ["hatch_LEGENDAIRE", "Éclosion Légendaire", "-"],
    ["skillTime", "Temps de Compétence", "-"],
    ["research", "Temps de recherche", "-"],
    ["accel", "Efficacité Accélérateurs", "+"],
    ["forgeFree", "Forge gratuite", "+"],
    ["eggFree", "Œuf gratuit", "+"],
    ["skillFree", "Double invocation", "+"]
  ].map((r) => {
    const v = treeSum(S, r[0]);
    return v <= 0 ? "" : '<div class="kv"><span class="dim">' + r[1] +
      '</span><b style="color:var(--goldLit)">' + r[2] + v.toFixed(v % 1 ? 1 : 0) + "%</b></div>";
  }).join("");

  const intro = "Les <b>PE</b> gagnés au <b>Raid Évolution</b> sont la <b>seule</b> ressource de l’Arbre : " +
    "ils ouvrent un nœud, puis paient chacun de ses niveaux suivants. Ouvrir coûte moins cher que monter. " +
    "Un nœud compte comme activé dès <b>1/X</b> : tu peux ouvrir la suite immédiatement et revenir le maxer plus tard.";

  return topbar("Arbre Personnel",
      '<span class="pill" data-act="resInfo" data-arg="pe" style="cursor:pointer;color:#8FEFF4;border-color:var(--cyan)">' + ic("chart", 11) + fmt(S.pe || 0) + " PE</span>") +
    '<div class="pad mt6">' +
      (activeNode ? '<div class="card lit frame">' +
        '<div class="between"><div><div class="bb small" style="color:var(--goldLit)">' + esc(activeNode.label) +
          " · niv." + activeLv + "/" + activeNode.max + "</div>" +
        '<div class="mute tiny b">' + esc(activeNode.sect) + " — une seule recherche à la fois</div></div>" +
        '<b class="row gap4" style="color:var(--goldLit)">' + ic("clock", 12) + fmtTime(remain) + "</b></div>" +
        '<div class="mt8">' + meter(100 - (remain / (activeTotal || 1)) * 100, C.gold, fmtTime(remain)) + "</div>" +
        (remain <= 0 ? '<div class="mt10">' + btn(ic("check", 13) + "Récupérer", { cls: "green", small: true, act: "collectResearch" }) + "</div>"
          : '<div class="row gap4 mt8" style="flex-wrap:wrap">' + (accelBtns || '<span class="mute tiny">Aucun accélérateur</span>') + "</div>") +
        "</div>"
        : '<div class="notice">' + intro + "</div>") +

      (freeKeys > 0 ? '<div class="card lit mt10"><div class="between"><div>' +
        '<div class="bb small" style="color:var(--goldLit)">' + freeKeys + " clé quotidienne à attribuer</div>" +
        '<div class="mute tiny b">Choisis le raid qui gagne la clé</div></div>' + ic("key", 22) + "</div>" +
        '<div class="row gap6 mt8" style="flex-wrap:wrap">' + RAID_IDS.map((r) =>
          btn(ic(RAIDS[r].icon, 12) + RAIDS[r].reward, { small: true, cls: "ghost", act: "raidKeyAdd", arg: r,
            style: "width:auto;padding:6px 9px" })).join("") + "</div></div>" : "") +

      '<div class="sect" style="margin:16px 0 9px">Arbre (' + owned + "/" + TREE_TOTAL_LEVELS + " niveaux)</div>" +
      '<div class="card" style="padding:8px 4px;overflow:hidden">' +
        '<div id="treeWrap">' + treeGraph(active, remain) + "</div></div>" +

      // node types, colour-matched to the rings and the connecting paths
      '<div class="card mt8" style="padding:9px 11px">' +
        '<div class="mute tiny b" style="letter-spacing:.6px;margin-bottom:6px">TYPES DE NŒUDS</div>' +
        '<div class="col gap4">' + TREE_TYPE_ORDER.map((k) => {
          const t = TREE_TYPES[k];
          return '<div class="row gap8">' +
            '<i style="width:13px;height:13px;border-radius:50%;flex:0 0 auto;background:' + shade(t.c, -34) +
              ";border:2px solid " + t.c + ";box-shadow:0 0 7px " + t.c + '80"></i>' +
            '<span class="b tiny" style="color:' + t.c + ';min-width:74px">' + t.label + "</span>" +
            '<span class="mute tiny flex1">' + t.desc + "</span></div>";
        }).join("") + "</div>" +
        '<div class="divider"></div>' +
        '<div class="mute tiny b" style="letter-spacing:.6px;margin-bottom:6px">ÉTAT</div>' +
        '<div class="row gap6" style="flex-wrap:wrap">' +
        ['<span class="pill" style="border-color:#3FB950;color:var(--greenLit)">Maxé</span>',
         '<span class="pill" style="border-color:#7FD4FF;color:#BFE6FF">Activé</span>',
         '<span class="pill" style="border-color:var(--gold);color:var(--goldLit)">En cours</span>',
         '<span class="pill" style="border-color:var(--purpleLit);color:var(--purpleLit)">Disponible</span>',
         '<span class="pill" style="opacity:.55">Verrouillé</span>'].join("") + "</div></div>" +

      '<div class="sect" style="margin:16px 0 9px">Bonus actifs</div>' +
      '<div class="card">' + bonusRows +
        '<div class="kv"><span class="dim">Multiplicateur de Forge</span><b style="color:var(--goldLit)">×' + forgeBatch(S) + "</b></div>" +
        '<div class="kv"><span class="dim">Plafond AFK</span><b style="color:var(--goldLit)">' + afkCapHours(S) + " h</b></div>" +
        '<div class="kv"><span class="dim">Slots éclosion</span><b style="color:var(--goldLit)">' + S.eggSlots + "/" + RULES.EGG_SLOT_MAX + "</b></div>" +
        (raidKeyGrants(S) > 0
          ? '<div class="kv"><span class="dim">Clés quotidiennes</span><b style="color:var(--goldLit)">' +
            (alloc || "non attribuées") + "</b></div>" : "") +
      "</div>" +

      '<div class="sect" style="margin:16px 0 9px">Points d’Évolution</div>' +
      '<div class="card"><div class="between"><div>' +
        '<div class="bb small" style="color:#8FEFF4">' + fmt(S.pe || 0) + " PE disponibles</div>" +
        '<div class="mute tiny b">Gagnés au Raid Évolution · ouvrent les nœuds et paient leurs niveaux</div></div>' + ic("chart", 22) + "</div>" +
        '<div class="mt8">' + meter(Math.min(100, ((S.pe || 0) / Math.max(1, treeTotalPE())) * 100), C.cyan,
          fmt(S.pe || 0) + " / " + fmt(treeTotalPE()) + " PE pour tout maxer") + "</div>" +
        '<div class="mt8">' + btn(ic("chart", 13) + "Aller au Raid Évolution", { cls: "ghost", small: true, act: "go", arg: "raid" }) + "</div>" +
      "</div>" +
      '<div class="sect" style="margin:16px 0 9px">Accélérateurs</div>' +
      '<div class="card"><div class="row gap6" style="flex-wrap:wrap">' + ACCEL_DEFS.map((a) =>
        '<span class="pill">' + ic("bolt", 10) + a.label + " × " + (S.accels[a.key] || 0) + "</span>").join("") + "</div>" +
        (accelPct > 0 ? '<div class="tiny b mt6 row gap4" style="color:#8FEFF4">' + ic("bolt", 11) +
          "Bonus Arbre : accélérateurs +" + accelPct + "% efficacité</div>" : "") +
      "</div>" +
    '<div style="height:2px"></div></div>';
}

/* ---------------------------- tree node types -----------------------------
   The reference sheet groups nodes by PURPOSE rather than by section, and
   colours both the node ring and the connecting path by that type. Every
   effect in the tree maps onto one of these.
   -------------------------------------------------------------------------- */
const TREE_TYPES = {
  COMBAT:      { label: "Combat",      c: "#E5484D", icon: "sword",   desc: "Augmente ta puissance offensive." },
  SURVIE:      { label: "Survie",      c: "#3FB950", icon: "heart",   desc: "Prolonge ton autonomie de récolte." },
  VITESSE:     { label: "Vitesse",     c: "#4A90D9", icon: "haste",   desc: "Réduit les temps d'attente." },
  RESSOURCES:  { label: "Ressources",  c: "#B15CF6", icon: "poussiere", desc: "Améliore tes gains et ton économie." },
  FAMILIERS:   { label: "Familiers",   c: "#F5C542", icon: "crown",   desc: "Renforce tes familiers et l'éclosion." },
  COMPETENCES: { label: "Compétences", c: "#3FE0C0", icon: "sparkle", desc: "Renforce tes compétences." },
  SPECIAL:     { label: "Nœuds spéciaux", c: "#FFD65E", icon: "key",  desc: "Gros bonus uniques et structurants." },
};
const TREE_TYPE_ORDER = ["COMBAT", "SURVIE", "VITESSE", "RESSOURCES", "FAMILIERS", "COMPETENCES", "SPECIAL"];
const EFFECT_TYPE = {
  skillDmg: "COMBAT", petDmg: "COMBAT",
  afk: "SURVIE", harvestEff: "RESSOURCES",
  mast_arme: "COMBAT", mast_gants: "COMBAT", mast_accessoire: "COMBAT",
  mast_casque: "SURVIE", mast_armure: "SURVIE", mast_bottes: "SURVIE",
  research: "VITESSE", accel: "VITESSE", forgeTime: "VITESSE",
  skillTime: "VITESSE",
  hatch_COMMUN: "VITESSE", hatch_RARE: "VITESSE", hatch_EPIQUE: "VITESSE",
  hatch_MYTHIQUE: "VITESSE", hatch_LEGENDAIRE: "VITESSE",
  minerai: "RESSOURCES", essence: "RESSOURCES", skillPts: "RESSOURCES",
  dust: "RESSOURCES", raidMinerai: "RESSOURCES", forgeCost: "RESSOURCES",
  forgeFree: "RESSOURCES", forgeMulti: "RESSOURCES", forgeMult: "RESSOURCES",
  eggFree: "FAMILIERS", eggSlot: "FAMILIERS",
  skillFree: "COMPETENCES",
  raidKey: "SPECIAL",
};
function nodeType(node) { return TREE_TYPES[EFFECT_TYPE[node.effect] || "RESSOURCES"]; }
function isSpecialNode(node) { return EFFECT_TYPE[node.effect] === "SPECIAL"; }

function hexPath(cx, cy, r) {
  const k = r * 0.866;
  return "M" + cx + " " + (cy - r) + "L" + (cx + k) + " " + (cy - r / 2) + "L" + (cx + k) + " " + (cy + r / 2) +
    "L" + cx + " " + (cy + r) + "L" + (cx - k) + " " + (cy + r / 2) + "L" + (cx - k) + " " + (cy - r / 2) + "Z";
}
/* node state: maxed | busy | part(Open) | open | wait | lock */
function treeState(s, n, active) {
  const lv = treeLv(s, n.id);
  if (active === n.id) return "busy";
  if (lv >= n.max) return "maxed";
  if (!treeReqOk(s, n)) return "lock";
  const affordable = !active && treeAfford(s, n);
  if (lv > 0) return affordable ? "partOpen" : "part";
  return affordable ? "open" : "wait";
}
/* The node art is greyscale with binary alpha: the metal's relief lives in the
   GREY, not the alpha, so masking it would flatten it. Instead each piece is
   multiplied by its colour -- feColorMatrix pulls luminance out of the red
   channel and scales it into RGB, which keeps the shading and the highlights.
   Filters are shared by colour, so the whole tree needs about a dozen. */
const TREE_TINT_GAIN = 1.85;          // mean luminance is ~0.43; this lands it near 0.8
function treeTint(col, reg) {
  const id = "tt" + col.replace("#", "");
  if (!reg[id]) {
    const c = (i) => (parseInt(col.slice(1 + i * 2, 3 + i * 2), 16) / 255 * TREE_TINT_GAIN).toFixed(4);
    reg[id] = '<filter id="' + id + '" x="-30%" y="-30%" width="160%" height="160%" ' +
      'color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="' +
      c(0) + ' 0 0 0 0  ' + c(1) + ' 0 0 0 0  ' + c(2) + ' 0 0 0 0  0 0 0 1 0"/></filter>';
  }
  return id;
}
function treePiece(key, cx, cy, size, col, reg, extra) {
  return '<image href="' + ASSETS["tree_" + key] + '" x="' + (cx - size / 2).toFixed(1) +
    '" y="' + (cy - size / 2).toFixed(1) + '" width="' + size.toFixed(1) + '" height="' + size.toFixed(1) +
    '" filter="url(#' + treeTint(col, reg) + ')" preserveAspectRatio="xMidYMid meet"' +
    (extra || "") + "/>";
}

function treeGraph(active, remain) {
  const R = 19, W = 342;
  const maxRow = TREE_NODES.reduce((m, n) => Math.max(m, n.row), 0);
  const H = TREE_ROW_Y(maxRow) + R + 46;

  let links = "", nodes = "", defs = "", beads = "";
  const filters = {};

  // ---- paths take the colour of the node they lead to (reference sheet) ----
  TREE_NODES.forEach((n) => {
    const ty = nodeType(n);
    n.req.forEach((rq) => {
      const q = TREE_BY_ID[rq];
      if (!q) return;
      const lit = treeLv(S, rq) >= 1;          // prerequisite satisfied
      const done = treeLv(S, n.id) >= 1;       // this branch already taken
      const rq2 = isSpecialNode(n) ? R + 6 : R;
      const bow = Math.min(46, 26 + Math.abs(n.x - q.x) * 0.28);
      links += '<path d="M' + q.x + " " + (q.y + R) + "C" + q.x + " " + (q.y + R + bow) +
        " " + n.x + " " + (n.y - rq2 - bow) + " " + n.x + " " + (n.y - rq2) + '" fill="none" stroke="' +
        (done || lit ? ty.c : "#26344F") + '" stroke-width="' + (done ? 3 : lit ? 2.2 : 1.6) +
        '" stroke-linecap="round" opacity="' + (done ? 0.95 : lit ? 0.6 : 0.35) + '"/>';
      if (done || lit) {
        beads += treePiece("bead", (q.x + n.x) / 2, ((q.y + R) + (n.y - rq2)) / 2,
          done ? 11 : 8, done ? ty.c : "#54709E", filters);
      }
      if (done) {  // travelled paths get a soft glow
        links += '<path d="M' + q.x + " " + (q.y + R) + "C" + q.x + " " + (q.y + R + bow) +
          " " + n.x + " " + (n.y - rq2 - bow) + " " + n.x + " " + (n.y - rq2) +
          '" fill="none" stroke="' + ty.c + '" stroke-width="7" stroke-linecap="round" opacity="0.13"/>';
      }
    });
  });

  TREE_NODES.forEach((n) => {
    const st = treeState(S, n, active);
    const lv = treeLv(S, n.id);
    const ty = nodeType(n);
    const special = isSpecialNode(n);
    const r = special ? R + 6 : R;
    const locked = st === "lock";
    const clickable = st === "open" || st === "partOpen";

    // ring colour reports STATE, fill reports TYPE
    const ring = locked ? "#2E4269"
      : st === "maxed" ? "#3FB950"
      : st === "busy" ? "#E8B44A"
      : (st === "part" || st === "partOpen") ? "#7FD4FF"
      : clickable ? ty.c : "#4A6494";
    const op = locked ? 0.5 : st === "wait" ? 0.82 : 1;
    const glow = !locked && (st === "maxed" || st === "busy" || clickable);

    let sub;
    if (st === "busy") sub = fmtTime(remain);
    else if (locked) sub = "Verrouillé";
    else if (st === "maxed") sub = "MAX";
    else {
      const pc = treeNextCost(S, n);
      sub = pc.amount + " " + pc.kind;
    }
    const subCol = st === "maxed" ? "#84E891" : st === "busy" ? "#FBDD8C"
      : clickable ? "#FBDD8C" : "#6A7B9C";

    // plate carries the CATEGORY colour, ring carries the STATE colour
    const plateCol = locked ? "#33415E" : shade(ty.c, st === "maxed" ? -26 : -20);
    const shape =
      treePiece(special ? "plate_oct" : "plate", n.x, n.y, r * 2, plateCol, filters) +
      treePiece(special ? "ring_oct" : (st === "maxed" ? "ring_max" : "ring"),
        n.x, n.y, r * 2 * (st === "maxed" && !special ? 1.34 : 1.06), ring, filters);
    const halo = treePiece("glow", n.x, n.y, (r + 13) * 2, ring, filters, ' opacity="0.5"');

    // every node opens its detail popup, locked ones included
    nodes += '<g data-act="treeNode" data-arg="' + n.id + '" style="cursor:pointer" opacity="' + op + '">' +
      (glow ? halo : "") + shape +
      // locked nodes show a padlock instead of their own glyph
      '<g transform="translate(' + (n.x - 9.5) + " " + (n.y - 10.5) + ') scale(0.79)">' +
        (locked ? "" : (ICO[n.icon] || "")) + "</g>" +
      (locked ? treePiece("lock", n.x, n.y, r * 1.15, "#8FA4CC", filters) : "") +
      // level pill
      '<rect x="' + (n.x + 1) + '" y="' + (n.y + r - 9) + '" width="27" height="13" rx="6.5" ' +
        'fill="#050A12" stroke="' + ring + '" stroke-width="1" opacity="0.96"/>' +
      '<text x="' + (n.x + 14.5) + '" y="' + (n.y + r + 0.6) + '" text-anchor="middle" font-size="8.5" ' +
        'font-weight="900" font-family="Segoe UI,Roboto,sans-serif" fill="' +
        (lv >= n.max ? "#84E891" : lv > 0 ? "#BFE6FF" : "#8496B8") + '">' + lv + "/" + n.max + "</text>" +
      '<text x="' + n.x + '" y="' + (n.y + r + 18) + '" text-anchor="middle" font-size="8.5" font-weight="800" ' +
        'font-family="Segoe UI,Roboto,sans-serif" fill="#EDF1FA">' + esc(n.short) + "</text>" +
      '<text x="' + n.x + '" y="' + (n.y + r + 28) + '" text-anchor="middle" font-size="7.5" font-weight="700" ' +
        'font-family="Segoe UI,Roboto,sans-serif" fill="' + subCol + '">' + esc(sub) + "</text>" +
      "</g>";
  });

  // each lane heading sits on the painted banner plate
  const CAP_W = 78, CAP_H = 25;
  const caps = ["FORGE", "ÉCLOSION", "COMPÉT.", "UTILITAIRE"].map((t, i) =>
    '<image href="' + ASSETS.tree_banner + '" x="' + (TREE_LANE_X[i] - CAP_W / 2) +
      '" y="1" width="' + CAP_W + '" height="' + CAP_H + '" preserveAspectRatio="xMidYMid meet"/>' +
    '<text x="' + TREE_LANE_X[i] + '" y="17" text-anchor="middle" font-size="7.5" font-weight="900" ' +
    'letter-spacing="0.8" font-family="Segoe UI,Roboto,sans-serif" fill="#F0E2BC">' + t + "</text>").join("");

  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="display:block">' +
    "<defs>" + defs + Object.keys(filters).map((k) => filters[k]).join("") + "</defs>" +
    caps + links + beads + nodes + "</svg>";
}
/* ---------------- REBIRTH ---------------- */
function scrRebirth() {
  const ok = canRebirth();
  const prGainBonus = (S.rebirth.upgrades.prgain || 0) * 5;
  const pr = Math.floor(prFromFloor(S.floor) * (1 + prGainBonus / 100));
  const keepPct = rebirthKeepPct(S.rebirth.upgrades.keep || 0);
  const after = floorAfterRebirth(S);
  const minAfter = RULES.REBIRTH_MIN_FLOOR_AFTER;
  // why is it blocked? unlock not reached, or the next rebirth would sink us
  const notUnlocked = S.recordFloor < RULES.REBIRTH_UNLOCK_FLOOR;
  const wouldSink = !notUnlocked && !ok;

  let body;
  if (ok) {
    body = '<div class="dim small mt6" style="line-height:1.55">Renais pour gagner <b style="color:var(--purpleLit)">' +
        pr + " PR</b>.<br>Tu conserves " + keepPct + "% de ton étage (" + S.floor + " → " + after + ").</div>" +
      '<div class="mt10">' + btn(ic("cycle", 15) + "Renaître · +" + pr + " PR", { cls: "purple", act: "doRebirth" }) + "</div>";
  } else if (notUnlocked) {
    body = '<div class="dim small mt6" style="line-height:1.55">Atteins l' + "’" + "étage " + RULES.REBIRTH_UNLOCK_FLOOR +
        " pour débloquer le Rebirth.<br>Record actuel : étage " + S.recordFloor + ".</div>" +
      '<div class="mt8">' + meter((S.recordFloor / RULES.REBIRTH_UNLOCK_FLOOR) * 100, C.purple,
        S.recordFloor + " / " + RULES.REBIRTH_UNLOCK_FLOOR) + "</div>";
  } else {
    body = '<div class="notice mt8" style="border-left-color:var(--red);text-align:left">' +
        '<b style="color:var(--redLit)">Rebirth impossible : l' + "’" + "étage minimum après Rebirth est " + minAfter + ".</b><br>" +
        "Étage actuel " + S.floor + " · un Rebirth te ramènerait à l" + "’" + "étage " + after +
        ".<br>Remonte au-dessus de l" + "’" + "étage " + Math.ceil(minAfter * 100 / keepPct) +
        " pour pouvoir renaître à nouveau.</div>" +
      '<div class="mt8">' + btn(ic("cycle", 15) + "Renaître", { cls: "purple", act: "doRebirth", dis: true }) + "</div>";
  }

  return topbar("Rebirth", '<span class="pill" style="color:var(--purpleLit);border-color:var(--purple)">' + ic("cycle", 11) + fmt(S.rebirth.pr) + " PR</span>") +
    '<div class="pad mt6">' +
      '<div class="card frame center">' + ic("cycle", 40) +
        '<div class="bb gt mt6" style="font-size:17px;letter-spacing:1.4px">REBIRTH ' + S.rebirth.count + "</div>" +
        body +
        '<div class="mute tiny mt10 row gap4" style="justify-content:center">' + ic("banner", 11) +
        "Points de Guerre : " + fmt(S.warScore) + " (" + RULES.WAR_POINTS_PER_PR + "/PR)</div>" +
      "</div>" +
      '<div class="sect" style="margin:16px 0 9px">Améliorations permanentes</div>' +
      REBIRTH_UPGRADES.map((u) => {
        const lvl = S.rebirth.upgrades[u.key] || 0;
        const maxed = lvl >= u.max;
        const cost = maxed ? 0 : rebirthUpgCost(u.costs, lvl);
        const uc = maxed ? C.green : C.purple;
        return '<div class="itemRow" style="border-left-color:' + uc + '">' +
          '<div class="imini" style="width:30px;height:30px;border-color:' + uc + '80;box-shadow:0 0 9px ' + uc + '33">' +
          ic(u.icon, 18) + "</div>" +
          '<div class="flex1"><div class="between"><span class="b small">' + u.label + "</span>" +
            '<span class="pill" style="padding:1px 8px;font-size:10.5px;color:' + (maxed ? C.green : uc) +
              ";border-color:" + (maxed ? C.green : uc) + '99">Niv. ' + lvl + " / " + u.max + "</span></div>" +
          '<div class="mute tiny b">Actuel : +' + (lvl * u.perLvl).toFixed(u.perLvl < 1 ? 2 : 0) + u.unit +
          (maxed ? "" : " → +" + ((lvl + 1) * u.perLvl).toFixed(u.perLvl < 1 ? 2 : 0) + u.unit) + "</div>" +
          '<div class="mt6">' + bar((lvl / u.max) * 100, maxed ? C.green : C.purple, 4) + "</div></div>" +
          (maxed ? '<span class="pill" style="color:' + C.green + ';border-color:' + C.green + '">MAX</span>'
            : btn(cost + " PR", { small: true, cls: "purple", act: "buyRebirth", arg: u.key,
                dis: S.rebirth.pr < cost, style: "padding:6px 9px;font-size:11px;width:auto" })) +
          "</div>";
      }).join("") +
    '<div style="height:2px"></div></div>';
}

function checkBossReward() {
  if (!bossReward) return;
  const r = bossReward; bossReward = null;

  toast("Boss " + r.floor + " · +" + r.qty + " Accélérateur " + (def ? def.label : ""), true);

function checkLevelUp() {
  if (seenLevel === null) { seenLevel = S.level; return; }
  if (S.level > seenLevel) {
    const from = seenLevel;
    seenLevel = S.level;
    if (!document.getElementById("overlay")) showLevelUp(from, S.level);
  } else if (S.level < seenLevel) {
    seenLevel = S.level;   // rebirth / ascension reset the level
  }
}

/* format one level's worth of this node's effect */
function treeEffectValue(node, level) {
  const v = node.per * level;
  const sign = (node.effect === "research" || node.effect === "forgeTime" ||
    node.effect === "forgeCost" || /^hatch_/.test(node.effect) || node.effect === "skillTime") ? "-" : "+";
  if (node.unit === "×") return "×" + (RULES.FORGE_BATCH_BASE + v);
  if (node.unit === "h") return sign + v + " h";
  if (node.unit === "") return level > 0 ? "Actif" : "—";
  return sign + (Math.round(v * 10) / 10) + node.unit;
}

/* Inspection popup — opens for EVERY node, bought or not, so the player can
   always see what a node does before spending anything on it. */
function showTreeNode(id) {
  const node = TREE_BY_ID[id];
  if (!node) return;
  const lv = treeLv(S, id);
  const maxed = lv >= node.max;
  const busy = S.tree.active === id;
  const otherBusy = !!S.tree.active && !busy;
  const reqOk = treeReqOk(S, node);
  const price = maxed ? null : treeNextCost(S, node);
  const afford = maxed ? false : treeAfford(S, node);
  const dur = maxed ? 0 : treeTime(S, node, lv + 1);
  const col = node.color;

  const missing = node.req.filter((r) => treeLv(S, r) < 1)
    .map((r) => (TREE_BY_ID[r] || {}).label || r);
  const reqNames = node.req.map((r) => {
    const q = TREE_BY_ID[r];
    const ok = treeLv(S, r) >= 1;
    return '<span class="row gap4 tiny b" style="color:' + (ok ? "var(--greenLit)" : "var(--textMute)") + '">' +
      ic(ok ? "check" : "lock", 10) + esc(q ? q.label : r) + " ≥ 1</span>";
  }).join("");

  // headline: what you have now, and what the next level makes it
  const nowTxt = treeEffectValue(node, lv);
  const nextTxt = maxed ? nowTxt : treeEffectValue(node, lv + 1);
  const branchTotal = treeSum(S, node.effect);

  let action, note = "";
  if (maxed) {
    action = btn("Niveau maximum", { cls: "ghost", small: true, dis: true });
    note = "Ce bonus est entièrement débloqué.";
  } else if (busy) {
    action = btn("Recherche en cours", { cls: "ghost", small: true, dis: true });
    note = "Termine ou accélère cette recherche depuis l’Arbre.";
  } else if (!reqOk) {
    action = btn(ic("lock", 13) + "Verrouillé", { cls: "ghost", small: true, dis: true });
    note = "Requiert d’abord : " + missing.join(", ") + ".";
  } else if (otherBusy) {
    action = btn("Une recherche est déjà active", { cls: "ghost", small: true, dis: true });
    note = "Une seule recherche à la fois.";
  } else if (!afford) {
    action = btn(ic("chart", 13) + "Rechercher · " + price.amount + " PE",
      { cls: "purple", small: true, dis: true });
    note = "Il te manque " + (price.amount - (S.pe || 0)) + " PE — gagne-en au Raid Évolution.";
  } else {
    action = btn(ic("chart", 13) + "Rechercher · " + price.amount + " PE",
      { cls: "purple", small: true, act: "research", arg: id });
  }

  openModal(
    '<div class="row gap10" style="margin-bottom:10px">' +
      '<div class="imini" style="width:44px;height:44px;background:linear-gradient(180deg,' + shade(col, 18) + "," +
        shade(col, -40) + ');border-color:' + col + ';box-shadow:0 0 12px ' + col + '4d">' + ic(node.icon, 25) + "</div>" +
      '<div class="flex1"><div class="bb" style="font-size:14px;color:' + col + '">' + esc(node.label) + "</div>" +
      '<div class="row gap4 mt6" style="flex-wrap:wrap"><span class="pill">' + esc(node.sect) + "</span>" +
      '<span class="pill" style="color:' + nodeType(node).c + ";border-color:" + nodeType(node).c +
        '99">' + ic(nodeType(node).icon, 10) + nodeType(node).label + "</span>" +
      '<span class="pill" style="color:' + (maxed ? "var(--greenLit)" : "var(--text)") +
        ";border-color:" + (maxed ? "#3FB950" : "#33486F") + '">' + lv + " / " + node.max + "</span></div></div></div>" +

    '<div class="notice" style="border-left-color:' + col + '">' +
      esc(TREE_EFFECT_INFO[node.effect] || node.label) + "</div>" +

    '<div class="mt10">' + meter((lv / node.max) * 100, maxed ? C.green : col, lv + " / " + node.max) + "</div>" +

    '<div class="card mt10" style="padding:9px 11px">' +
      '<div class="kv"><span class="dim">Effet actuel</span><b>' + nowTxt + "</b></div>" +
      (maxed ? "" : '<div class="kv"><span class="dim">' +
        (busy ? "À la fin de la recherche" : "Après cette recherche") + "</span>" +
        '<b style="color:var(--greenLit)">' + nextTxt + "</b></div>") +
      '<div class="kv"><span class="dim">Maximum (' + node.max + " niv.)</span><b style=\"color:var(--goldLit)\">" +
        treeEffectValue(node, node.max) + "</b></div>" +
      (node.effect !== "raidKey" && node.effect !== "eggSlot"
        ? '<div class="kv"><span class="dim">Total de la branche</span><b style="color:var(--goldLit)">' +
          (Math.round(branchTotal * 10) / 10) + (node.unit === "h" ? " h" : node.unit === "×" ? "" : "%") + "</b></div>"
        : "") +
      (maxed ? ""
        : busy
          // already running: the cost is spent, what matters is the countdown
          ? '<div class="kv"><span class="dim">Temps restant</span><b class="row gap4" style="color:var(--goldLit)">' +
            ic("clock", 12) + fmtTime(Math.max(0, (S.tree.activeEnd - Date.now()) / 1000)) + "</b></div>"
          : '<div class="kv"><span class="dim">Coût</span><b class="row gap4" style="color:' +
            (afford ? "var(--goldLit)" : "var(--textMute)") + '">' +
            ic("chart", 12) + price.amount + " PE</b></div>" +
          '<div class="kv"><span class="dim">Durée</span><b class="row gap4">' + ic("clock", 12) +
            (dur <= 0 ? "Instantané" : fmtDur(dur)) + "</b></div>") +
    "</div>" +

    (node.req.length
      ? '<div class="mt10"><div class="mute tiny b" style="letter-spacing:.6px;margin-bottom:5px">PRÉREQUIS</div>' +
        '<div class="row gap8" style="flex-wrap:wrap">' + reqNames + "</div></div>"
      : "") +

    (note ? '<div class="mute tiny mt10" style="line-height:1.5">' + note + "</div>" : "") +

    '<div class="col gap6 mt10">' + action +
      btn("Fermer", { cls: "dark", small: true, act: "closeModal" }) + "</div>",
    esc(node.label));
}

/* Summon results as framed cards, mirroring the sheet RESULTAT D INVOCATION */
function showSkillResult(res) {
  const best = res.reduce((a, b) =>
    RARITY_ORDER.indexOf(b.rarity) > RARITY_ORDER.indexOf(a.rarity) ? b : a, res[0]);
  const bc = RARITY[best.rarity].c;
  const card = (r) => {
    const def = SKILL_BY_ID[r.id];
    const col = RARITY[r.rarity].c;
    const cat = def ? SKILL_CATS[def.cat] : null;
    return '<div class="resItem rf" style="width:74px;border-color:' + col + ";--rc:" + col + '">' +
      '<span style="position:relative;z-index:1">' + ic(def ? def.icon : "sparkle", 24) + "</span>" +
      '<div class="tiny bb" style="color:' + col + ';line-height:1.1">' + esc(def ? def.name : r.id) + "</div>" +
      (cat ? '<span class="tag" style="color:' + cat.c + ";border-color:" + cat.c + '66">' + cat.label + "</span>" : "") +
      '<div class="tiny b" style="color:' + (r.dup ? "var(--textMute)" : "var(--greenLit)") + '">' +
        (r.dup ? "Doublon" : "Nouveau") + "</div></div>";
  };
  const news = res.filter((r) => !r.dup).length;
  openModal('<div class="center" style="margin-bottom:6px">' + ic("sparkle", 32) + "</div>" +
    '<div class="modalT" style="color:' + bc + ';text-shadow:0 2px 0 #000,0 0 18px ' + bc + '80">' +
      res.length + " INVOCATION" + (res.length > 1 ? "S" : "") + "</div>" +
    '<div class="resGrid">' + res.slice(0, 12).map(card).join("") + "</div>" +
    '<div class="dim small center" style="margin-bottom:10px">' +
      (news ? news + " nouvelle" + (news > 1 ? "s" : "") + " compétence" + (news > 1 ? "s" : "")
            : "Doublons — ils font monter le niveau des compétences possédées") + "</div>" +
    btn("Continuer", { cls: "purple", act: "closeModal" }), "Résultat d’invocation");
}
function showSkillSlotPicker(idx) {
  const owned = SKILL_DEFS.filter((d) => S.skills[d.id]);
  openModal((owned.length === 0 ? '<div class="dim small center" style="margin-bottom:12px">Aucune compétence possédée.</div>'
      : '<div class="scroller">' + owned.map((d) =>
        '<div class="itemRow" style="border-left-color:' + d.color + ';cursor:pointer" data-act="setSkill" data-arg="' + idx +
        '" data-arg2="' + d.id + '">' +
        '<div class="imini" style="width:32px;height:32px;background:linear-gradient(180deg,' + shade(d.color, 18) + "," +
        shade(d.color, -38) + ');border-color:' + d.color + '">' + ic(d.icon, 20) + "</div>" +
        '<div class="flex1">' +
        '<div class="b small">' + d.name + '</div><div class="mute tiny b">Niv.' + S.skills[d.id].level + " · CD " + d.cd + "s</div></div>" +
        (S.skillSlots[idx] === d.id ? '<span class="pill" style="color:var(--greenLit);border-color:#3FB950">Actuelle</span>'
          : ic("chevron", 11)) + "</div>").join("") + "</div>") +
    '<div class="col gap6 mt10">' +
      (S.skillSlots[idx] ? btn("Vider l'emplacement", { cls: "dark", small: true, act: "setSkill", arg: idx, arg2: "" }) : "") +
      btn("Fermer", { cls: "ghost", small: true, act: "closeModal" }) + "</div>",
    "Emplacement " + (idx + 1));
}

function showRaidResult(r) {
  const meta = RAIDS[r.raidId];
  const col = r.won ? C.gold : C.red;
  openModal('<div class="center">' + ic(r.won ? "trophy" : "skull", 40) + "</div>" +
    '<div class="modalT mt6" style="color:' + (r.won ? "var(--goldLit)" : "var(--redLit)") +
      ';text-shadow:0 2px 0 #000,0 0 18px ' + col + '80">' + (r.won ? "VICTOIRE" : "DÉFAITE") + "</div>" +
    '<div class="dim small center" style="margin-bottom:12px;line-height:1.55">' + meta.name + " · niveau " + r.level + "<br>" +
    (r.won ? 'Récompense : <b style="color:' + meta.color + '">+' + fmt(r.reward) + " " + meta.reward +
      "</b><br>Niveau de raid suivant débloqué."
      : "La clé est consommée. Renforce ton personnage et réessaie.") + "</div>" +
    btn("Continuer", { cls: r.won ? "green" : "ghost", act: "closeRaid" }),
    r.won ? "Raid terminé" : "Raid échoué");
}

function askReset() {
  openModal('<div class="center">' + ic("trash", 34) + "</div>" +
    '<div class="dim small center mt6" style="margin-bottom:14px;line-height:1.55">Toute la progression locale sera effacée : ' +
    "niveau, étage, équipement, compétences, familiers, rebirth et ascension. <b>Action irréversible.</b></div>" +
    '<div class="row gap6">' + btn("Annuler", { cls: "ghost", act: "closeModal" }) +
    btn("Tout effacer", { cls: "red", act: "doReset" }) + "</div>", "Réinitialiser ?");
}

const ACT = {
  go: (a) => nav(a),
  goModal: (a) => { closeModal(); nav(a); },
  harvest: () => showHarvestModal(),
  ascendAsk: (a) => showAscendModal(a),
  ascendDo: (a) => {
    const r = doAscendMastery(a);
    closeModal();
    if (!r.ok) { toast("Maîtrise pas encore au maximum"); return; }
    const cfg = ASCENSION[a];
    toast("Ascension " + cfg.label + " ★ " + r.stars + " — base ×" + cfg.statMul, true);
  },
  resInfo: (a) => showResourceInfo(a),
  statInfo: (a) => showStatInfo(a),
  harvestClaim: () => {
    let got = null;
    update((st) => { got = harvestClaim(st); });
    if (!got) return;
    const bits = [];
    if (got.minerai) bits.push(fmt(got.minerai) + " Minerai");
    if (got.essence) bits.push(fmt(got.essence) + " Essence");
    if (got.eclat) bits.push(fmt(got.eclat) + " Compét.");
    if (got.gold) bits.push(fmt(got.gold) + " Or");
    toast(bits.length ? "+" + bits.join(" · ") : "Rien à réclamer", bits.length > 0);
    closeModal();
  },
  back: () => nav(TAB_IDS.includes(route) ? "accueil" : "accueil"),
  closeModal: () => closeModal(),
  locked: (a) => toast("Débloqué au niveau " + a),

  // forge
  forge: (a) => {
    const r = forgeSummon(parseInt(a, 10));
    if (r.length) showForgeResult(r); else toast("Minerai insuffisant");
  },
  forgeUpgrade: () => {
    const r = upgradeForge();
    if (r.ok) toast(r.instant ? "Forge améliorée !" : "Amélioration lancée", true);
    else toast(r.reason === "gold" ? "Or insuffisant"
      : r.reason === "gauge" ? "Jauge de Forge incomplète"
      : r.reason === "max" ? "Forge au maximum" : "Amélioration en cours");
  },
  forgeCollect: () => { collectForgeUpgrade(); toast("Forge améliorée !", true); },
  autoForge: () => { toggleAutoForge(); toast("Auto-forge " + (S.forge.autoForge ? "activée" : "désactivée"), S.forge.autoForge); },

  // stats
  alloc: (a, b) => { allocStat(a, b === "max" ? S.statPoints : parseInt(b, 10)); },

  // items
  itemDetail: (a, b) => showItemDetail(a, b),
  equip: (a) => { equipItem(a); closeModal(); toast("Équipé", true); },
  unequip: (a) => { unequipItem(a); closeModal(); toast("Déséquipé"); },
  recycle: (a) => { const d = recycleItem(a); toast(d ? "+" + d + " poussière" : "Objet introuvable", !!d); },
  upgradeItem: (a) => {
    if (upgradeItem(a)) { showItemDetail(a, null); toast("Amélioré !", true); }
    else toast("Poussière insuffisante");
  },
  invFilter: (a) => { invFilter = a; render(); },

  // skills
  summonSkill: (a) => {
    const r = summonSkill(parseInt(a, 10));
    if (!r.length) { toast("Éclats insuffisants"); return; }
    showSkillResult(r);
  },
  skillSlot: (a) => showSkillSlotPicker(parseInt(a, 10)),
  setSkill: (a, b) => { equipSkill(parseInt(a, 10), b || null); closeModal(); },
  autoEquipSkill: (a) => {
    const empty = S.skillSlots.slice(0, skillSlotCount(S)).indexOf(null);
    equipSkill(empty >= 0 ? empty : 0, a);
    toast("Compétence équipée", true);
  },

  // pets
  summonEgg: (a) => {
    const r = summonEgg(parseInt(a, 10));
    if (!r.length) toast(S.eggs.length >= S.eggSlots ? "Emplacements d'œufs pleins" : "Essence insuffisante");
    else toast(r.length + " œuf" + (r.length > 1 ? "s" : "") + " en incubation", true);
  },
  collectEgg: (a) => { collectEgg(a); toast("Familier obtenu !", true); },
  fuse: (a) => {
    if (fusePets(a)) toast("Fusion réussie !", true);
    else toast(petFuseNeed(a) + " " + RARITY[a].label + " identiques requis");
  },
  setPet: (a) => { setActivePet(a); toast("Familier actif", true); },
  upgradePet: (a) => {
    if (upgradePet(a)) toast("Familier ameliore !", true); else toast("Essence insuffisante");
  },
  raidKeyAdd: (a) => {
    if (assignRaidKey(a, 1)) toast("Cle quotidienne attribuee a " + RAIDS[a].name, true);
    else toast("Aucune cle disponible");
  },
  buyEggSlot: () => { if (buyEggSlot()) toast("Emplacement ajouté !", true); else toast("Conditions non remplies"); },

  // raids
  startRaid: (a, b) => {
    const ok = startRaid(a, b === "1", (won, reward) => {
      raidResult = { raidId: a, won, reward, level: S.raids[a].record || S.raids[a].level };
      showRaidResult(raidResult);
      scheduleRender();
    });
    if (!ok) toast("Aucune clé disponible");
    else { nav("raid"); }
  },
  abortRaid: () => { combat = null; startCampaign(); nav("accueil"); toast("Raid abandonné"); },
  closeRaid: () => { closeModal(); raidResult = null; startCampaign(); nav("raid"); },
  adKey: () => { if (watchAdForKey()) toast("+1 clé universelle", true); else toast("Plafond atteint"); },

  // tree
  treeNode: (a) => showTreeNode(a),
  research: (a) => {
    if (startResearch(a)) { closeModal(); toast("Recherche lancée", true); }
    else toast("Conditions non remplies");
  },
  collectResearch: () => { collectResearch(); toast("Nœud débloqué !", true); },
  accel: (a, b) => {
    const target = b === "tree" ? { type: "tree" }
      : b === "forge" ? { type: "forge" }
      : { type: "egg", id: b.split(":")[1] };
    if (useAccelerator(target, a)) toast("Accélérateur utilisé", true); else toast("Impossible ici");
  },

  // rebirth / ascension
  doRebirth: () => {
    const pr = doRebirth();
    if (pr) { toast("+" + pr + " PR", true); nav("rebirth"); }
    else toast("Rebirth impossible : étage minimum après Rebirth = " + RULES.REBIRTH_MIN_FLOOR_AFTER);
  },
  buyRebirth: (a) => { if (buyRebirth(a)) toast("Amélioration achetée", true); else toast("PR insuffisants"); },
  startTrial: () => {
    startAscensionTrial((won) => {
      if (won) {
        doAscension();
        openModal('<div class="center">' + ic("crown", 44) + "</div>" +
          '<div class="modalT mt6" style="color:var(--goldLit);text-shadow:0 2px 0 #000,0 0 20px #E8B44A99">ASCENSION !</div>' +
          '<div class="dim small center" style="margin-bottom:12px;line-height:1.55">Palier ' + S.ascension +
          " atteint.<br>+" + ASCENSION_GEMS[Math.max(0, S.ascension - 1)] + " gemmes, +2 accélérateurs 30 min, +2 clés par raid.<br>" +
          "Ton niveau repart à 1 — les bonus permanents restent.</div>" +
          btn("Continuer", { cls: "green", act: "closeTrial" }), "Palier franchi");
      } else {
        openModal('<div class="center">' + ic("skull", 38) + "</div>" +
          '<div class="modalT mt6" style="color:var(--redLit)">ÉPREUVE ÉCHOUÉE</div>' +
          '<div class="dim small center" style="margin:0 0 12px;line-height:1.55">Le Gardien est trop fort. Renforce-toi et réessaie.</div>' +
          btn("Continuer", { cls: "ghost", act: "closeTrial" }), "Épreuve d'Ascension");
      }
      scheduleRender();
    });
    nav("ascension");
  },
  closeTrial: () => { closeModal(); startCampaign(); nav("ascension"); },

  // shop
  buyPack: () => toast("Paiement bientôt disponible"),
  buyDeal: (a) => {
    const d = GEM_DEALS.find((x) => x.id === a);
    const ok = spendGems(d.cost, (s) => {
      if (a === "key") s.universalKeys = Math.min(RULES.UNIVERSAL_KEY_CAP, s.universalKeys + 1);
      if (a === "acc15") s.accels.a15 = (s.accels.a15 || 0) + 5;
      if (a === "acc60") s.accels.a60 = (s.accels.a60 || 0) + 2;
      if (a === "minerai") s.minerai += 5000;
    });
    toast(ok ? "Acheté !" : "Gemmes insuffisantes", ok);
  },

  // event
  claimEvent: (a) => { claimEvent(a); toast(S.eventClaims[a] ? "Récompense réclamée" : "Objectif non atteint", S.eventClaims[a]); },

  // settings
  saveNow: () => { saveNow(); toast("Sauvegardé", true); },
  warpDay: () => { warpDay(); toast("+1 jour simulé", true); },
  rename: () => {
    const n = prompt("Nom du héros :", S.playerName);
    if (n && n.trim()) { update((s) => { s.playerName = n.trim().slice(0, 18); }); toast("Renommé", true); }
  },
  askReset: () => askReset(),
  doReset: () => { closeModal(); resetGame(); nav("accueil"); toast("Progression réinitialisée", true); },
  exportSave: () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "shadowreach-save.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Sauvegarde exportée", true);
  },
  importSave: () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          S = migrate(JSON.parse(String(fr.result)), "Héros");
          applyDailyReset(S);
          S.power = computePower(S);
          refreshDerived();
          saveNow();
          startCampaign();
          nav("accueil");
          toast("Sauvegarde importée", true);
        } catch (e) { toast("Fichier invalide"); }
      };
      fr.readAsText(f);
    };
    inp.click();
  },
};

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.stopPropagation();
  fn(el.dataset.arg, el.dataset.arg2);
});

/* ---------------- go ---------------- */
boot();
render();
rafLoop();

</script>
</body>
</html>
