function treePointsForLevel(level) {
  let total = 0;
  for (let l = 2; l <= level; l++) total += l % 5 === 0 ? 2 : 1;
  return total;
}

function migrate(s, name) {
  const base = defaultState(name);
  if (!s || typeof s !== "object") return base;
  const merged = Object.assign({}, base, s, {
    version: SAVE_VERSION,
    stats: Object.assign({}, base.stats, s.stats || {}),
    forge: Object.assign({}, base.forge, s.forge || {}),
    raids: Object.assign({}, base.raids, s.raids || {}),
    rebirth: Object.assign({}, base.rebirth, s.rebirth || {}),
    tree: Object.assign({}, base.tree, s.tree || {}),
    accels: Object.assign({}, base.accels, s.accels || {}),
    equipped: Object.assign({}, base.equipped, s.equipped || {}),
    raidKeyAlloc: Object.assign({}, base.raidKeyAlloc, s.raidKeyAlloc || {}),
    skillSlots: (function () {
      const a = Array.isArray(s.skillSlots) ? s.skillSlots.slice(0, 5) : [];
      while (a.length < 5) a.push(null);
      return a;
    })(),
    harvest: Object.assign({}, base.harvest, s.harvest || {}),
    stars: Object.assign({}, base.stars, s.stars || {}),
  });

  // ---- tree: the old save held a flat `unlocked` id list of single-level nodes.
  // Those ids no longer exist, so refund their points rather than dropping them.
  if (!merged.tree.levels || typeof merged.tree.levels !== "object") merged.tree.levels = {};
  // the global hatch node became one node per rarity; refund the point it cost
  const hadGlobalHatch = !!merged.tree.levels.e1_time;
  const legacy = Array.isArray(s.tree && s.tree.unlocked) ? s.tree.unlocked : null;
  if (legacy) {
    let refund = 0;
    legacy.forEach((id) => { if (!TREE_BY_ID[id]) refund += 2; });
    merged.treePoints = (merged.treePoints || 0) + refund;
    delete merged.tree.unlocked;
  }
  if (typeof merged.tree.active === "string" && !TREE_BY_ID[merged.tree.active]) {
    merged.tree.active = null; merged.tree.activeEnd = 0;
  }
  merged.tree.activeLevel = merged.tree.activeLevel || 0;
  // drop levels for ids that no longer exist, keep the rest
  Object.keys(merged.tree.levels).forEach((id) => {
    if (!TREE_BY_ID[id]) delete merged.tree.levels[id];
    else merged.tree.levels[id] = Math.min(merged.tree.levels[id], TREE_BY_ID[id].max);
  });
  // PA is retired — PE is the tree's only currency now. Convert whatever this
  // save still holds, at the rate that preserves its buying power. Only a save
  // that actually carried PA is converted, so this can never become a faucet:
  // a state written by this version has no treePoints and no tree.unlocked.
  if (typeof merged.pe !== "number") merged.pe = 0;
  let paCarry = typeof s.treePoints === "number"
    ? (merged.treePoints || 0)
    : (legacy ? treePointsForLevel(merged.level) + (merged.treePoints || 0) : 0);
  if (hadGlobalHatch) paCarry += 1;
  if (paCarry > 0) merged.pe += Math.round(paCarry * PA_TO_PE);
  delete merged.treePoints;
  if (!merged.bossRewardsClaimed || typeof merged.bossRewardsClaimed !== "object") {
    // older saves only had bossClears — treat those as already rewarded
    merged.bossRewardsClaimed = Object.assign({}, merged.bossClears || {});
  }
  merged.equipped = merged.equipped || {};
  // gear made before affixes existed simply has none; never retro-roll it
  Object.keys(merged.equipped).forEach((k) => {
    if (merged.equipped[k] && !merged.equipped[k].affixes) merged.equipped[k].affixes = [];
  });
  (merged.inventory || []).forEach((it) => { if (it && !it.affixes) it.affixes = []; });
  if (s.raidKeyBonus) {   // legacy single-raid key bonus -> allocation table
    merged.raidKeyAlloc[s.raidKeyBonus] = (merged.raidKeyAlloc[s.raidKeyBonus] || 0) + 1;
    delete merged.raidKeyBonus;
  }
  // ---- pets gained an internal upgrade level
  merged.pets = (merged.pets || []).map((p) =>
    Object.assign({ level: 0, species: randSpecies(), element: randElement() }, p));
  merged.eggs = (merged.eggs || []).map((e) =>
    Object.assign({ species: randSpecies(), element: randElement() }, e));
  return merged;
}

function rb(s, key) {
  const def = REBIRTH_UPGRADES.find((u) => u.key === key);
  if (!def) return 0;
  return (s.rebirth.upgrades[key] || 0) * def.perLvl;
}
/* ---- tree accessors: level 1 == activated, so children open immediately ---- */
function treeLv(s, id) { return (s.tree.levels && s.tree.levels[id]) || 0; }
function hasTree(s, id) { return treeLv(s, id) >= 1; }
/* summed value of every node feeding one effect, e.g. tsum(s,"minerai") -> 85 (%) */
function treeSum(s, effect) {
  let t = 0;
  for (let i = 0; i < TREE_NODES.length; i++) {
    const n = TREE_NODES[i];
    if (n.effect === effect) t += treeLv(s, n.id) * n.per;
  }
  return t;
}
/* a node's prerequisites are met when each listed node is at level >= 1 */
function treeReqOk(s, node) { return node.req.every((r) => treeLv(s, r) >= 1); }
function treeNextLevel(s, node) { return treeLv(s, node.id) + 1; }
/* what the NEXT level of this node costs — always PE: {kind:"PE", amount} */
function treeNextCost(s, node) {
  const lv = treeLv(s, node.id);
  if (lv === 0) return { kind: "PE", amount: node.cost };
  const base = PE_TIER_COST[node.tier - 1];
  return { kind: "PE", amount: Math.round(base * Math.pow(PE_LEVEL_GROWTH, lv - 1)) };
}
function treeAfford(s, node) { return (s.pe || 0) >= treeNextCost(s, node).amount; }
function treeCanBuy(s, node) {
  return !s.tree.active && treeLv(s, node.id) < node.max &&
    treeReqOk(s, node) && treeAfford(s, node);
}
/* total PE needed to open AND max every node */
function treeTotalPE() {
  let t = 0;
  TREE_NODES.forEach((nd) => {
    const base = PE_TIER_COST[nd.tier - 1];
    t += nd.cost;
    for (let lv = 1; lv < nd.max; lv++) t += Math.round(base * Math.pow(PE_LEVEL_GROWTH, lv - 1));
  });
  return t;
}
/* duration of the level being researched, cut by the Recherche branch */
function treeTime(s, node, level) {
  const raw = node.times[Math.min(level - 1, node.times.length - 1)] || 0;
  const cut = Math.min(70, treeSum(s, "research"));      // hard floor at -70%
  return Math.max(0, Math.round(raw * (1 - cut / 100)));
}
/* total daily raid keys granted by the tree, and how many are still unassigned */
function raidKeyGrants(s) { return treeSum(s, "raidKey"); }
function raidKeyAssigned(s) {
  const a = s.raidKeyAlloc || {};
  return RAID_IDS.reduce((t, r) => t + (a[r] || 0), 0);
}
function raidKeyFree(s) { return Math.max(0, raidKeyGrants(s) - raidKeyAssigned(s)); }
function raidKeyCapFor(s, raid) {
  return RULES.RAID_KEY_CAP + ((s.raidKeyAlloc || {})[raid] || 0);
}
/* forge batch size: the game reaches x5 on its own, the tree finishes x10 */
function forgeBatch(s) {
  return Math.min(RULES.FORGE_BATCH_MAX,
    RULES.FORGE_BATCH_BASE + treeSum(s, "forgeMulti") + treeSum(s, "forgeMult"));
}
/* ---------------------------- Récolte automatique --------------------------
   A permanent passive production. It runs while the game is open, while it is
   in the background and while it is closed -- the player never has to quit to
   earn it. Resources land in a reserve that is claimed on demand.

   AUTONOMIE caps how long the reserve can keep filling. It does NOT change the
   rate. EFFICACITÉ D'AUTONOMIE changes the rate and nothing else.
   -------------------------------------------------------------------------- */
function afkCapHours(s) { return RULES.AFK_BASE_HOURS + treeSum(s, "afk"); }
function harvestCapSeconds(s) { return afkCapHours(s) * 3600; }
function harvestEfficiency(s) { return Math.min(100, treeSum(s, "harvestEff")); }

/* Per hour, efficiency already applied. The three raid-referenced resources use
   the level the player has actually reached -- no key is spent, no raid is won
   and no level is ever unlocked by this. PE is deliberately absent: it stays
   exclusive to the Raid Évolution. */
function harvestRates(s) {
  const eff = 1 + harvestEfficiency(s) / 100;
  return {
    minerai: raidReward("minerai", s.raids.minerai.level) * 1.00 * eff,
    essence: raidReward("familier", s.raids.familier.level) * 0.25 * eff,
    eclat: raidReward("competence", s.raids.competence.level) * 0.25 * eff,
    gold: goldReward(s.floor) * HARVEST_GOLD_PER_HOUR * eff,
  };
}
/* Gold is floor-driven rather than raid-driven. 720/h meant the Récolte paid
   as if the player killed 720 enemies an hour, against ~400 for someone
   actually playing -- so idling out-earned playing, and the Récolte was 57% of
   early income. At 60/h an hour of Récolte is worth about a quarter of an hour
   of active play, which is what makes it a complement. */
const HARVEST_GOLD_PER_HOUR = 60;

function harvestAdvance(s, seconds) {
  const h = s.harvest;
  if (!h) return 0;
  const room = Math.max(0, harvestCapSeconds(s) - h.secs);
  const dt = Math.min(Math.max(0, seconds), room);
  if (dt <= 0) return 0;
  const r = harvestRates(s), frac = dt / 3600;
  h.minerai += r.minerai * frac;
  h.essence += r.essence * frac;
  h.eclat += r.eclat * frac;
  h.gold += r.gold * frac;
  h.secs += dt;
  return dt;
}
/* whole numbers are paid out, the sub-unit remainder stays in the reserve so
   a 12.5/h rate never loses its halves across repeated claims */
function harvestClaim(s) {
  const h = s.harvest;
  const got = { minerai: Math.floor(h.minerai), essence: Math.floor(h.essence),
    eclat: Math.floor(h.eclat), gold: Math.floor(h.gold), secs: Math.floor(h.secs) };
  s.minerai += got.minerai; h.minerai -= got.minerai;
  s.essence += got.essence; h.essence -= got.essence;
  s.eclat += got.eclat;     h.eclat -= got.eclat;
  s.gold += got.gold;       h.gold -= got.gold;
  h.secs = 0;
  return got;
}
function harvestIsEmpty(s) {
  const g = s.harvest;
  return !g || (Math.floor(g.minerai) + Math.floor(g.essence) + Math.floor(g.eclat) + Math.floor(g.gold)) <= 0;
}

function computeDerived(s) {
  let equipHP = 0, equipDmg = 0;
  Object.keys(s.equipped).forEach((slot) => {
    const it = s.equipped[slot];
    if (!it) return;
    // Maîtrise scales the stat that slot is built around, not both
    const m = 1 + treeSum(s, "mast_" + slot) / 100;
    if (MASTERY_STAT[slot] === "dmg") { equipDmg += it.damage * m; equipHP += it.hp; }
    else { equipHP += it.hp * m; equipDmg += it.damage; }
  });
  const pet = s.pets.find((p) => p.id === s.activePetId);
  // the pet grants the same % to damage and HP; the tree's "Dégâts des
  // Familiers" branch scales only the damage half
  const petPct = petBonus(pet);
  const el = pet ? petElement(pet).id : null;
  // the pet element adds a light twist on top of the rarity bonus
  const petDmgPct = petPct * (1 + treeSum(s, "petDmg") / 100) * (el === "normal" ? 1.10 : 1);
  const forgePct = s.forge.level * 2;

  const lifeMul = 1 + rb(s, "life") / 100 + petPct / 100 + forgePct / 200;
  const dmgMul  = 1 + rb(s, "damage") / 100 + petDmgPct / 100 + forgePct / 100;

  // random bonuses carried by equipped gear
  const af = equippedAffixes(s);
  const A = (k) => af[k] || 0;

  const maxHP = Math.floor((BASE.hp + s.stats.sante * STATS.SANTE.perPoint + equipHP) * lifeMul * (1 + A("hp") / 100));
  const damage = Math.floor((BASE.damage + s.stats.degats * STATS.DEGATS.perPoint + equipDmg) * dmgMul * (1 + A("dmg") / 100));
  const critChance = Math.min(CRIT_CHANCE_CAP, BASE.critChance + s.stats.crit * STATS.CRIT.perPoint + A("crit"));
  const critMult = BASE.critMult + rb(s, "critdmg") / 100 + A("critdmg") / 100;
  const critRed = Math.min(CRIT_RED_CAP, s.stats.critred * STATS.CRITRED.perPoint);
  const attackSpeed = BASE.attackSpeed * (1 + rb(s, "atkspeed") / 100) * (1 + A("atkspeed") / 100)
    * (el === "electrique" ? 1.08 : 1);
  const moveSpeed = BASE.moveSpeed * (1 + A("movespeed") / 100);
  const weapon = (s.equipped.arme && s.equipped.arme.weaponType) || "epee";

  const power = Math.floor(maxHP * 0.15 + damage * 12 + s.level * 40 + s.rebirth.pr * 25 +
    (s.forge.level + s.forge.masteryLevel) * 30 + s.ascension * 5000);

  return {
    maxHP, damage, attackSpeed, moveSpeed, critChance, critMult, critRed,
    dmgRed: rb(s, "dmgred"), regen: rb(s, "regen"),
    lifesteal: rb(s, "lifesteal") + A("lifesteal"),
    bossDmg: rb(s, "bossdmg"),
    // affix-only combat stats
    blockChance: Math.min(75, A("block")),
    doubleAtk: Math.min(100, A("double")),
    meleeDmg: A("melee"), rangedDmg: A("ranged"),
    skillCdCut: Math.min(80, A("skillcd")),
    affixes: af,
    // gold / exp scaling belongs to Rebirth — the tree deliberately has no
    // blanket "more of every resource" node
    goldBonus: rb(s, "gold"),
    expBonus: rb(s, "exp"),
    // tree-driven multipliers, applied at the point each resource is granted
    petPct, petDmgPct, petElem: el,
    skillDmgBonus: treeSum(s, "skillDmg") + A("skilldmg"),
    mineraiBonus: treeSum(s, "minerai"),
    essenceBonus: treeSum(s, "essence"),
    eclatBonus: treeSum(s, "skillPts"),
    dustBonus: treeSum(s, "dust"),
    raidMineraiBonus: treeSum(s, "raidMinerai"),
    forgeFree: treeSum(s, "forgeFree"),
    eggFree: treeSum(s, "eggFree"),
    skillFree: treeSum(s, "skillFree"),
    weapon, _power: power,
  };
}
function computePower(s) { return computeDerived(s)._power || 0; }

/* ---------------------------- equipment affixes ---------------------------
   Gear from RARE upward carries random stat bonuses on top of its main stats.
   Rarity drives TWO things independently: the base power of the item, and how
   good its random bonuses can roll — so two items of the same rarity can be
   worth very different amounts.

   `cap` is an ABSOLUTE ceiling that no roll may ever exceed.
   These values are frozen when the item is created and are never touched by
   Poussière upgrades (see upgradeItem).
   -------------------------------------------------------------------------- */
const AFFIX_DEFS = [
  { key: "dmg",       label: "Dégâts",                 icon: "flame",   cap: 30 },
  { key: "block",     label: "Chance de blocage",      icon: "shield",  cap: 7 },
  { key: "lifesteal", label: "Vol de vie",             icon: "droplet", cap: 20 },
  { key: "hp",        label: "Santé",                  icon: "heart",   cap: 25 },
  { key: "melee",     label: "Dégâts corps à corps",   icon: "sword",   cap: 60 },
  { key: "crit",      label: "Chance critique",        icon: "target",  cap: 16 },
  { key: "ranged",    label: "Dégâts à distance",      icon: "forward", cap: 20 },
  { key: "atkspeed",  label: "Vitesse d'attaque",      icon: "bolt",    cap: 50 },
  { key: "critdmg",   label: "Dégâts critiques",       icon: "sparkle", cap: 100 },
  { key: "skilldmg",  label: "Dégâts des Compétences", icon: "eclat",   cap: 50 },
  { key: "skillcd",   label: "Recharge Compétences",   icon: "clock",   cap: 10, negative: true },
  { key: "movespeed", label: "Vitesse de déplacement", icon: "boot",    cap: 30 },
  { key: "double",    label: "Double attaque",         icon: "swords",  cap: 20 },
];
const AFFIX_BY_KEY = {};
AFFIX_DEFS.forEach((a) => { AFFIX_BY_KEY[a.key] = a; });

/* How many bonuses a rarity grants, and the slice of each cap it may roll.
   `lo`/`hi` are fractions of the cap; `bias` > 1 skews rolls toward the low
   end, < 1 toward the high end. Only MYTHIQUE and above can reach hi = 1,
   so Rare and Épique can never produce a maxed value. */
const AFFIX_TIERS = {
  COMMUN:     { count: 0, lo: 0,    hi: 0,    bias: 1 },
  RARE:       { count: 1, lo: 0.10, hi: 0.45, bias: 1.60 },
  EPIQUE:     { count: 2, lo: 0.15, hi: 0.62, bias: 1.40 },
  MYTHIQUE:   { count: 2, lo: 0.22, hi: 1.00, bias: 1.35 },
  HEROIQUE:   { count: 2, lo: 0.30, hi: 1.00, bias: 1.20 },
  ANCESTRAL:  { count: 2, lo: 0.38, hi: 1.00, bias: 1.05 },
  LEGENDAIRE: { count: 2, lo: 0.46, hi: 1.00, bias: 0.92 },
  DIVIN:      { count: 2, lo: 0.55, hi: 1.00, bias: 0.78 },
};
function affixRound(def, v) {
  return def.cap <= 20 ? Math.round(v * 10) / 10 : Math.round(v);
}
/* roll one bonus value for a given rarity, never above the absolute cap */
function rollAffixValue(def, rarity) {
  const t = AFFIX_TIERS[rarity] || AFFIX_TIERS.COMMUN;
  const q = Math.pow(Math.random(), t.bias);          // 0..1, skewed by rarity
  const frac = t.lo + (t.hi - t.lo) * q;
  return Math.max(affixRound(def, def.cap * t.lo),
    Math.min(def.cap, affixRound(def, def.cap * frac)));
}
/* draw `count` DISTINCT bonus types, each with its own independent value */
function rollAffixes(rarity) {
  const t = AFFIX_TIERS[rarity] || AFFIX_TIERS.COMMUN;
  if (!t.count) return [];
  const pool = AFFIX_DEFS.slice();
  const out = [];
  for (let i = 0; i < t.count && pool.length; i++) {
    const def = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    out.push({ key: def.key, value: rollAffixValue(def, rarity) });
  }
  return out;
}
/* how close to the cap a roll landed — drives the quality tint in the UI */
function affixQuality(a) {
  const def = AFFIX_BY_KEY[a.key];
  return def ? a.value / def.cap : 0;
}
function affixColor(a) {
  const q = affixQuality(a);
  return q >= 0.95 ? "#FF4D8D" : q >= 0.8 ? "#F5C542" : q >= 0.55 ? "#B15CF6"
    : q >= 0.3 ? "#3FA7FF" : "#9FB0C8";
}
function affixText(a) {
  const def = AFFIX_BY_KEY[a.key];
  if (!def) return "";
  return (def.negative ? "-" : "+") + a.value + "% " + def.label;
}
/* every affix on equipped gear, summed by key */
function equippedAffixes(s) {
  const t = {};
  Object.values(s.equipped).forEach((it) => {
    if (!it || !it.affixes) return;
    it.affixes.forEach((a) => { t[a.key] = (t[a.key] || 0) + a.value; });
  });
  return t;
}

const RARITY_NAMES = ["Rouillé", "Aiguisé", "Runique", "Spectral", "Héroïque", "Ancestral", "Céleste", "Divin"];
function makeItem(slot, rarity, forgeLevel) {
  const mul = RARITY_MUL[rarity];
  // Forge stars raise the power of everything it can produce
  const base = (6 + forgeLevel * 2) * starMul(S, "forge");
  const wt = slot === "arme" ? WEAPON_LIST[Math.floor(Math.random() * WEAPON_LIST.length)] : undefined;
  const dmg = (slot === "arme" || slot === "gants" || slot === "accessoire")
    ? Math.floor(base * mul * (0.9 + Math.random() * 0.4)) : Math.floor(base * mul * 0.3);
  const hp = (slot === "casque" || slot === "armure" || slot === "bottes")
    ? Math.floor(base * mul * 4 * (0.9 + Math.random() * 0.4)) : Math.floor(base * mul * 1.2);
  const name = SLOT_LABEL[slot] + " " + (RARITY_NAMES[equipRank(rarity)] || "");
  return { id: rid(), slot, rarity, weaponType: wt, damage: dmg, hp, level: 0,
    power: dmg + hp, name: name.trim(), affixes: rollAffixes(rarity) };
}
/* =========================================================================
   ENGINE — port of GameContext.tsx
   ========================================================================= */
const SAVE_KEY = "shadowreach.save.local";

let S = defaultState("Héros");      // player state
let D = computeDerived(S);          // derived stats
let combat = null;                  // active Combat
let rewardAcc = { gold: 0, exp: 0 };
let dirty = false;
let offlineRecap = null;

/* -------- state mutation -------- */
function update(fn) {
  fn(S);
  S.power = computePower(S);
  D = computeDerived(S);
  dirty = true;
  scheduleRender();
}
function refreshDerived() { D = computeDerived(S); }

/* -------- persistence -------- */
function saveNow() {
  try {
    S.lastSeen = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    dirty = false;
  } catch (e) { console.warn("save failed", e); }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return migrate(JSON.parse(raw), "Héros");
  } catch (e) { return null; }
}

/* -------- daily reset & offline -------- */
function applyDailyReset(s) {
  const t = todayStr();
  if (s.lastKeyReset !== t) {
    RAID_IDS.forEach((r) => {
      // tree-granted keys raise both the daily refill and the cap for that raid
      const bonus = (s.raidKeyAlloc || {})[r] || 0;
      s.raids[r].keys = Math.min(RULES.RAID_KEY_CAP + bonus,
        s.raids[r].keys + RULES.RAID_FREE_KEYS + bonus);
    });
    s.adKeysToday = 0;
    s.lastKeyReset = t;
  }
  if (s.eventDay !== t) { s.eventDay = t; s.eventClaims = {}; s.eventProgress = {}; }
  return s;
}
function applyOffline(s) {
  const now = Date.now();
  let elapsed = (now - (s.lastSeen || now)) / 1000;
  // a device clock moved backwards must never produce anything, and the
  // Autonomie cap means a clock moved forwards can at most fill the reserve
  // once -- there is no backend here to verify elapsed time against
  if (!isFinite(elapsed) || elapsed < 0) elapsed = 0;
  harvestAdvance(s, elapsed);
  s.lastSeen = now;
  return s;
}
function grantLevels(s) {
  while (s.level < RULES.MAX_LEVEL && s.exp >= expToNext(s.level)) {
    s.exp -= expToNext(s.level);
    s.level += 1;
    s.statPoints += RULES.STAT_POINTS_PER_LEVEL;
  }
  if (s.level >= RULES.MAX_LEVEL) { s.exp = 0; s.ascensionAvailable = true; }
  return s;
}

/* -------- enemy / wave construction -------- */
function makeEnemy(mode, opts) {
  const t = opts.type;
  const tierKey = opts.tier || (mode === "campaign" ? enemyTierFor(opts.floor) : "RARE");
  const tier = ENEMY_TIERS[tierKey] || ENEMY_TIERS.COMMUN;
  let hp, dmg;
  if (mode === "campaign") {
    const mulH = opts.boss ? 6 : opts.elite ? 2.3 : 1;
    const mulD = opts.boss ? 1.8 : opts.elite ? 1.4 : 1;
    hp = Math.floor(enemyHP(opts.floor) * t.hpMul * mulH * tier.mul);
    dmg = Math.floor(enemyDamage(opts.floor) * t.dmgMul * mulD * tier.mul);
    // difficulty adapts to the player's gear (bounded)
    // "Retour Rapide": ground already cleared once is softer, so climbing back
    // after a Rebirth is quick. This is the only thing that reads `fastback`.
    if (opts.floor < S.recordFloor) hp = Math.floor(hp * (1 - Math.min(60, rb(S, "fastback")) / 100));
    let gear = 0;
    Object.values(S.equipped).forEach((it) => { if (it) gear += it.power; });
    const expected = 55 * opts.floor + 120;
    const gf = Math.max(0.85, Math.min(1.45, 1 + (gear / expected - 1) * 0.32));
    hp = Math.floor(hp * gf); dmg = Math.floor(dmg * gf);
  } else {
    hp = Math.floor(raidEnemyHP(opts.raidId, opts.raidLevel) * t.hpMul);
    dmg = Math.floor(raidEnemyDamage(opts.raidId, opts.raidLevel) * t.dmgMul);
  }
  return {
    id: rid(), type: t, x: opts.x, hp, maxHP: hp, dmg,
    tier: tierKey, name: opts.name || t.name,
    ranged: t.ranged, boss: !!opts.boss, elite: !!opts.elite, alive: true,
    atkCd: 0.6 + Math.random() * 1.0, hitFlash: 0, attacking: 0,
    speedVar: 0.8 + Math.random() * 0.4, phase: Math.random() * Math.PI * 2,
  };
}

function spawnCampaign(s) {
  const floor = s.floor, step = s.step;
  const elite = isElite(floor) && step === 3;
  const boss = isBoss(floor) && step === 3;
  const count = (boss || elite) ? 1 : enemyCount(floor, step);
  const dv = computeDerived(s);
  const enemies = [];
  const bossDef = boss ? bossFor(floor) : null;
  const eliteDef = elite ? eliteFor(floor) : null;
  for (let i = 0; i < count; i++) {
    let type, name, tier;
    if (boss) {
      type = Object.assign({}, ENEMY_TYPES[1], { id: bossDef.id, name: bossDef.name, img: bossDef.img, ranged: false });
      name = bossDef.name; tier = bossDef.tier;
    } else if (elite) {
      const base = typeById(eliteDef.base);
      // elites keep the base type's behaviour (ranged / melee) but use their own art
      type = Object.assign({}, base, { id: eliteDef.id, name: eliteDef.name,
        img: eliteDef.img || base.img });
      name = eliteDef.name; tier = eliteDef.tier;
    } else {
      type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
      name = type.name; tier = enemyTierFor(floor);
    }
    enemies.push(makeEnemy("campaign", { type, name, tier, floor, elite, boss, x: AW - 46 - i * 44 }));
  }
  const bg = ENV_KEYS[Math.floor((floor - 1) / 10) % ENV_KEYS.length];
  return {
    ctx: "campaign", floor, step, elite, boss, enemies, pending: 0, startAt: Date.now(),
    heroX: HERO_START, heroHP: dv.maxHP, heroMaxHP: dv.maxHP, heroAtkCd: 0.6,
    heroAttacking: 0, heroHit: 0, skillCds: {}, skillCdMax: {}, buffs: {}, debuffs: {}, skillFxs: [], floats: [], projs: [],
    bg, status: "fight",
  };
}

function spawnRaidWave(raidId, level) {
  if (raidId === "or") {
    const t = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
    return { enemies: [makeEnemy("raid", { type: t, raidId, raidLevel: level, x: AW - 60 })], pending: 4 };
  }
  if (raidId === "minerai") {
    const rb2 = RAID_BOSSES[raidId];
    const t = Object.assign({}, ENEMY_TYPES[1], { id: "boss", name: rb2.name,
      img: rb2.img || "boss_golem", ranged: false });
    return { enemies: [makeEnemy("raid", { type: t, name: rb2.name, tier: rb2.tier,
      raidId, raidLevel: level, x: AW - 60, boss: true })], pending: 0 };
  }
  const n = raidEnemyCount(raidId, level);
  const rb3 = RAID_BOSSES[raidId];
  const enemies = [];
  for (let i = 0; i < n; i++) {
    // the lead enemy of the wave is the raid's named boss; the rest are escorts
    if (i === 0 && rb3) {
      const bt = Object.assign({}, ENEMY_TYPES[1],
        { id: "raidboss", name: rb3.name, img: rb3.img, ranged: false });
      enemies.push(makeEnemy("raid", { type: bt, name: rb3.name, tier: rb3.tier,
        raidId, raidLevel: level, x: AW - 50, boss: true }));
      continue;
    }
    const t = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
    enemies.push(makeEnemy("raid", { type: t, raidId, raidLevel: level, x: AW - 50 - i * 44 }));
  }
  return { enemies, pending: 0 };
}

function startCampaign() { combat = spawnCampaign(S); }

function startRaid(raidId, useUniversal, onEnd) {
  const raid = S.raids[raidId];
  if (!useUniversal && raid.keys <= 0) return false;
  if (useUniversal && S.universalKeys <= 0) return false;
  const level = raid.level;
  const dv = D;
  const wave = spawnRaidWave(raidId, level);
  const reward = raidReward(raidId, level);
  combat = {
    ctx: "raid", raidId, raidLevel: level, floor: level, step: 1, startAt: Date.now(),
    elite: false, boss: raidId === "minerai",
    enemies: wave.enemies, pending: wave.pending,
    heroX: HERO_START, heroHP: dv.maxHP, heroMaxHP: dv.maxHP, heroAtkCd: 0.6,
    heroAttacking: 0, heroHit: 0, skillCds: {}, skillCdMax: {}, buffs: {}, debuffs: {}, skillFxs: [], floats: [], projs: [],
    bg: raidId === "minerai" ? "env_ice" : raidId === "or" ? "env_dragon"
      : raidId === "competence" ? "env_celestial" : "env_forest", status: "fight",
    onEnd: (won) => {
      if (won) {
        update((st) => {
          if (useUniversal) st.universalKeys -= 1; else st.raids[raidId].keys -= 1;
          st.raids[raidId].level = Math.min(RULES.RAID_MAX_LEVEL, level + 1);
          st.raids[raidId].record = Math.max(st.raids[raidId].record, level);
          // tree bonuses land here, where the resource is actually granted
          if (raidId === "or") st.gold += Math.floor(reward * (1 + dv.goldBonus / 100));
          else if (raidId === "minerai") st.minerai += Math.floor(reward *
            (1 + (treeSum(st, "minerai") + treeSum(st, "raidMinerai")) / 100));
          else if (raidId === "competence") st.eclat += Math.floor(reward * (1 + treeSum(st, "skillPts") / 100));
          else if (raidId === "evolution") st.pe += reward;
          else st.essence += Math.floor(reward * (1 + treeSum(st, "essence") / 100));
        });
      } else {
        // a lost raid still consumes the key
        update((st) => { if (useUniversal) st.universalKeys -= 1; else st.raids[raidId].keys -= 1; });
      }
      onEnd(won, reward);
    },
  };
  return true;
}

function startAscensionTrial(onEnd) {
  const dv = D;
  const t = Object.assign({}, ENEMY_TYPES[1], { id: "boss", name: "Gardien de l'Ascension",
    img: "boss_golem", ranged: false });
  const e = makeEnemy("campaign", { type: t, floor: S.floor + 20, boss: true, x: AW - 60 });
  e.hp = e.maxHP = Math.floor(e.maxHP * 1.5);
  combat = {
    ctx: "raid", raidId: null, trial: true, floor: S.level, step: 1, elite: false, boss: true, startAt: Date.now(),
    enemies: [e], pending: 0, heroX: HERO_START, heroHP: dv.maxHP, heroMaxHP: dv.maxHP,
    heroAtkCd: 0.6, heroAttacking: 0, heroHit: 0, skillCds: {}, skillCdMax: {}, buffs: {}, debuffs: {}, skillFxs: [],
    floats: [], projs: [], bg: "env_celestial", status: "fight",
    onEnd: (won) => onEnd(won),
  };
}

/* -------- damage -------- */
/* ---- timed buffs (hero) and debuffs (enemies), per the reference sheet ----
   Both live on the combat object, so they clear when the fight ends. */
function fxAdd(c, bag, eff, now) {
  c[bag] = c[bag] || {};
  c[bag][eff.key] = { value: eff.value, label: eff.label, until: now + eff.dur * 1000, dur: eff.dur };
}
function fxVal(c, bag, key) {
  const b = c && c[bag] && c[bag][key];
  return b && Date.now() < b.until ? b.value : 0;
}
function fxList(c, bag) {
  const out = [], now = Date.now();
  const src = (c && c[bag]) || {};
  Object.keys(src).forEach((k) => {
    const b = src[k];
    if (now < b.until) out.push({ key: k, label: b.label, left: (b.until - now) / 1000, dur: b.dur });
  });
  return out;
}
function applyDamageToEnemy(c, e, dmg, crit, color) {
  e.hp -= dmg;
  e.hitFlash = 0.15;
  c.floats.push({ id: rid(), x: e.x, val: dmg, crit, color, born: Date.now() });
  if (crit) addBurst(c, "crit", e.x, color);
  if (e.hp <= 0 && e.alive) {
    e.alive = false;
    addBurst(c, "death", e.x, (e.tier && ENEMY_TIERS[e.tier] && ENEMY_TIERS[e.tier].c) || "#CFE0FF");
    if (c.ctx === "campaign") {
      rewardAcc.gold += goldReward(c.floor);
      rewardAcc.exp += expReward(c.floor);
    }
  }
}

/* -------- main simulation tick (33ms, as in the app) -------- */
let lastTick = Date.now();
function tick() {
  const now = Date.now();
  const dt = Math.min(0.1, (now - lastTick) / 1000);
  lastTick = now;
  const c = combat;
  if (!c) return;
  // ---- settle phase: the fight is decided, hold on the banner a beat so the
  // kill and the victory actually get drawn before the reward screen ----
  if (c.status !== "fight") {
    if (!c._ended && now >= (c.endAt || 0)) { c._ended = true; handleCombatEnd(c); }
    return;
  }
  // ---- entry phase: enemy lands, nobody swings yet ----
  if (now - (c.startAt || 0) < RULES.FIGHT_ENTRY_MS) return;
  const dv = D;
  const wt = WEAPON_TYPES[dv.weapon] || WEAPON_TYPES.epee;

  const regenPct = dv.regen + fxVal(c, "buffs", "regen");
  if (regenPct > 0 && c.heroHP < c.heroMaxHP) {
    c.heroHP = Math.min(c.heroMaxHP, c.heroHP + regenPct / 100 * c.heroMaxHP * dt);
  }
  // Poison ticks on the whole wave for as long as the debuff lasts
  // Feu familiars burn the wave once a second
  if (dv.petElem === "feu") {
    c._burnAcc = (c._burnAcc || 0) + dt;
    if (c._burnAcc >= 1) {
      c._burnAcc = 0;
      c.enemies.filter((e) => e.alive).forEach((e) =>
        applyDamageToEnemy(c, e, Math.max(1, Math.floor(dv.damage * 0.06)), false, "#FF7A3D"));
    }
  }
  const poisonPct = fxVal(c, "debuffs", "poison");
  if (poisonPct > 0) {
    c._poisonAcc = (c._poisonAcc || 0) + dt;
    if (c._poisonAcc >= 1) {
      c._poisonAcc = 0;
      c.enemies.filter((e) => e.alive).forEach((e) =>
        applyDamageToEnemy(c, e, Math.max(1, Math.floor(e.maxHP * poisonPct / 100 / 8)), false, "#7ED321"));
    }
  }
  c.heroAttacking = Math.max(0, c.heroAttacking - dt);
  c.heroHit = Math.max(0, c.heroHit - dt);

  const alive = c.enemies.filter((e) => e.alive);
  const target = alive.sort((a, b) => a.x - b.x)[0];

  // ---- HERO ----
  if (target) {
    const dist = target.x - c.heroX;
    const inRange = dist <= wt.range + 2;
    if (wt.attackType === "MELEE" && !inRange) {
      const wob = 0.88 + 0.2 * Math.sin(now / 230);
      c.heroX = Math.min(target.x - wt.range, c.heroX + dv.moveSpeed * dt * wob);
    } else {
      c.heroAtkCd -= dt;
      if (c.heroAtkCd <= 0) {
        c.heroAtkCd = (1 / (dv.attackSpeed * wt.speed * (1 + fxVal(c, "buffs", "hate") / 100)))
          * (0.88 + Math.random() * 0.24);
        c.heroAttacking = 0.2;
        // weapon-type affixes only apply to the matching attack type
        const styleMul = wt.attackType === "MELEE"
          ? 1 + (dv.meleeDmg || 0) / 100
          : 1 + (dv.rangedDmg || 0) / 100;
        // "Double attaque": the swing may immediately land a second time
        const swings = Math.random() * 100 < (dv.doubleAtk || 0) ? 2 : 1;
        const buffDmg = 1 + fxVal(c, "buffs", "force") / 100;
        const vuln = (1 + fxVal(c, "debuffs", "vuln") / 100)
          * (dv.petElem === "toxique" ? 1.10 : 1);
        for (let sw = 0; sw < swings; sw++) {
          let dmg = dv.damage * styleMul * buffDmg * vuln;
          const crit = Math.random() * 100 < dv.critChance;
          if (crit) dmg *= dv.critMult;
          if (c.boss) dmg *= (1 + dv.bossDmg / 100);
          dmg = Math.floor(dmg * (0.9 + Math.random() * 0.2));
          applyDamageToEnemy(c, target, dmg, crit, sw ? "#FFC29B" : "#FFE9A8");
          if (dv.lifesteal > 0) c.heroHP = Math.min(c.heroMaxHP, c.heroHP + dmg * dv.lifesteal / 100);
        }
        if (wt.attackType === "RANGED") {
          c.projs.push({ id: rid(), x: c.heroX + 20, toX: target.x,
            color: wt.projectile === "magic" ? "#9B5CF6" : "#E8B44A",
            kind: wt.projectile || "arrow", life: 0.35 });
        }
      }
    }
    // ---- SKILLS ----
    S.skillSlots.slice(0, skillSlotCount(S)).forEach((sid) => {
      if (!sid || !S.skills[sid]) return;
      const def = SKILL_DEFS.find((x) => x.id === sid);
      if (!def) return;
      c.skillCds[sid] = (c.skillCds[sid] || 0) - dt;
      if (c.skillCds[sid] <= 0) {
        c.skillCds[sid] = def.cd * (1 - (dv.skillCdCut || 0) / 100);
        c.skillCdMax[sid] = c.skillCds[sid];
        const fxKind = def.fx || "impact";
        // keep a few concurrent effects so a multi-skill burst reads properly,
        // but cap the list so a fast build cannot flood the arena
        c.skillFxs.push({ id: def.id, color: def.color, fx: fxKind,
          life: vfxDur(fxKind), max: vfxDur(fxKind) });
        if (c.skillFxs.length > 4) c.skillFxs.shift();
        if (def.mult > 0) {
          const sdmg = Math.floor(skillDamageMult(dv.damage * def.mult, S.skills[sid].level)
            * (1 + (dv.skillDmgBonus || 0) / 100));
          if (def.type === "AOE" || def.type === "CHAINE" || def.type === "DEBUFF") {
            c.enemies.filter((e) => e.alive).forEach((e) => applyDamageToEnemy(c, e, sdmg, true, def.color));
          } else {
            applyDamageToEnemy(c, target, sdmg, true, def.color);
          }
        }
        if (def.heal) {
          const amt = Math.floor(c.heroMaxHP * def.heal / 100);
          c.heroHP = Math.min(c.heroMaxHP, c.heroHP + amt);
          c.floats.push({ id: rid(), x: c.heroX, val: amt, crit: false, color: "#84E891", born: now, heal: true });
        }
        if (def.eff) {
          // buffs land on the hero, debuffs on the wave
          fxAdd(c, def.cat === "DEBUFF" ? "debuffs" : "buffs", def.eff, now);
        }
      }
    });
  }
  c.heroX = Math.max(24, Math.min(AW - 40, c.heroX));

  // ---- ENEMIES ----
  c.enemies.forEach((e) => {
    if (!e.alive) return;
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.attacking = Math.max(0, e.attacking - dt);
    const dist = e.x - c.heroX;
    const fireRange = e.ranged ? 150 : 40;
    if (dist > fireRange) {
      const wob = 0.86 + 0.24 * Math.sin(now / 250 + e.phase);
      e.x = Math.max(c.heroX + fireRange, e.x - ENEMY_SPEED * e.speedVar * dt * wob);
    } else {
      e.atkCd -= dt;
      if (e.atkCd <= 0) {
        e.atkCd = (1.15 + Math.random() * 0.5) * (1 + fxVal(c, "debuffs", "slow") / 100)
          * (dv.petElem === "glace" ? 1.12 : 1);
        e.attacking = 0.2;
        // Hâte also grants a window to dodge outright
        const dodgePct = fxVal(c, "buffs", "hate") * 0.5;
        if (Math.random() * 100 < dodgePct) {
          c.floats.push({ id: rid(), x: c.heroX, val: 0, crit: false,
            color: "#8FC4FF", born: now, dodged: true });
          return;
        }
        // "Chance de blocage": the attack is negated outright
        if (Math.random() * 100 < (dv.blockChance || 0)) {
          c.heroHit = 0.1;
          c.floats.push({ id: rid(), x: c.heroX, val: 0, crit: false,
            color: "#8FEFF4", born: now, blocked: true });
        } else {
        let dmg = e.dmg;
        const crit = Math.random() * 100 < 8;
        if (crit) dmg *= 1.6 * (1 - dv.critRed / 100);
        const totalRed = Math.min(85, dv.dmgRed + fxVal(c, "buffs", "rempart"));
        dmg = Math.floor(dmg * (1 - totalRed / 100) * (0.9 + Math.random() * 0.2));
        c.heroHP -= dmg;
        c.heroHit = 0.15;
        c.floats.push({ id: rid(), x: c.heroX, val: dmg, crit, color: "#FF6B6B", born: now });
        if (e.ranged) {
          c.projs.push({ id: rid(), x: e.x - 10, toX: c.heroX,
            color: e.type.img === "enemy_mage" ? "#B15CF6" : "#CFCFCF",
            kind: e.type.img === "enemy_mage" ? "magic" : "arrow", life: 0.35 });
        }
        if (c.heroHP <= 0) { c.heroHP = 0; c.status = "lost"; }
        }
      }
    }
    e.x = Math.max(c.heroX + 30, Math.min(AW - 24, e.x));
  });

  // ---- projectiles / floats / fx ----
  c.projs = c.projs.map((p) => {
    p.x += (p.toX - p.x) * 0.5; p.life -= dt; return p;
  }).filter((p) => p.life > 0);
  c.floats = c.floats.filter((f) => now - f.born < 900);
  if (c.skillFxs.length) {
    c.skillFxs.forEach((f) => { f.life -= dt; });
    c.skillFxs = c.skillFxs.filter((f) => f.life > 0);
  }

  // ---- win check ----
  if (c.status === "fight" && !c.enemies.some((e) => e.alive)) {
    if (c.pending > 0) {
      c.pending -= 1;
      const rbw = c.pending === 0 ? RAID_BOSSES[c.raidId] : null;   // final wave = the boss
      const t = rbw
        ? Object.assign({}, ENEMY_TYPES[1], { id: "raidboss", name: rbw.name, img: rbw.img, ranged: false })
        : ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
      c.enemies = [makeEnemy("raid", { type: t, name: rbw ? rbw.name : undefined,
        tier: rbw ? rbw.tier : undefined, boss: !!rbw,
        raidId: c.raidId, raidLevel: c.raidLevel, x: AW - 60 })];
      c.startAt = now;   // short entry beat between waves too
    } else {
      c.status = "won";
    }
  }

  // decided this tick? start the hold rather than ending immediately.
  // The step that completes a floor holds longer so the climb stays legible.
  if (c.status === "won" || c.status === "lost") {
    const clearsFloor = c.status === "won" && c.ctx === "campaign" &&
      c.step >= RULES.STEPS_PER_FLOOR;
    c.endAt = now + RULES.FIGHT_HOLD_MS + (clearsFloor ? RULES.FLOOR_CLEAR_MS : 0);
  }
}

let bossReward = null;   // surfaced by the UI right after a first Boss clear
function handleCombatEnd(c) {
  if (c.ctx === "raid") {
    const won = c.status === "won";
    const cb = c.onEnd;
    combat = null;
    if (cb) cb(won);
    return;
  }
  const won = c.status === "won";
  update((s) => {
    const dv = computeDerived(s);
    s.gold += Math.floor(rewardAcc.gold * (1 + dv.goldBonus / 100));
    s.exp += Math.floor(rewardAcc.exp * (1 + dv.expBonus / 100));
    rewardAcc.gold = 0; rewardAcc.exp = 0;
    grantLevels(s);
    if (won) {
      if (c.boss) {
        const bk = String(c.floor);
        s.bossClears[bk] = true;
        // the accelerator is tied to the FIRST clear and never repeats
        if (!s.bossRewardsClaimed[bk]) {
          s.bossRewardsClaimed[bk] = true;
          const rw = bossFirstClearReward(c.floor);
          if (rw) {
            s.accels[rw.key] = (s.accels[rw.key] || 0) + rw.qty;
            bossReward = { floor: c.floor, key: rw.key, qty: rw.qty };
          }
        }
        s.eventProgress.hard = (s.eventProgress.hard || 0) + 1;
      }
      s.eventProgress.floors = (s.eventProgress.floors || 0) + 1;
      if (s.step < RULES.STEPS_PER_FLOOR) s.step += 1;
      else {
        s.step = 1; s.floor += 1;
        floorFlash = { floor: s.floor, until: Date.now() + RULES.FLOOR_FLASH_MS };
      }
      s.recordFloor = Math.max(s.recordFloor, s.floor);
      if (isCheckpoint(s.floor)) s.checkpoint = Math.max(s.checkpoint, s.floor);
    } else {
      const cp = Math.max(s.checkpoint, 1);
      s.floor = Math.max(cp, s.floor - 1);
      s.step = 1;
    }
  });
  setTimeout(startCampaign, 40);
}

/* -------- periodic reward flush (live gold, as in the app) -------- */
function flushRewards() {
  const c = combat;
  if (!c || c.ctx !== "campaign") return;
  if (rewardAcc.gold <= 0 && rewardAcc.exp <= 0) return;
  update((st) => {
    const dv = computeDerived(st);
    st.gold += Math.floor(rewardAcc.gold * (1 + dv.goldBonus / 100));
    st.exp += Math.floor(rewardAcc.exp * (1 + dv.expBonus / 100));
    rewardAcc.gold = 0; rewardAcc.exp = 0;
    grantLevels(st);
  });
}

   ACTIONS

function allocStat(key, pts) {
  update((s) => {
    const n = Math.min(pts, s.statPoints);
    if (n <= 0) return;
    s.stats[key] += n; s.statPoints -= n;

function forgeSummon(n) {
  const results = [];
  update((st) => {
    for (let i = 0; i < n; i++) {
      const cost = forgeCost(st.forge.level);
      if (st.minerai < cost) break;
      st.minerai -= cost;
      const rates = getRates("forge", st.forge.level, st.ascension, starsOf(st, "forge"));
      // one paid forge; the tree's "Forge gratuite" nodes may add a second
      // result at no extra cost
      const extra = Math.random() * 100 < treeSum(st, "forgeFree") ? 1 : 0;
      for (let k = 0; k <= extra; k++) {
        const rar = rollRarity(rates, EQUIP_RARITY_ORDER);
        const item = makeItem(SLOTS[Math.floor(Math.random() * SLOTS.length)], rar, st.forge.level);
        st.inventory.push(item);
        results.push({ rarity: rar, slot: item.slot, free: k > 0 });
      }
      st.forge.summonCount += 1;
      // the gauge counts paid forges, not the free bonus results
      st.forge.progress = Math.min(forgeProgressNeed(st.forge.level),
        (st.forge.progress || 0) + 1);
    }
    st.eventProgress.forge = (st.eventProgress.forge || 0) + results.length;
  });
  return results;
}

/* tree-adjusted forge upgrade cost & duration. The cost branch is 5 levels of
   -5%, so -25% is the real ceiling; the old 70 cap was never reachable. */
const FORGE_COST_CUT_CAP = 25;
function forgeUpgCostFor(s) {
  const cut = Math.min(FORGE_COST_CUT_CAP, treeSum(s, "forgeCost"));
  return Math.max(1, Math.floor(forgeUpgradeCost(s.forge.level) * (1 - cut / 100)));
}
function forgeUpgTimeFor(s) {
  const cut = Math.min(80, treeSum(s, "forgeTime"));
  return Math.max(0, Math.round(forgeUpgradeTime(s.forge.level) * (1 - cut / 100)));
}
function forgeGaugeFull(s) {
  return (s.forge.progress || 0) >= forgeProgressNeed(s.forge.level);
}
function upgradeForge() {
  if (S.forge.level >= RULES.FORGE_MAX) return { ok: false, reason: "max" };
  if (S.forge.upgradeEnd > Date.now()) return { ok: false, reason: "busy" };
  if (!forgeGaugeFull(S)) return { ok: false, reason: "gauge" };
  const cost = forgeUpgCostFor(S);
  if (S.gold < cost) return { ok: false, reason: "gold" };
  const time = forgeUpgTimeFor(S);
  update((st) => {
    st.gold -= cost;
    st.forge.progress = 0;          // the gauge is spent on the upgrade
    if (time <= 0) st.forge.level += 1;
    else st.forge.upgradeEnd = Date.now() + time * 1000;
  });
  return { ok: true, instant: time <= 0 };
}
function collectForgeUpgrade() {
  update((s) => {
    if (!s.forge.upgradeEnd || Date.now() < s.forge.upgradeEnd) return;
    s.forge.level += 1; s.forge.upgradeEnd = 0;
  });
}
function toggleAutoForge() { update((s) => { s.forge.autoForge = !s.forge.autoForge; }); }

function equipItem(id) {
  update((s) => {
    const it = s.inventory.find((x) => x.id === id);
    if (!it) return;
    s.inventory = s.inventory.filter((x) => x.id !== id);
    const prev = s.equipped[it.slot];
    s.equipped[it.slot] = it;
    if (prev) s.inventory.push(prev);
  });
}
function unequipItem(slot) {
  update((s) => {
    const it = s.equipped[slot];
    if (!it) return;
    s.equipped[slot] = null;
    s.inventory.push(it);
  });
}
function recycleItem(id) {
  const it = S.inventory.find((x) => x.id === id);
  if (!it) return 0;
  const dust = Math.floor(((equipRank(it.rarity) + 1) * 5 + it.power * 0.2)
    * (1 + treeSum(S, "dust") / 100));
  update((st) => {
    st.inventory = st.inventory.filter((x) => x.id !== id);
    st.poussiere += dust;
  });
  return dust;
}
function itemUpgradeCost(it) { return 20 + it.level * 15; }
function upgradeItem(id) {
  let ok = false;
  update((s) => {
    let it = Object.values(s.equipped).find((x) => x && x.id === id) || s.inventory.find((x) => x.id === id);
    if (!it) return;

    if (s.poussiere < cost) return;
    s.poussiere -= cost;
    it.level += 1;
    // main stats only — it.affixes is deliberately left untouched
    it.damage = Math.floor(it.damage * 1.1);
    it.hp = Math.floor(it.hp * 1.1);
    it.power = it.damage + it.hp;
    ok = true;
  });
  return ok;
}

function summonSkill(n) {
  const results = [];
  update((s) => {
    // "Double invocation": one paid summon, a chance at a second free result.
    // Mastery still advances once per PAID summon — the tree never speeds the gauge.
    const dblChance = treeSum(s, "skillFree");
    for (let i = 0; i < n; i++) {
      if (s.eclat < SKILL_SUMMON_COST) break;
      s.eclat -= SKILL_SUMMON_COST;
      const rolls = Math.random() * 100 < dblChance ? 2 : 1;
      for (let r = 0; r < rolls; r++) {
        const rates = getRates("skill", s.skillMastery.level, s.ascension, starsOf(s, "skill"));
        const rar = rollRarity(rates);
        const def = SKILL_DEFS[Math.floor(Math.random() * SKILL_DEFS.length)];
        const existing = s.skills[def.id];
        if (existing) {
          const need = skillDupesNeeded(existing.level);
          existing.count += 1;
          if (existing.count >= need && existing.level < RULES.SKILL_MAX_LEVEL) {
            existing.count -= need; existing.level += 1;
          }
          results.push({ id: def.id, rarity: rar, dup: true });
        } else {
          s.skills[def.id] = { level: 1, count: 0 };
          const empty = s.skillSlots.slice(0, skillSlotCount(s)).indexOf(null);
          if (empty >= 0) s.skillSlots[empty] = def.id;
          results.push({ id: def.id, rarity: rar, dup: false });
        }
      }
      s.skillMastery.count += 1; s.skillMastery.progress += 1;
      const mreq = masteryReq(s.skillMastery.level);
      if (s.skillMastery.progress >= mreq && s.skillMastery.level < RULES.MASTERY_MAX) {
        s.skillMastery.progress -= mreq; s.skillMastery.level += 1;
      }
    }
  });
  return results;
}
function equipSkill(slotIdx, skillId) {
  update((s) => {
    if (skillId) s.skillSlots = s.skillSlots.map((x) => (x === skillId ? null : x));
    s.skillSlots[slotIdx] = skillId;
  });
}

function summonEgg(n) {
  const results = [];
  update((s) => {
    // "Double Œuf": one paid summon may yield 2 EGGS (not a double hatch) —
    // each egg keeps its own independent timer.
    const dblChance = treeSum(s, "eggFree");
    // each rarity carries its own reduction; a Rare upgrade must never touch
    // an Épique egg
    for (let i = 0; i < n; i++) {
      if (s.essence < 10) break;
      if (s.eggs.length >= s.eggSlots) break;
      s.essence -= 10;
      const eggsToMake = Math.random() * 100 < dblChance ? 2 : 1;
      for (let e = 0; e < eggsToMake; e++) {
        if (s.eggs.length >= s.eggSlots) break;
        const rates = getRates("pet", s.petMastery.level, s.ascension, starsOf(s, "pet"));
        const rar = rollRarity(rates);
        const secs = EGG_TIMERS[rar] * (1 - hatchCutFor(s, rar) / 100);
        s.eggs.push({ id: rid(), rarity: rar, species: randSpecies(), element: randElement(),
          hatchEnd: Date.now() + secs * 1000 });
        results.push({ rarity: rar, free: e > 0 });
      }
      s.petMastery.count += 1; s.petMastery.progress += 1;
      const mreq = masteryReq(s.petMastery.level);
      if (s.petMastery.progress >= mreq && s.petMastery.level < RULES.MASTERY_MAX) {
        s.petMastery.progress -= mreq; s.petMastery.level += 1;
      }
    }
  });
  return results;
}
function collectEgg(id) {
  update((s) => {
    const egg = s.eggs.find((e) => e.id === id);
    if (!egg || Date.now() < egg.hatchEnd) return;
    s.eggs = s.eggs.filter((e) => e.id !== id);
    const pet = { id: rid(), rarity: egg.rarity, level: 0,
      species: egg.species || randSpecies(), element: egg.element || randElement(),
      name: ("Familier " + (RARITY_MUL[egg.rarity] > 3 ? "Élite" : "")).trim() };
    s.pets.push(pet);
    if (!s.activePetId) s.activePetId = pet.id;
    s.eventProgress.hatch = (s.eventProgress.hatch || 0) + 1;
  });
}
/* fusion: 6 COMMUN -> 1 RARE, 6 -> 1 EPIQUE, 6 -> 1 MYTHIQUE,
   4 MYTHIQUE -> 1 LEGENDAIRE, 3 LEGENDAIRE -> 1 DIVIN. Instant, no timer.
   Consumes the LEAST upgraded duplicates so the player keeps their investment. */
function fusePets(rarity) {
  const idx = RARITY_ORDER.indexOf(rarity);
  const need = petFuseNeed(rarity);
  if (!need || idx < 0 || idx >= RARITY_ORDER.length - 1) return false;
  if (S.pets.filter((p) => p.rarity === rarity).length < need) return false;
  update((st) => {
    const pool = st.pets.filter((p) => p.rarity === rarity)
      .sort((a, b) => (a.level || 0) - (b.level || 0));
    const eaten = pool.slice(0, need).map((p) => p.id);
    st.pets = st.pets.filter((p) => eaten.indexOf(p.id) < 0);
    const np = { id: rid(), rarity: RARITY_ORDER[idx + 1], level: 0,
      species: (pool[0] && pool[0].species) || randSpecies(), element: randElement(),
      name: "Familier Fusionné" };
    st.pets.push(np);
    if (eaten.indexOf(st.activePetId || "") >= 0) st.activePetId = np.id;
    st.eventProgress.hatch = (st.eventProgress.hatch || 0) + 1;
  });
  return true;
}
/* internal upgrade inside a rarity, paid in Essence */
function upgradePet(id) {
  const pet = S.pets.find((p) => p.id === id);
  if (!pet) return false;
  const lv = pet.level || 0;
  if (lv >= petMaxLevel(pet.rarity)) return false;
  const cost = petUpgradeCost(pet.rarity, lv);
  if (S.essence < cost) return false;
  update((st) => {
    const p = st.pets.find((x) => x.id === id);
    if (!p) return;
    st.essence -= cost;
    p.level = (p.level || 0) + 1;
  });
  return true;
}
function setActivePet(id) { update((s) => { s.activePetId = id; }); }
function buyEggSlot() {
  if (S.level < 10 || S.eggSlots >= RULES.EGG_SLOT_MAX || S.gems < 300) return false;
  update((st) => { st.gems -= 300; st.eggSlots += 1; });
  return true;
}

function watchAdForKey() {
  if (S.universalKeys >= RULES.UNIVERSAL_KEY_CAP || S.adKeysToday >= RULES.UNIVERSAL_KEY_DAILY) return false;
  update((st) => {
    st.universalKeys = Math.min(RULES.UNIVERSAL_KEY_CAP, st.universalKeys + 1);

/* apply the payload of one tree level — called on instant and on collect */
function applyTreeLevel(st, node) {
  st.tree.levels[node.id] = (st.tree.levels[node.id] || 0) + 1;
  if (node.effect === "eggSlot") st.eggSlots = Math.min(RULES.EGG_SLOT_MAX, st.eggSlots + 1);
  // raidKey grants an unassigned daily key; the player picks the raid later
}
function startResearch(id) {
  const node = TREE_BY_ID[id];
  if (!node || S.tree.active) return false;
  const lv = treeLv(S, id);
  if (lv >= node.max || !treeReqOk(S, node) || !treeAfford(S, node)) return false;
  const price = treeNextCost(S, node);
  update((st) => {
    st.pe -= price.amount;
    const t = treeTime(st, node, lv + 1);
    if (t <= 0) {
      applyTreeLevel(st, node);
    } else {
      st.tree.active = id;
      st.tree.activeLevel = lv + 1;
      st.tree.activeEnd = Date.now() + t * 1000;
    }
  });
  return true;
}
function collectResearch() {
  update((s) => {
    if (!s.tree.active || Date.now() < s.tree.activeEnd) return;
    const node = TREE_BY_ID[s.tree.active];
    s.tree.active = null; s.tree.activeLevel = 0; s.tree.activeEnd = 0;
    if (node) applyTreeLevel(s, node);
  });
}
/* assign / unassign one of the tree's bonus daily raid keys */
function assignRaidKey(raid, delta) {
  if (!RAID_IDS.includes(raid)) return false;
  const cur = (S.raidKeyAlloc || {})[raid] || 0;
  if (delta > 0 && raidKeyFree(S) <= 0) return false;
  if (delta < 0 && cur <= 0) return false;
  update((st) => { st.raidKeyAlloc[raid] = ((st.raidKeyAlloc[raid] || 0) + delta); });
  return true;
}
function useAccelerator(target, key) {
  if ((S.accels[key] || 0) <= 0) return false;
  if (target.type === "tree" && (!S.tree.active || S.tree.activeEnd <= Date.now())) return false;
  if (target.type === "egg" && !S.eggs.find((e) => e.id === target.id && e.hatchEnd > Date.now())) return false;
  if (target.type === "forge" && S.forge.upgradeEnd <= Date.now()) return false;
  update((st) => {
    const def = ACCEL_DEFS.find((a) => a.key === key);
    const secs = def.mins * 60 * (1 + treeSum(st, "accel") / 100);
    st.accels[key] -= 1;
    if (target.type === "tree") {
      st.tree.activeEnd = Math.max(Date.now(), st.tree.activeEnd - secs * 1000);
    } else if (target.type === "forge") {
      st.forge.upgradeEnd = Math.max(Date.now(), st.forge.upgradeEnd - secs * 1000);
    } else {
      const egg = st.eggs.find((e) => e.id === target.id);
      if (egg) egg.hatchEnd = Math.max(Date.now(), egg.hatchEnd - secs * 1000);
    }
  });
  return true;
}

/* floor you would land on after a rebirth */
function floorAfterRebirth(s) {
  const keepPct = rebirthKeepPct(s.rebirth.upgrades.keep || 0);
  return Math.max(1, Math.floor(s.floor * keepPct / 100));
}
/* Rebirth needs floor >= 25 AND must not drop you under 25 afterwards. */
function canRebirth() {
  if (S.recordFloor < RULES.REBIRTH_UNLOCK_FLOOR) return false;
  if (S.floor < RULES.REBIRTH_MIN_FLOOR_AFTER) return false;
  return floorAfterRebirth(S) >= RULES.REBIRTH_MIN_FLOOR_AFTER;
}
function doRebirth() {
  if (!canRebirth()) return 0;
  const prGainBonus = (S.rebirth.upgrades.prgain || 0) * 5;
  const pr = Math.floor(prFromFloor(S.floor) * (1 + prGainBonus / 100));
  const keepPct = rebirthKeepPct(S.rebirth.upgrades.keep || 0);
  update((st) => {
    st.rebirth.pr += pr;
    st.rebirth.count += 1;
    st.warScore += pr * RULES.WAR_POINTS_PER_PR;
    st.floor = Math.max(1, Math.floor(st.floor * keepPct / 100));
    st.step = 1;
    st.checkpoint = lastCheckpoint(st.floor);
  });
  setTimeout(startCampaign, 40);
  return pr;
}
function buyRebirth(key) {
  const def = REBIRTH_UPGRADES.find((u) => u.key === key);
  const lvl = S.rebirth.upgrades[key] || 0;
  if (lvl >= def.max) return false;
  const cost = rebirthUpgCost(def.costs, lvl);
  if (S.rebirth.pr < cost) return false;
  update((st) => { st.rebirth.pr -= cost; st.rebirth.upgrades[key] = lvl + 1; });
  return true;
}

function doAscension() {
  update((s) => {
    if (s.ascension >= 3) return;
    const gems = ASCENSION_GEMS[s.ascension];
    s.ascension += 1;
    s.gems += gems;
    s.accels.a30 = (s.accels.a30 || 0) + 2;

    s.level = 1; s.exp = 0; s.ascensionAvailable = false;
  });
}

function eventDone(id) {
  const p = S.eventProgress;
  if (id === "login") return true;
  if (id === "floors") return (p.floors || 0) >= 5;
  if (id === "forge") return (p.forge || 0) >= 3;
  if (id === "hatch") return (p.hatch || 0) >= 2;
  if (id === "hard") return (p.hard || 0) >= 1;
  if (id === "mission") return ["login", "floors", "forge", "hatch"].every((k) => S.eventClaims[k]);
  return false;
}
function claimEvent(id) {
  update((s) => {
    if (s.eventClaims[id]) return;
    const m = EVENT_MISSIONS.find((x) => x.id === id);
    const prog = s.eventProgress;
    if (id === "floors" && (prog.floors || 0) < 5) return;
    if (id === "forge" && (prog.forge || 0) < 3) return;
    if (id === "hatch" && (prog.hatch || 0) < 2) return;
    if (id === "hard" && (prog.hard || 0) < 1) return;
    if (id === "mission" && !["login", "floors", "forge", "hatch"].every((k) => s.eventClaims[k])) return;
    s.eventClaims[id] = true;
    const map = { a1x3: ["a1", 3], a1x5: ["a1", 5], a5x3: ["a5", 3], a5x2: ["a5", 2], a15x1: ["a15", 1], a30x1: ["a30", 1] };
    const pair = map[m.accel];
    s.accels[pair[0]] = (s.accels[pair[0]] || 0) + pair[1];
  });
}

function spendGems(amount, cb) {
  if (S.gems < amount) return false;
  update((st) => { st.gems -= amount; cb(st); });
  return true;
}

function resetGame() {
  S = defaultState("Héros");
  S.power = computePower(S);
  refreshDerived();
  offlineRecap = null;
  saveNow();
  startCampaign();
  scheduleRender();
}

// TEST-ONLY: simulate one full day of time-based progress.
function warpDay() {
  S.testDays = (S.testDays || 0) + 1;
  if (S.tree.active) S.tree.activeEnd = Date.now();
  S.eggs = S.eggs.map((e) => Object.assign({}, e, { hatchEnd: Date.now() }));
  if (S.forge.upgradeEnd) S.forge.upgradeEnd = Date.now();
  S.lastKeyReset = ""; S.eventDay = "";
  applyDailyReset(S);
  S.lastSeen = Date.now() - 24 * 3600 * 1000;
  applyOffline(S);
  delete S._offline;
  S.power = computePower(S);
  refreshDerived();
  dirty = true;
  scheduleRender();
}

/* -------- boot -------- */
function boot() {
  const loaded = loadSave();
  S = loaded || defaultState("Héros");
  applyDailyReset(S);
  applyOffline(S);
  if (S._offline) { offlineRecap = S._offline; delete S._offline; }
  S.power = computePower(S);
  refreshDerived();
  startCampaign();

  setInterval(tick, 33);
  setInterval(flushRewards, 500);
  setInterval(() => { if (dirty) saveNow(); }, 8000);
  // the Récolte automatique never stops just because the player is connected
  let harvestClock = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = (now - harvestClock) / 1000;
    harvestClock = now;
    if (dt > 0 && harvestAdvance(S, dt) > 0) dirty = true;
    if (isHarvestOpen()) refreshHarvestModal();
  }, 1000);
  setInterval(() => {   // auto-forge loop (1.5s, as in the app)
    if (S.forge.autoForge && S.minerai >= forgeCost(S.forge.level)) forgeSummon(1);
  }, 1500);
  setInterval(() => { if (isTimerScreen()) scheduleRender(); }, 1000); // live countdowns
  window.addEventListener("beforeunload", saveNow);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

  if (S.harvest && S.harvest.secs > 120) showHarvestModal();
}
/* =========================================================================
   ARENA RENDERER — port of src/ui/CombatArena.tsx
   Absolutely-positioned DOM sprites, driven by requestAnimationFrame with
   the same 0.22 lerp smoothing and layered-sine idle animation as the app.
   ========================================================================= */
const RANGED_IDS = ["arc", "arbalete", "baton"];
/* width-to-height of each sprite, so none of them stretch */
const WEAPON_ASPECT = { epee: 0.543, hache: 0.359, masse: 0.258, dague: 0.301, arc: 0.219, arbalete: 0.664, baton: 0.93 };
const WEAPON_SILVER = "#d6dae4";
const ARENA_H = 286, CHAR = 64;

const P = { hero: HERO_START, en: {} };   // smoothed positions
let arenaEl = null, arenaNodes = null, arenaT = 0;
let lastTrack = "", lastSub = "", lastDecor = "";         // header caches, so rAF skips DOM writes
let floorFlash = null;                    // brief "ÉTAGE N" beat between floors

/* ---- scenery ---------------------------------------------------------------
   Props are picked to suit the biome and laid out one per horizontal third so
   they never stack. The layout is seeded off the floor, so it is stable for as
   long as you are on that floor and only changes when the scene does. */
const DECOR_BY_ENV = {
  env_forest:    ["stump", "bush", "rock_moss", "boulder", "dead_tree"],
  env_ruins:     ["column", "wall", "rock_moss", "brazier", "boulder"],
  env_ice:       ["crystal", "boulder", "rock_moss", "dead_tree"],
  env_demon:     ["bones", "brazier", "dead_tree", "boulder"],
  env_dragon:    ["bones", "dead_tree", "boulder", "rock_moss"],
  env_celestial: ["crystal", "column", "wall", "boulder"],
};
function decorHTML(bgKey, seed) {
  const list = (DECOR_BY_ENV[bgKey] || DECOR_BY_ENV.env_forest).slice();
  let st = Math.abs(seed * 2654435761) % 233280 + 7;
  const rnd = () => (st = (st * 9301 + 49297) % 233280) / 233280;
  // draw without replacement: picking independently collides far too often
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = list[i]; list[i] = list[j]; list[j] = t;
  }
  let h = "";
  for (let i = 0; i < 3; i++) {
    const x = 10 + i * 33 + rnd() * 16;          // % across, one per third
    const ht = 13 + rnd() * 13;                  // % of arena height
    const flip = rnd() < 0.5 ? " scaleX(-1)" : "";
    h += '<img src="' + ASSETS["prop_" + list[i]] + '" style="position:absolute;left:' + x.toFixed(1) +
      "%;bottom:" + (18.5 + rnd() * 3).toFixed(1) + "%;height:" + ht.toFixed(1) +
      "%;transform:translateX(-50%)" + flip + '">';
  }
  return h;
}

function arenaHTML() {
  return '' +
    '<div id="arenaBg"></div>' +
    '<div id="arenaShade"></div>' +
    '<div id="aDecor"></div>' +
    '<div class="floorTag"><div class="floorTxt" id="aLabel"></div>' +
      '<div class="fTrack" id="aTrack"></div><div class="row gap6" id="aSub"></div></div>' +
    '<div id="aLayer"></div>' +
    '<div id="banner" class="hide"></div>';
}

function mountArena(el) {

    bg: el.querySelector("#arenaBg"),

  };
