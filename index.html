/* ---- weapon visual (port of WeaponVisual) ---- */
/* The weapon hangs off the hero's hand, and the hand moves with the pose. Each
   frame carries the hand position (as a fraction of the sprite box) and the
   angle the arm holds it at; the weapon's grip is planted on that point, so it
   stays attached instead of floating beside him.

   Anchors were read off the sprites directly -- see the decile grid used to
   place them. The idle entry doubles as the rest pose between swings. */
const HERO_HAND = [
  { x: 0.61, y: 0.62, rot: 24 },   // idle — hand at his side
  { x: 0.85, y: 0.58, rot: 12 },   // attack1 — arm out and down
  { x: 0.56, y: 0.34, rot: -55 },  // attack2 — wound up across the chest
  { x: 0.82, y: 0.62, rot: 28 },   // attack3 — coming down
  { x: 0.88, y: 0.43, rot: -6 },   // attack4 — fully extended
];
function heroHand(attacking) {
  if (!(attacking > 0)) return HERO_HAND[0];
  const p = Math.min(0.999, Math.max(0, 1 - attacking / ATTACK_WINDOW));
  // Exactly the frame the sprite is showing. Interpolating between anchors was
  // worse: the weapon drifted off the hand mid-frame and snapped back, because
  // the sprite itself steps between poses rather than tweening. Stepping with
  // it keeps the grip planted for every rendered frame.
  const f = attackFrames("hero");
  const n = f.length || HERO_HAND.length - 1;
  return HERO_HAND[1 + Math.min(n - 1, Math.floor(p * n))] || HERO_HAND[0];
}
function weaponHTML(weapon, color, attacking, t, size) {
  const art = ASSETS["weapon_" + weapon];
  const sway = Math.sin(t * 0.0034) * 5;
  if (!art) return staffHTML(color, attacking ? 55 : sway, size);

  const hand = heroHand(attacking);
  const ranged = RANGED_IDS.includes(weapon);
  const h = size * (ranged ? 0.70 : 0.64);
  const w = h * (WEAPON_ASPECT[weapon] || 0.4);
  const rot = hand.rot * (ranged ? 0.45 : 1) + (attacking ? 0 : sway);
  // the grip is the sprite's bottom centre, so plant that on the hand
  return '<div style="position:absolute;left:' + (hand.x * size - w / 2).toFixed(1) +
    "px;top:" + (hand.y * size - h).toFixed(1) + "px;width:" + w.toFixed(1) +
    "px;height:" + h.toFixed(1) + "px;transform-origin:50% 100%;transform:rotate(" + rot.toFixed(1) +
    'deg)"><img src="' + art + '" style="width:100%;height:100%;object-fit:contain;display:block;' +
    "filter:drop-shadow(0 0 5px " + color + '99)"></div>';
}
/* the one weapon still drawn by hand */
function staffHTML(color, swing, size) {
  const ax = size * 0.60, ay = size * 0.30;
  return '<div style="position:absolute;left:' + ax + "px;top:" + (ay - size * 0.12) +
    "px;transform:rotate(" + (swing * 0.25) + 'deg)">' +
    '<div style="width:4px;height:' + (size * 0.6) + 'px;background:#6b4b2a;border-radius:2px"></div>' +
    '<div style="position:absolute;top:-7px;left:-6px;width:16px;height:16px;border-radius:8px;' +
    "background:" + color + ";box-shadow:0 0 9px " + color + '"></div></div>';
}

/* ---------------------------- skill VFX -----------------------------------
   One effect family per `fx` tag on a skill, matching the reference sheet's
   VFX strips. Everything is vector/CSS driven off a single 0..1 progress value
   so the whole thing costs nothing and scales with the arena.
   -------------------------------------------------------------------------- */
/* Effects ran fast enough to read as a flicker. Everything is roughly half
   again as long, and the heavier the effect the more it gained -- a Cataclysme
   should take its time. */
const VFX_DUR = {
  impact: 0.80, pierce: 0.90, vortex: 1.45, bolt: 0.90, wave: 1.30,
  meteor: 1.70, aura: 1.60, curse: 1.35, poison: 1.60, heal: 1.45, cataclysm: 2.30,
};
function vfxDur(kind) { return VFX_DUR[kind] || 0.4; }


/* Build the whole effect layer for the current frame. */
function skillVfxHTML(c, scale, groundY, uni, vs) {
  const cast = (c.skillFxs || []).map((fx) => oneVfxHTML(c, fx, scale, groundY, uni, vs)).join("");
  const now = Date.now();
  if (c.bursts && c.bursts.length) c.bursts = c.bursts.filter((b) => now - b.born < b.max * 1000);
  const burst = (c.bursts || []).map((b) => oneBurstHTML(b, scale, groundY, vs, uni)).join("");
  if (!cast && !burst) return "";
  return '<div class="vfx" style="position:absolute;inset:0;pointer-events:none;z-index:6">' +
    cast + burst + "</div>";
}
/* Painted VFX are pure white with an alpha falloff, so they are used as CSS
   MASKS rather than drawn directly: the mask carries the shape and the
   intensity, and the skill's own colour is painted underneath it. A second
   white layer rides the same mask, which turns the densest part of the sprite
   into a hot core for free. One sprite therefore serves all 18 skill colours. */
const VFX_STRETCH = { pierce: 1, bolt: 1 };   // span the hero-to-target gap
function vfxLayer(key, x, y, w, h, col, op, tf) {
  const m = "url(" + ASSETS["vfx_" + key] + ") center/" +
    (VFX_STRETCH[key] ? "100% 100%" : "contain") + " no-repeat";
  const box = "position:absolute;left:" + (x - w / 2).toFixed(1) + "px;top:" + (y - h / 2).toFixed(1) +
    "px;width:" + w.toFixed(1) + "px;height:" + h.toFixed(1) + "px;" +
    (tf ? "transform:" + tf + ";" : "") + "-webkit-mask:" + m + ";mask:" + m + ";";
  return '<div style="' + box + "background:" + col + ";opacity:" + op.toFixed(3) +
    ";filter:drop-shadow(0 0 " + (w * 0.05).toFixed(1) + "px " + col + ')"></div>' +
    '<div style="' + box + "background:#FFFFFF;opacity:" + (op * 0.4).toFixed(3) + '"></div>';
}

/* The basic attack reuses the same masked-sprite trick: the arc sweeps through
   the swing and fades as it goes, so it reads as a trail rather than a flash. */
/* A bow does not swing. The slash arc used to play for every weapon, so an
   archer drew a sword trail and a Baton cast by slashing. Ranged weapons get a
   release flash at the hand instead -- the projectile carries the rest. */
function releaseHTML(attacking, size, col) {
  const q = Math.min(1, Math.max(0, 1 - attacking / ATTACK_WINDOW));
  const hand = heroHand(attacking);
  const d = size * (0.20 + q * 0.30);
  const m = "url(" + ASSETS.vfx_spark + ") center/contain no-repeat";
  return '<div class="slash" style="left:' + (hand.x * size - d / 2).toFixed(1) +
    "px;top:" + (hand.y * size - d / 2 - size * 0.10).toFixed(1) + "px;width:" + d.toFixed(1) +
    "px;height:" + d.toFixed(1) + "px;opacity:" + ((1 - q) * 0.85).toFixed(3) +
    ";background:" + col + ";-webkit-mask:" + m + ";mask:" + m + '"></div>';
}
function slashHTML(attacking, size) {
  const q = Math.min(1, Math.max(0, 1 - attacking / ATTACK_WINDOW));
  const d = size * (0.95 + q * 0.45);
  const m = "url(" + ASSETS.vfx_slash + ") center/contain no-repeat";
  return '<div class="slash" style="left:' + (size * 0.86 - d / 2).toFixed(1) +
    "px;top:" + (size * 0.44 - d / 2).toFixed(1) + "px;width:" + d.toFixed(1) +
    "px;height:" + d.toFixed(1) + "px;opacity:" + (1 - q * q).toFixed(3) +
    ";transform:rotate(" + (-38 + q * 80).toFixed(0) + "deg) scaleX(-1);-webkit-mask:" + m +
    ";mask:" + m + '"></div>';
}

/* One-shot bursts sit outside the skill system: they are fired by events rather
   than by a cast, and a death has to outlive the enemy that caused it. */
const BURST_DUR = { hit: 0.30, crit: 0.50, death: 0.72 };
function addBurst(c, kind, x, color) {
  if (!c.bursts) c.bursts = [];
  c.bursts.push({ kind, x, color, born: Date.now(), max: BURST_DUR[kind] });
  if (c.bursts.length > 18) c.bursts.shift();
}
function oneBurstHTML(b, scale, groundY, vs, uni) {
  const p = Math.max(0, Math.min(1, (Date.now() - b.born) / (b.max * 1000)));
  const x = b.x * scale, y = groundY - (uni || CHAR) / 2;
  if (b.kind === "hit") {
    const d = (18 + p * 40) * scale;
    return vfxLayer("impact", x, y, d, d, b.color, (1 - p) * 0.75);
  }
  if (b.kind === "crit") {
    const d = (36 + p * 92) * scale;
    return vfxLayer("crit", x, y, d, d, b.color, 1 - p, "rotate(" + (p * 26).toFixed(0) + "deg)");
  }
  const d = (48 + p * 52) * scale;              // death: rises as it thins out
  return vfxLayer("death", x, y - p * 28 * scale, d, d, b.color, (1 - p) * 0.9);
}

/* The hit flash is the same sprite trick, driven off the flash timer the units
   already carry, so it needs no new state of its own. */
function sparkHTML(life, max, size, col) {
  const p = Math.max(0, Math.min(1, 1 - life / max));
  const d = size * (0.5 + p * 0.5);
  const m = "url(" + ASSETS.vfx_spark + ") center/contain no-repeat";
  return '<div class="slash" style="left:' + (size * 0.5 - d / 2).toFixed(1) +
    "px;top:" + (size * 0.46 - d / 2).toFixed(1) + "px;width:" + d.toFixed(1) +
    "px;height:" + d.toFixed(1) + "px;opacity:" + (1 - p).toFixed(3) +
    ";background:" + col + ";-webkit-mask:" + m + ";mask:" + m + '"></div>';
}

function oneVfxHTML(c, fx, scale, groundY, uni, vs) {
  const kind = fx.fx || "impact";
  const dur = fx.max || vfxDur(kind);
  const p = Math.max(0, Math.min(1, 1 - fx.life / dur));   // 0 -> 1 over the effect
  const col = fx.color;
  const fade = 1 - p;
  // A unit is drawn at left = x*scale - size/2, top = groundY - size, so its
  // centre is (x*scale, groundY - size/2). The old anchors were x + 26 and a
  // flat groundY - 30, which put every effect low and to the right of whatever
  // it was supposed to be hitting.
  const hx = P.hero * scale;
  const foes = c.enemies.filter((e) => e.alive);
  const fxs = foes.map((e) => (P.en[e.id] != null ? P.en[e.id] : e.x) * scale);
  const cx = fxs.length ? fxs.reduce((a, b) => a + b, 0) / fxs.length : hx + 120;
  const foeSize = foes.some((e) => e.boss) ? (uni || CHAR) * 1.45 : (uni || CHAR);
  const midY = groundY - foeSize / 2;
  const S = scale;                    // every effect stays proportional to the arena
  let h = "";

  if (kind === "impact") {
    // one burst per target, punching outward from nothing
    fxs.forEach((x) => { const d = (30 + p * 86) * S; h += vfxLayer("impact", x, midY, d, d, col, fade); });
  } else if (kind === "pierce") {
    // a lance driven from the hero out through the furthest target
    const far = Math.max.apply(null, fxs.concat([hx + 60 * S]));
    const w = Math.max(30 * S, (far - hx) * Math.min(1, p * 1.7)) + 34 * S;
    h += vfxLayer("pierce", hx + w / 2 - 16 * S, midY, w, w * 0.34, col, fade);
  } else if (kind === "bolt") {
    // a chain from the hero to each enemy, snapping taut then fading
    fxs.forEach((x) => {
      const w = Math.abs(x - hx) + 30 * S;
      h += vfxLayer("bolt", (hx + x) / 2, midY, w, w * 0.42, col, Math.min(1, p * 4) * fade);
    });
  } else if (kind === "wave") {
    // two ground rings, the second trailing the first, flattened into perspective
    for (let i = 0; i < 2; i++) {
      const q = Math.max(0, p - i * 0.22);
      if (q <= 0) continue;
      const d = q * 300 * S;
      h += vfxLayer("wave", hx, groundY - 10 * (vs || 1), d, d, col, (1 - q) * 0.95, "scaleY(0.36)");
    }
  } else if (kind === "vortex") {
    // spins up as it grows
    const d = (40 + p * 140) * S;
    h += vfxLayer("vortex", cx, midY, d, d, col, fade, "rotate(" + (p * 300).toFixed(0) + "deg)");
  } else if (kind === "meteor") {
    // comet falls in, then reuses the impact burst for the detonation
    if (p < 0.55) {
      const q = p / 0.55, d = 130 * S;
      h += vfxLayer("meteor", cx - 100 * S + q * 100 * S, -50 * S + q * (midY + 50 * S), d, d, col, 0.95);
    } else {
      const q = (p - 0.55) / 0.45, d = (50 + q * 130) * S;
      h += vfxLayer("impact", cx, midY, d, d, col, 1 - q);
    }
  } else if (kind === "cataclysm") {
    // full-arena wash, then a starburst over the whole wave
    const d = (70 + p * 260) * S;
    h += '<div style="position:absolute;inset:0;background:' + col +
      ";opacity:" + (fade * 0.22).toFixed(3) + '"></div>';
    h += vfxLayer("cataclysm", cx, midY - 8 * S, d, d, col, fade, "rotate(" + (p * 36).toFixed(0) + "deg)");
  } else if (kind === "aura" || kind === "heal") {
    // buffs sit on the hero for their whole duration, so they swell and settle
    const w = 84 * S, ht = 112 * S;
    h += vfxLayer(kind, hx, groundY - ht / 2 + 10 * S, w, ht, col, Math.sin(p * Math.PI) * 0.95);
  } else if (kind === "curse") {
    // a ring stamped over each target with its runes bearing down
    fxs.forEach((x) => { const d = (44 + p * 44) * S; h += vfxLayer("curse", x, midY, d, d, col, fade); });
  } else if (kind === "poison") {
    // a cloud that swells, drifts upward and thins out
    fxs.forEach((x) => {
      const d = (46 + p * 38) * S;
      h += vfxLayer("poison", x, midY - p * 18 * S, d, d, col, Math.sin(p * Math.PI) * 0.95);
    });
  }
  return h;
}

/* ---------------------------- sprite animation ----------------------------
   A sprite animates if ASSETS holds "<key>_attackN" entries. The swing plays
   across the unit's existing attack window, so timing needs no new state:
   heroAttacking / e.attacking already count down from ATTACK_WINDOW.
   Sprites with no frames simply keep their single image.
   -------------------------------------------------------------------------- */
const ATTACK_WINDOW = 0.2;
const FRAME_CACHE = {};
/* An attack frame is only ever named when a swing starts, so the browser had
   never fetched it: the <img> src changed to a cold URL and the sprite rendered
   nothing until the download finished. That is the character vanishing on the
   first blow. Two defences -- fetch the frames when the fighter appears, and
   fall back to the idle sprite for any frame that is not decoded yet, so a slow
   network degrades to "no attack pose" instead of "no character". */
const IMG_CACHE = {};
function preloadImg(url) {
  if (!url) return null;
  if (!IMG_CACHE[url]) { const im = new Image(); im.src = url; IMG_CACHE[url] = im; }
  return IMG_CACHE[url];
}
function imgReady(url) {
  const im = IMG_CACHE[url];
  return !!(im && im.complete && im.naturalWidth > 0);
}
function preloadFrames(key) {
  if (!key) return;
  preloadImg(ASSETS[key]);
  attackFrames(key).forEach(preloadImg);
}
function attackFrames(key) {
  if (FRAME_CACHE[key]) return FRAME_CACHE[key];
  const out = [];
  for (let i = 1; ASSETS[key + "_attack" + i]; i++) out.push(ASSETS[key + "_attack" + i]);
  FRAME_CACHE[key] = out;
  return out;
}
/* which image to draw for a unit right now */
function spriteFrame(key, attacking, t) {
  const f = attackFrames(key);
  if (!f.length || !(attacking > 0)) return ASSETS[key];
  // attacking counts DOWN, so progress runs 0 -> 1 across the swing
  const p = Math.min(0.999, Math.max(0, 1 - attacking / ATTACK_WINDOW));
  const url = f[Math.floor(p * f.length)];
  // never hand the DOM a frame that would render as a hole
  return imgReady(url) ? url : ASSETS[key];
}

/* Read of a fight, in the nameplate. Compares how long you need to put this
   enemy down against how long it needs to put you down, using the same derived
   stats the combat itself runs on. Under half the time it needs is comfortable,
   past four fifths is genuinely dangerous. Colour-blind players still have the
   tier colour on the pill and the health bars, so this adds a read rather than
   being the only one. */
const THREAT_C = { easy: "#57E07A", even: "#F5C542", hard: "#FF5A5A" };
function threatOf(c, e) {
  const d = D;
  const dps = Math.max(1, d.damage * d.attackSpeed * (1 + d.critChance / 100 * (d.critMult - 1)));
  const ttk = Math.max(0, e.maxHP) / dps;                       // seconds to kill it
  const foeDps = Math.max(0.01, (e.dmg || 1) / 1.4) * (1 - Math.min(85, d.dmgRed) / 100);
  const ttl = Math.max(0.01, (c.heroMaxHP || d.maxHP)) / foeDps; // seconds to be killed
  const r = ttk / ttl;
  return r < 0.45 ? "easy" : r < 1.05 ? "even" : "hard";
}
/* ---- the per-frame arena draw ---- */
function drawArena() {
  if (!arenaEl || !arenaNodes || !document.body.contains(arenaEl)) return;
  const c = combat;
  arenaT += 16;
  const t = arenaT;
  const w = arenaEl.clientWidth || 360;
  const scale = w / AW;
  // The arena became elastic, but the draw still used ARENA_H, so the ground
  // line sat at a fixed 228px. On a short arena that put every sprite below the
  // visible area -- the fight was being drawn off-screen. Both the ground line
  // and the sprite size now come from the height the arena actually has, and
  // the sprite is capped by whichever axis is tighter so it always fits.
  const h = arenaEl.clientHeight || ARENA_H;
  const vs = h / ARENA_H;
  const uni = CHAR * Math.min(scale, vs);
  const groundY = h - 22 * vs;
  {
    const sh = c && c.shake && c.shake.until > Date.now() ? c.shake : null;
    const k = sh ? (sh.until - Date.now()) / 170 : 0;
    const off = sh ? sh.mag * k : 0;
    const tf = off > 0.15
      ? "translate(" + (Math.sin(arenaT * 0.9) * off).toFixed(2) + "px," +
        (Math.cos(arenaT * 1.3) * off * 0.6).toFixed(2) + "px)"
      : "";
    if (arenaNodes.layer.style.transform !== tf) arenaNodes.layer.style.transform = tf;
  }

  if (!c) { arenaNodes.layer.innerHTML = ""; return; }

  // ---- header: title, floor-block track, status pills (sheet §4) ----
  const label = c.ctx === "campaign" ? "Étage " + fmtInt(c.floor)
    : c.raidId ? RAIDS[c.raidId].name : "Épreuve d'Ascension";
  if (arenaNodes.label.textContent !== label) arenaNodes.label.textContent = label;

  const track = c.ctx === "campaign" ? floorTrack(c.floor) : "";
  if (lastTrack !== track) { arenaNodes.track.innerHTML = track; lastTrack = track; }

  const alive = c.enemies.filter((e) => e.alive).length;
  const total = c.enemies.length + c.pending;
  let sub;
  if (c.ctx === "campaign") {
    sub = '<span class="fPill">' + ic("swords", 10) + "Vague " + c.step + "/" + RULES.STEPS_PER_FLOOR + "</span>" +
      '<span class="fPill">Ennemis ' + (total - alive) + "/" + total + "</span>" +
      (c.boss ? '<span class="fPill boss">' + ic("skull", 10) + "BOSS</span>"
        : c.elite ? '<span class="fPill elite">' + ic("crown", 10) + "ÉLITE</span>" : "");
  } else if (c.raidId) {
    sub = '<span class="fPill">Niveau ' + c.raidLevel + "</span>" +
      (c.raidId === "or" ? '<span class="fPill">Vague ' + (5 - c.pending) + "/5</span>"
        : '<span class="fPill">Ennemis ' + (total - alive) + "/" + total + "</span>");
  } else {
    sub = '<span class="fPill elite">' + ic("star", 10) + "Gardien · Niveau " + S.level + "</span>";
  }
  if (lastSub !== sub) { arenaNodes.sub.innerHTML = sub; lastSub = sub; }
  const bgUrl = 'url("' + bgFor(c.bg) + '")';
  if (arenaNodes.bg.style.backgroundImage !== bgUrl) arenaNodes.bg.style.backgroundImage = bgUrl;
  const dKey = c.bg + "|" + (c.ctx === "campaign" ? c.floor : c.raidId || c.ctx);
  if (lastDecor !== dKey) { arenaNodes.decor.innerHTML = decorHTML(c.bg, c.floor || 1); lastDecor = dKey; }

  // smoothing toward the simulation snapshot
  // 0.22 chased the simulation hard enough to look stepped; 0.13 glides
  P.hero += (c.heroX - P.hero) * 0.13;
  const live = {};
  c.enemies.forEach((e) => {
    live[e.id] = 1;
    if (P.en[e.id] == null) P.en[e.id] = e.x;
    P.en[e.id] += (e.x - P.en[e.id]) * 0.13;
  });
  Object.keys(P.en).forEach((id) => { if (!live[id]) delete P.en[id]; });

  const wt = WEAPON_TYPES[D.weapon] || WEAPON_TYPES.epee;
  const tgt = c.enemies.filter((e) => e.alive).sort((a, b) => a.x - b.x)[0];
  // the walk cycle now follows the same rule the movement does, so an archer
  // closing the gap is animated as walking rather than gliding
  const heroMoving = !!tgt && c.heroAttacking <= 0 && (tgt.x - c.heroX) > wt.range + 4;

  // best equipped rarity → aura
  let bestIdx = -1, auraRar = null;
  Object.values(S.equipped).forEach((it) => {
    if (it) { const i = equipRank(it.rarity); if (i > bestIdx) { bestIdx = i; auraRar = it.rarity; } }
  });
  const auraColor = (auraRar && auraRar !== "COMMUN") ? RARITY[auraRar].c : null;
  const weaponColor = S.equipped.arme ? RARITY[S.equipped.arme.rarity].c : WEAPON_SILVER;

  let html = "";

  // projectiles
  c.projs.forEach((p) => {
    const pa = ASSETS["proj_" + (p.kind || "arrow")];
    html += pa
      ? '<div class="proj" style="left:' + (p.x * scale - 11) + "px;top:" + (groundY - 30 * vs) +
        'px;width:22px;height:10px;background:none;box-shadow:none"><img src="' + pa +
        '" style="width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 5px ' +
        p.color + ')"></div>'
      : '<div class="proj" style="left:' + (p.x * scale - 5) + "px;top:" + (groundY - 26 * vs) + "px;" +
        "background:" + p.color + ";box-shadow:0 0 7px " + p.color + '"></div>';
  });

  // ---- hero ----
  {
    const size = uni;
    const idle = Math.sin(t * 0.0042) * 2 + Math.sin(t * 0.0017) * 1;
    const hop = heroMoving ? -Math.abs(Math.sin(t * 0.017)) * 5 : 0;
    const tilt = heroMoving ? Math.sin(t * 0.017) * 4 : Math.sin(t * 0.0032) * 1.6;
    const lunge = c.heroAttacking > 0 ? 12 : 0;
    const knock = c.heroHit > 0 ? -6 : 0;
    const sc = 1;   // the hero holds one size: no breathing, no attack punch
    const auraPulse = 1 + Math.sin(t * 0.006) * 0.06;
    const hpPct = Math.max(0, (c.heroHP / c.heroMaxHP) * 100);

    html += '<div class="unit" style="left:' + (P.hero * scale - size / 2) + 'px;top:' + (groundY - size) + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;transform:translate(' + (lunge + knock) + 'px,' + (idle + hop) + 'px);z-index:4">' +
      '<div class="ushadow" style="width:' + (size * 0.6) + 'px;left:' + (size * 0.2) + 'px;top:' + (size - 8) + 'px"></div>' +
      (auraColor ? '<div class="aura" style="left:' + (size * 0.05) + 'px;top:' + (size * 0.02) + 'px;width:' + (size * 0.9) + 'px;' +
        'height:' + (size * 0.94) + 'px;background:' + auraColor + '22;border-color:' + auraColor + '99;' +
        'transform:scale(' + auraPulse + ');box-shadow:0 0 14px ' + auraColor + '"></div>' : '') +

      '<img src="' + spriteFrame("hero", c.heroAttacking, t) + '" style="transform:rotate(' + tilt + 'deg) scale(' + sc + ')">' +
      weaponHTML(D.weapon, weaponColor, c.heroAttacking > 0, t, size) +
      (c.heroAttacking > 0
        ? (RANGED_IDS.includes(D.weapon)
            ? releaseHTML(c.heroAttacking, size, weaponColor)
            : slashHTML(c.heroAttacking, size))
        : '') +
      (c.heroHit > 0 ? sparkHTML(c.heroHit, 0.15, size, '#FF9A5A') : '') +
      '<div class="hpMini" style="top:-12px"><i style="width:' + hpPct + '%"></i></div>' +
      '</div>';
  }

  // ---- enemies ----
  c.enemies.filter((e) => e.alive || e.hitFlash > 0).forEach((e) => {
    const size = e.boss ? uni * 1.45 : (e.small ? uni * 0.5 : uni);
    const x = (P.en[e.id] != null ? P.en[e.id] : e.x) * scale;
    const phase = (x % 100) / 16;
    const idle = Math.sin(t * 0.0045 + phase) * 2 + Math.sin(t * 0.0019 + phase) * 1;
    const tilt = Math.sin(t * 0.0045 + phase) * 2.4;
    const lunge = (e.attacking > 0 ? -12 : 0) + (e.recoil > 0 ? e.recoil * 46 : 0);
    const knock = e.hitFlash > 0 ? 7 : 0;
    const hpPct = Math.max(0, (e.hp / e.maxHP) * 100);
    html += '<div class="unit" style="' + (e.vanish > 0 ? "opacity:.22;filter:brightness(.4);" : "") +
      (e.tint ? "filter:drop-shadow(0 0 7px " + e.tint + ") saturate(1.5);" : "") +
      "left:" + (x - size / 2) + 'px;top:' + (groundY - size - (e.flying > 0 ? 44 * vs : 0)) + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;transform:translate(' + (lunge + knock) + 'px,' + idle + 'px);z-index:3">' +
      '<div class="ushadow" style="width:' + (size * 0.6) + 'px;left:' + (size * 0.2) + 'px;top:' + (size - 8) + 'px"></div>' +
      '<img src="' + (spriteFrame(e.type.img, e.attacking) || ASSETS.enemy_goblin) + '" ' +
      'style="transform:scaleX(-1) rotate(' + tilt + 'deg)">' +
      (e.hitFlash > 0 ? sparkHTML(e.hitFlash, 0.15, size, '#FFFFFF') : '') +
      '<div class="hpMini foe" style="top:-12px"><i style="width:' + hpPct + '%;background:' +
      (e.boss ? "#E5484D" : "#ff7b3f") + '"></i></div>' +
      // every enemy is named now, because the colour is the point
      '<div class="foeTag" style="color:' + THREAT_C[threatOf(c, e)] + '">' +
        esc(e.name || e.type.name) + "</div>" +
      (() => {
        return abilitiesOf(e).map((a) => {
          const st = a.state ? a.state(e) : "";
          return st ? '<div class="foeAbil" style="color:' + a.c + ";border-color:" + a.c + '">' + st + "</div>" : "";
        }).join("");
      })() +
      '</div>';
  });

  // ---- skill VFX layer ----
  html += skillVfxHTML(c, scale, groundY, uni, vs);

  // ---- damage floats ----
  const now = Date.now();
  c.floats.forEach((f) => {
    const age = (now - f.born) / 900;
    // CRITIQUE! / BLOCK! / ESQUIVE! headers over the number, per the sheet
    const lbl = f.text || (f.blocked ? "BLOCK !" : f.dodged ? "DODGE !" : f.crit ? "CRITIQUE !" : "");
    const lblCol = f.text ? f.color : f.blocked ? "#FF5A5F" : f.dodged ? "#4AA8FF" : "#FFC83D";
    const val = f.text || f.blocked || f.dodged ? "" : (f.heal ? "+" : "-") + fmt(f.val);
    html += '<div class="float" style="left:' + (f.x * scale - 34) + 'px;top:' + (groundY - (52 + age * 46) * vs) + 'px;' +
      'width:80px;opacity:' + (1 - age) + ';transform:scale(' + (f.crit ? 1.16 : 1) + ')">' +
      (lbl ? '<span class="fLbl" style="color:' + lblCol + '">' + lbl + "</span>" : "") +
      (val ? '<span class="fVal" style="color:' + (f.heal ? "#57E07A" : f.color) +
        ";font-size:" + (f.crit ? 21 : 15) + 'px">' + val + "</span>" : "") + "</div>";
  });

  arenaNodes.layer.innerHTML = html;

  // victory / defeat banner
  const b = arenaNodes.banner;
  const flashing = floorFlash && Date.now() < floorFlash.until;
  if (!flashing && floorFlash) floorFlash = null;
  if (flashing && c.status !== "lost") {
    b.className = ""; b.style.color = C.gold;
    b.textContent = "ÉTAGE " + fmtInt(floorFlash.floor);
  } else if (c.status === "won") {
    b.className = ""; b.textContent = "VICTOIRE"; b.style.color = C.gold;
  } else if (c.status === "lost") {
    b.className = ""; b.textContent = "VAINCU"; b.style.color = C.red;
  } else if (b.className !== "hide") {
    b.className = "hide";
  }
}

/* Skill cooldown rings and the active-effect chips have to move every frame,
   so they are driven from the render loop rather than the DOM re-render. */
function updateCombatHud() {
  const bar = document.getElementById("skillbar");
  if (bar) {
    bar.querySelectorAll(".slot[data-skill]").forEach((el) => {
      const id = el.dataset.skill;
      const left = combat && combat.skillCds ? Math.max(0, combat.skillCds[id] || 0) : 0;
      const max = (combat && combat.skillCdMax && combat.skillCdMax[id]) ||
        (SKILL_BY_ID[id] ? SKILL_BY_ID[id].cd : 1);
      const arc = el.querySelector(".cdArc");
      const txt = el.querySelector(".cdTxt");
      const frac = max > 0 ? Math.max(0, Math.min(1, left / max)) : 0;
      if (arc) arc.setAttribute("stroke-dashoffset", String(125.6 * (1 - frac)));
      if (txt) txt.textContent = left > 0.05 ? (left >= 10 ? left.toFixed(0) : left.toFixed(1)) : "";
      el.classList.toggle("cooling", left > 0.05);
    });
  }
  // an effect belongs to the skill that cast it, so it shows on that icon
  const live = {};
  [].concat(fxList(combat, "buffs"), fxList(combat, "debuffs")).forEach((b) => {
    const d = SKILL_BY_EFFKEY[b.key];
    if (d) live[d.id] = b.left;
  });
  document.querySelectorAll(".slot[data-skill]").forEach((el) => {
    const bub = el.querySelector(".fxBub");
    if (!bub) return;
    const left = live[el.dataset.skill];
    if (left > 0.05) {
      const t = left >= 10 ? Math.ceil(left) + "s" : left.toFixed(1) + "s";
      if (bub.textContent !== t) bub.textContent = t;
      bub.style.display = "";
    } else if (bub.style.display !== "none") {
      bub.style.display = "none";
    }
  });
}
function rafLoop() { drawArena(); updateCombatHud(); requestAnimationFrame(rafLoop); }

/* ---------------- small html helpers ---------------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function bar(pct, color, h) {
  h = h || 6;
  // `color` doubles as currentColor so the fill picks up its own bloom
  return '<div class="bar" style="height:' + h + 'px"><i style="width:' + Math.max(0, Math.min(100, pct)) +
    "%;background:linear-gradient(180deg," + shade(color, 14) + "," + color + ");color:" + color + '"></i></div>';
}
/* labelled meter used by the pity / mastery readouts (sheet §14) */
function meter(pct, color, label) {
  return '<div class="meter"><i style="width:' + Math.max(0, Math.min(100, pct)) +
    "%;background:linear-gradient(180deg," + shade(color, 16) + "," + color + ')"></i>' +
    (label ? "<span>" + label + "</span>" : "") + "</div>";
}
function btn(label, opts) {
  opts = opts || {};
  const cls = "btn " + (opts.cls || "") + (opts.small ? " sm" : "");
  return '<button class="' + cls + '"' + (opts.act ? ' data-act="' + opts.act + '"' : "") +
    (opts.arg !== undefined ? ' data-arg="' + esc(opts.arg) + '"' : "") +
    (opts.arg2 !== undefined ? ' data-arg2="' + esc(opts.arg2) + '"' : "") +
    (opts.dis ? " disabled" : "") +
    (opts.style ? ' style="' + opts.style + '"' : "") + ">" + label + "</button>";
}
function rtag(r) {
  const c = RARITY[r].c;
  return '<span class="tag" style="color:' + c + ";border-color:" + c + "88;background:linear-gradient(180deg," + c +
    "26," + c + '0d);box-shadow:0 0 9px ' + c + '3d,inset 0 1px 0 #ffffff1a">' + RARITY[r].label + "</span>";
}
function topbar(title, right) {

    '</div><h2 class="title flex1">' + title + "</h2>" + (right || "") + "</div>";
}
function ratesTable(rates, nextRates, curLabel, nextLabel, order) {
  // Without a next-level column this is just eight name/value pairs, so it
  // pairs up into two columns and costs half the height.
  const twoUp = !nextRates;
  let h = '<div class="rateBox' + (twoUp ? " twoUp" : "") + '"><div class="rateHead"><span class="nm">Rareté</span><b>' +
    curLabel + "</b>" + (nextRates ? "<b>" + nextLabel + '</b><b style="color:' + C.green + '">Gain</b>' : "") + "</div>";
  if (twoUp) h += '<div class="rateCols">';
  (order || RARITY_ORDER).forEach((r) => {
    const cur = rates[r], nxt = nextRates ? nextRates[r] : cur, delta = nxt - cur;
    if (cur < 0.05 && nxt < 0.05) return;
    h += '<div class="rateRow"><span class="nm"><i class="rdot" style="background:' + RARITY[r].c +
      ";color:" + RARITY[r].c + '"></i>' + RARITY[r].label + "</span>" +
      "<b>" + cur.toFixed(cur < 10 ? 1 : 0) + "%</b>" +
      (nextRates ? '<b style="color:' + RARITY[r].c + '">' + nxt.toFixed(nxt < 10 ? 1 : 0) + "%</b>" +
        '<b style="color:' + (delta >= 0.05 ? C.green : delta <= -0.05 ? C.red : C.textMute) + '">' +
        (Math.abs(delta) < 0.05 ? "—" : (delta >= 0.05 ? "+" : "") + delta.toFixed(1) + "%") + "</b>" : "") +
      "</div>";
  });
  return h + (twoUp ? "</div>" : "") + "</div>";
}

/* The upgrade sheet answers "what does this buy me?" before it asks for the
   gold. The rarity table used to sit permanently on the home panel, where it
   was reference material nobody reads twice; here it is the whole point --
   current rates against the ones the next level unlocks. The confirm at the
   foot is the only place the upgrade actually fires. */
function showForgeUpgrade() {
  const lv = S.forge.level;
  const atMax = lv >= RULES.FORGE_MAX;
  const cost = forgeUpgCostFor(S);
  const time = forgeUpgTimeFor(S);
  const need = forgeProgressNeed(lv);
  const have = Math.min(need, S.forge.progress || 0);
  const gaugeOk = have >= need;
  const goldOk = S.gold >= cost;
  const busy = S.forge.upgradeEnd > Date.now();
  const cut = Math.min(FORGE_COST_CUT_CAP, treeSum(S, "forgeCost"));
  // gated at each level, so the preview shows a tier appearing the moment the
  // upgrade unlocks it -- which is the whole reason the gate exists
  const cur = gateForgeRates(getRates("forge", lv, S.ascension, starsOf(S, "forge")), lv);
  const nxt = atMax ? null
    : gateForgeRates(getRates("forge", lv + 1, S.ascension, starsOf(S, "forge")), lv + 1);

  let action, note = "";
  if (atMax) {
    action = btn("Forge au niveau maximum", { cls: "ghost", small: true, dis: true });
  } else if (busy) {
    action = btn(ic("clock", 13) + "Amélioration en cours", { cls: "ghost", small: true, dis: true });
    note = "Termine ou accélère l'amélioration en cours depuis l'Accueil.";
  } else if (!gaugeOk || !goldOk) {
    action = btn(ic("hammer", 13) + "Améliorer · " + fmt(cost) + " Or", { small: true, dis: true });
    note = !gaugeOk && !goldOk
      ? "Il te manque " + (need - have) + " forge" + (need - have > 1 ? "s" : "") + " et " + fmt(cost - S.gold) + " Or."
      : !gaugeOk ? "Forge encore " + (need - have) + " fois pour remplir la jauge."
      : "Il te manque " + fmt(cost - S.gold) + " Or — tente le Raid Or.";
  } else {
    action = btn(ic("hammer", 14) + "Améliorer · " + fmt(cost) + " Or",
      { cls: "green", small: true, act: "forgeUpgrade" });
  }

  openModal(
    '<div class="center" style="margin-bottom:6px">' + ic("hammer", 28) + "</div>" +
    '<div class="modalT center" style="color:var(--goldLit)">NIV.' + lv +
      (atMax ? "" : ' <span style="color:var(--textMute)">→</span> NIV.' + (lv + 1)) + "</div>" +
    '<div class="dim tiny center" style="margin:3px 0 7px">' +
      (atMax ? "La Forge ne peut plus progresser."
        : "Chaque niveau améliore les taux de rareté de tout ce que tu forges.") + "</div>" +

    (atMax ? "" :
      '<div class="mute tiny b center" style="letter-spacing:.5px;margin-bottom:2px">CE QUE CE NIVEAU CHANGE</div>' +
      ratesTable(cur, nxt, "Niv." + lv, "Niv." + (lv + 1), EQUIP_RARITY_ORDER)) +

    '<div class="card mt6" style="padding:7px 9px">' +
      '<div class="kv"><span class="dim">Jauge de forge</span><b style="color:' +
        (gaugeOk ? "var(--greenLit)" : "var(--textMute)") + '">' + have + " / " + need + "</b></div>" +
      (atMax ? "" :
        '<div class="kv"><span class="dim">Coût</span><b class="row gap4" style="color:' +
          (goldOk ? "var(--goldLit)" : "var(--textMute)") + '">' + ic("gold", 12) + fmt(cost) + "</b></div>" +
        (cut > 0 ? '<div class="kv"><span class="dim">Réduction de l\'Arbre</span><b style="color:var(--greenLit)">−' +
          cut + "%</b></div>" : "") +
        '<div class="kv"><span class="dim">Durée</span><b class="row gap4">' + ic("clock", 12) +
          (time <= 0 ? "Instantané" : fmtTime(time)) + "</b></div>") +
    "</div>" +

    '<div class="mt8">' + action + "</div>" +
    (note ? '<div class="mute tiny center mt6" style="line-height:1.45">' + note + "</div>" : "") +
    '<div class="mt6">' + btn("Fermer", { cls: "ghost", small: true, act: "closeModal" }) + "</div>",
    "Améliorer la Forge");
}

const STAT_META = [

  { key: "degats",  label: "Dégâts",             icon: "flame",  color: "#FF7A3D", desc: "+2.2 dégâts / point (mêlée &amp; distance)" },

  { key: "critred", label: "Réduc. Dégâts Crit.",icon: "shield", color: "#4A90D9", desc: "-0.3% dégâts crit. reçus / point" },
];
/* The four skill slots, shared by the home screen and by any screen that shows
   the arena. updateCombatHud() drives the cooldown rings off whatever
   #skillbar is in the DOM, so a raid gets live cooldowns for free. */
/* How many slots the player has actually earned. The fifth was advertised on a
   locked tile but nothing ever granted it -- reaching level 100 now does. */
function skillSlotCount(s) {
  return RULES.SKILL_SLOTS_BASE + (s.level >= RULES.SKILL_SLOT_5_LEVEL ? 1 : 0);
}
/* Manual cast: same effect path as the automatic one, refused when the skill is
   on cooldown or there is nothing to hit. Returns why it failed so the UI can
   say something useful rather than going quiet. */
function castSkill(sid) {
  const c = combat;
  if (!c || c.status !== "fight") return "pas de combat";
  if (!sid || !S.skills[sid]) return "aucune compétence";
  const def = SKILL_BY_ID[sid];
  if (!def) return "aucune compétence";
  if (skillsFizzle(c)) return "le regard annule tout sort";
  if (skillSealed(c, sid)) return "compétence scellée";
  if ((c.skillCds[sid] || 0) > 0.05) return "en recharge";
  const dv = D;
  const target = c.enemies.filter((e) => e.alive).sort((a, b) => a.x - b.x)[0];
  if (!target) return "aucune cible";
  const now = Date.now();
  c.skillCds[sid] = def.cd * (1 - (dv.skillCdCut || 0) / 100);
  c.skillCdMax[sid] = c.skillCds[sid];
  const fxKind = def.fx || "impact";
  c.skillFxs.push({ id: def.id, color: def.color, fx: fxKind, life: vfxDur(fxKind), max: vfxDur(fxKind) });
  if (c.skillFxs.length > 4) c.skillFxs.shift();
  if (def.mult > 0) {
    const sdmg = Math.floor(skillDamageMult(dv.damage * skillMult(def), S.skills[sid].level)
      * (1 + (dv.skillDmgBonus || 0) / 100));
    const wide = def.type === "AOE" || def.type === "CHAINE" || def.type === "DEBUFF";
    const struck = wide ? c.enemies.filter((e) => e.alive) : [target];
    scheduleHit(c, skillHitDelay(fxKind), () => {
      struck.forEach((e) => { if (e && e.alive) applyDamageToEnemy(c, e, sdmg, true, def.color, "skill"); });
    });
  }
  if (def.heal) {
    const amt = Math.floor(c.heroMaxHP * skillHeal(def, S.skills[sid].level) / 100);
    c.heroHP = Math.min(c.heroMaxHP, c.heroHP + amt);
    c.burn = 0;
    c.floats.push({ id: rid(), x: c.heroX, val: amt, crit: false, color: "#84E891", born: now, heal: true });
  }
  if (def.eff) applyHeroEffect(c, def.cat === "DEBUFF" ? "debuffs" : "buffs", skillEff(def, S.skills[sid].level), now);
  return null;
}
function skillSlotsHTML() {
  let sb = "";
  const open = skillSlotCount(S);
  for (let i = 0; i < open; i++) {

      '" data-arg="' + (def ? def.id : "competences") + '"' +
      (def ? ' data-skill="' + def.id + '"' : "") + ">" + (def
      ? '<div class="skfx" style="background:linear-gradient(' + shade(def.color, 26) + "," + shade(def.color, -34) + ')">' +
        ic(def.icon, 24) + "</div>" +
        '<svg class="cdRing" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" stroke="#050A12" stroke-width="3" opacity="0"/>' +
        '<circle class="cdArc" cx="23" cy="23" r="20" stroke="' + (cat ? cat.c : def.color) +
          '" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="125.6"/></svg>' +
        '<div class="cdTxt"></div>' +
        '<div class="fxBub" style="display:none;color:' + (cat ? cat.c : def.color) + '"></div>' +
        '<i class="catBar" style="background:' + (cat ? cat.c : def.color) + '"></i>' +
        '<span class="lv">' + (S.skills[sid] ? S.skills[sid].level : 1) + "</span>"
      : ic("plus", 18)) + "</div>";
  }
  sb += '<div class="autoSk ' + (S.autoSkills ? "on" : "off") + '" data-act="autoSkills" ' +
    'title="' + (S.autoSkills ? "Compétences automatiques" : "Compétences manuelles") + '">' +
    ic("bolt", 12) + "<span>AUTO</span><i></i></div>";
  if (open < RULES.SKILL_SLOTS_BASE + 1) {
    sb += '<div class="slot locked">' + ic("lock", 16) +
      '<span class="tiny mute b">Niv.' + RULES.SKILL_SLOT_5_LEVEL + "</span></div>";
  }
  return sb;
}

/* Bulk recycle. S.inventory only ever holds UNEQUIPPED gear -- equipItem moves
   the item into S.equipped and pushes the replaced one back -- so this can
   never eat what the hero is wearing. It still confirms first: it is the only
   irreversible action in the game that can touch dozens of items at once. */
function recycleValue(it) {
  return Math.floor(((equipRank(it.rarity) + 1) * 5 + it.power * 0.2) * (1 + treeSum(S, "dust") / 100));
}
function recycleBatch(rarity) {
  const hit = S.inventory.filter((x) => x.rarity === rarity);
  if (!hit.length) return { n: 0, dust: 0 };
  const dust = hit.reduce((a, x) => a + recycleValue(x), 0);
  update((st) => {
    st.inventory = st.inventory.filter((x) => x.rarity !== rarity);
    st.poussiere += dust;
  });
  return { n: hit.length, dust: dust };
}
function showRecyclePicker() {

    const hit = S.inventory.filter((x) => x.rarity === r);

    const c = RARITY[r].c;
    return '<div class="itemRow" style="border-left-color:' + c + ";opacity:" + (hit.length ? 1 : 0.4) +
      '" data-act="setRecycleRarity" data-arg="' + r + '">' +

/* Skill sheet: what it does in words, what it does in numbers right now, what
   the next level changes, and how far the duplicates have got. Same shape as
   the tree-node sheet so the two read alike. */
const SKILL_TYPE_LABEL = { MONO: "Cible unique", AOE: "Toute la vague", CHAINE: "Rebonds en chaîne",
  BUFF: "Bonus sur le héros", DEBUFF: "Malus sur la vague", HEAL: "Soin immédiat" };
function skillEffectLine(def, level) {
  const e = skillEff(def, level);
  if (def.mult > 0) {
    const d = computeDerived(S);
    const raw = skillDamageMult(d.damage * skillMult(def), level) * (1 + (d.skillDmgBonus || 0) / 100);
    return fmt(Math.floor(raw)) + " dégâts" + (def.type === "MONO" ? "" : " à chaque ennemi");
  }
  if (def.heal) return "+" + skillHeal(def, level).toFixed(1) + "% des PV max, immédiat";
  if (e) {
    const unit = e.stat === "regen" ? "%/s" : "%";
    const what = e.stat === "dmg" ? "dégâts du héros" : e.stat === "dmgRed" ? "dégâts subis en moins"
      : e.stat === "haste" ? "vitesse d'attaque" : e.stat === "vuln" ? "dégâts subis par les ennemis"
      : e.stat === "slow" ? "lenteur des ennemis" : e.stat === "poison" ? "dégâts de poison par seconde"
      : e.stat === "regen" ? "régénération" : e.stat;
    return "+" + e.value + unit + " " + what + " pendant " + e.dur + "s";
  }
  return "—";
}
function showSkillCard(id) {
  const def = SKILL_BY_ID[id];
  if (!def) return;
  const sk = S.skills[id];
  const rc = RARITY[def.rarity].c;
  const cat = SKILL_CATS[def.cat];
  const lv = sk ? sk.level : 0;
  const maxed = lv >= RULES.SKILL_MAX_LEVEL;
  const need = sk ? skillDupesNeeded(lv) : 0;
  const slotIdx = S.skillSlots.indexOf(id);
  const equipped = slotIdx >= 0;
  const openSlots = skillSlotCount(S);
  const freeSlot = S.skillSlots.slice(0, openSlots).indexOf(null);

  let action, note = "";
  if (!sk) {
    action = btn(ic("lock", 13) + "Non possédée", { cls: "ghost", small: true, dis: true });
    note = "Invoque des compétences avec des Éclats. " + RARITY[def.rarity].label +
      " : " + (getRates("skill", S.skillMastery.level, S.ascension, starsOf(S, "skill"))[def.rarity] || 0).toFixed(1) +
      "% par invocation à ta Maîtrise actuelle.";
  } else if (equipped) {
    action = btn(ic("cross", 13) + "Retirer de l'emplacement " + (slotIdx + 1),
      { cls: "dark", small: true, act: "unequipSkill", arg: id });
  } else if (freeSlot >= 0) {
    action = btn(ic("check", 13) + "Équiper · emplacement " + (freeSlot + 1),
      { cls: "green", small: true, act: "autoEquipSkill", arg: id });
  } else {
    action = btn(ic("swords", 13) + "Remplacer une compétence", { cls: "blue", small: true, act: "skillSlot", arg: "0" });
    note = "Tous les emplacements sont occupés — choisis lequel remplacer.";
  }

  openModal(
    '<div class="row gap10" style="margin-bottom:9px">' +
      '<div class="imini" style="width:44px;height:44px;background:linear-gradient(180deg,' + shade(def.color, 20) + "," +
        shade(def.color, -40) + ');border-color:' + rc + ';box-shadow:0 0 12px ' + rc + '4d">' + ic(def.icon, 25) + "</div>" +
      '<div class="flex1"><div class="bb" style="font-size:14px;color:' + def.color + '">' + esc(def.name) + "</div>" +
      '<div class="row gap4 mt4" style="flex-wrap:wrap">' + rtag(def.rarity) +
        '<span class="pill" style="color:' + cat.c + ";border-color:" + cat.c + '99">' + cat.label + "</span>" +
        '<span class="pill">' + (SKILL_TYPE_LABEL[def.type] || def.type) + "</span>" +
        (sk ? '<span class="pill" style="color:' + (maxed ? "var(--greenLit)" : "var(--text)") + ";border-color:" +
          (maxed ? "#3FB950" : "#33486F") + '">Niv. ' + lv + " / " + RULES.SKILL_MAX_LEVEL + "</span>" : "") +
      "</div></div></div>" +

    '<div class="notice" style="border-left-color:' + def.color + '">' + esc(def.desc) + "</div>" +

    '<div class="card mt6" style="padding:8px 10px">' +
      '<div class="kv"><span class="dim">Effet actuel</span><b style="color:' + def.color + '">' +
        (sk ? skillEffectLine(def, lv) : "—") + "</b></div>" +
      (sk && !maxed ? '<div class="kv"><span class="dim">Au niveau ' + (lv + 1) + '</span><b style="color:var(--greenLit)">' +
        skillEffectLine(def, lv + 1) + "</b></div>" : "") +
      '<div class="kv"><span class="dim">Recharge</span><b class="row gap4">' + ic("clock", 12) + def.cd + "s</b></div>" +
      '<div class="kv"><span class="dim">Bonus de rareté</span><b style="color:' + rc + '">×' +
        skillRarityMul(def).toFixed(2) + "</b></div>" +
    "</div>" +

    (sk && !maxed
      ? '<div class="mt6"><div class="between tiny b" style="margin-bottom:3px">' +
          '<span class="mute">DOUBLONS POUR LE NIVEAU ' + (lv + 1) + "</span>" +
          '<span style="color:' + def.color + '">' + sk.count + " / " + need + "</span></div>" +
          meter((sk.count / need) * 100, def.color, "") + "</div>"
      : sk && maxed ? '<div class="mute tiny center mt6">Niveau maximum atteint.</div>' : "") +

    '<div class="mt8">' + action + "</div>" +
    (note ? '<div class="mute tiny mt6" style="line-height:1.45">' + note + "</div>" : "") +
    '<div class="mt6">' + btn("Fermer", { cls: "ghost", small: true, act: "closeModal" }) + "</div>",
    esc(def.name));
}
function scrCompetences() {
  const rates = getRates("skill", S.skillMastery.level, S.ascension, starsOf(S, "skill"));
  const mreq = masteryReq(S.skillMastery.level);
  const owned = SKILL_DEFS.filter((d) => S.skills[d.id]);

  let slots = "";
  const openSlots = skillSlotCount(S);
  for (let i = 0; i < openSlots; i++) {
    const sid = S.skillSlots[i];
    const def = sid ? SKILL_DEFS.find((x) => x.id === sid) : null;
    slots += '<div class="slot" data-act="skillSlot" data-arg="' + i + '">' + (def
      ? '<div class="skfx" style="background:linear-gradient(' + shade(def.color, 26) + "," + shade(def.color, -34) + ')">' +
        ic(def.icon, 24) + '</div><span class="lv">' + S.skills[sid].level + "</span>"
      : ic("plus", 18)) + "</div>";
  }
  if (openSlots < RULES.SKILL_SLOTS_BASE + 1) {
    slots += '<div class="slot locked">' + ic("lock", 16) +
      '<span class="tiny mute b">Niv.' + RULES.SKILL_SLOT_5_LEVEL + "</span></div>";
  }

  return topbar("Compétences", '<span class="pill" data-act="resInfo" data-arg="eclat" style="cursor:pointer;color:#C79BFF;border-color:#9B5CF6">' + ic("eclat", 11) + fmt(S.eclat) + "</span>") +
    '<div class="pad mt6">' +
      '<div class="card frame"><div class="between"><div style="min-width:0"><div class="row gap4"><div class="bb gt" style="font-size:13px;letter-spacing:1px">MAÎTRISE COMPÉTENCE</div>' +
        starRow("skill", "#C79BFF") + "</div>" +
        '<div class="mute tiny b">' + S.skillMastery.progress + "/" + mreq + " invocations</div></div>" +
        '<b style="color:var(--purpleLit);font-size:18px;text-shadow:0 0 12px #9B5CF680">' + S.skillMastery.level + "/" + RULES.MASTERY_MAX + "</b></div>" +
        '<div class="mt8">' + meter((S.skillMastery.progress / mreq) * 100, C.purple, S.skillMastery.progress + " / " + mreq) + "</div>" +
        ascendCta("skill") +
        fold("skillRates", "Taux de rareté",
          ratesTable(rates, S.skillMastery.level < RULES.MASTERY_MAX ? getRates("skill", S.skillMastery.level + 1, S.ascension, starsOf(S, "skill")) : null,
            "Actuel", "Niv." + (S.skillMastery.level + 1)), "margin:2px 0 0") +
        '<div class="row gap6 mt6">' +
          btn(ic("sparkle", 14) + "Invoquer · " + skillSummonCost(S), { cls: "purple", small: true, act: "summonSkill", arg: 1, dis: S.eclat < skillSummonCost(S) }) +
          btn("x10 · " + skillSummonCost(S) * 10, { cls: "purple", small: true, act: "summonSkill", arg: 10, dis: S.eclat < skillSummonCost(S) * 10, style: "max-width:96px" }) +
        "</div></div>" +
      '<div class="sect" style="margin:16px 0 9px">Emplacements actifs</div>' +
      '<div class="row gap6">' + slots + "</div>" +
      '<div class="mute tiny mt4">Les compétences équipées se déclenchent seules dès que leur recharge est finie.</div>' +
      '<div class="sect">Collection (' + owned.length + "/" + SKILL_DEFS.length + ")</div>" +
      // one tab per category, plus Tout; the count tells you what is left to find
      '<div class="seg">' + ["ALL"].concat(Object.keys(SKILL_CATS)).map((k) => {
        const inCat = k === "ALL" ? SKILL_DEFS : SKILL_DEFS.filter((d) => d.cat === k);
        const have = inCat.filter((d) => S.skills[d.id]).length;
        return '<span class="' + (skillFilter === k ? "on" : "") + '" data-act="skillFilter" data-arg="' + k + '">' +
          (k === "ALL" ? "Tout" : SKILL_CATS[k].label) +
          '<b style="opacity:.6;font-weight:700"> ' + have + "/" + inCat.length + "</b></span>";
      }).join("") + "</div>" +
      '<div class="skGrid mt6">' + SKILL_DEFS
        .filter((d) => skillFilter === "ALL" || d.cat === skillFilter)
        .map((def) => {
          const sk = S.skills[def.id];
          const rc = RARITY[def.rarity].c;
          const equipped = sk && S.skillSlots.includes(def.id);
          return '<div class="skTile' + (sk ? "" : " locked") + '" data-act="skillCard" data-arg="' + def.id +
            '" title="' + esc(def.name) + " · " + RARITY[def.rarity].label + '" style="border-color:' + rc + (sk ? ";box-shadow:inset 0 1px 0 #ffffff1a,0 0 9px " + rc + "44" : "") + '">' +
            (equipped ? '<div class="skEq"></div>' : "") +
            '<div style="color:' + def.color + '">' + ic(def.icon, 20) + "</div>" +
            '<div class="skNm" style="color:' + (sk ? "var(--text)" : "var(--textMute)") + '">' + def.name + "</div>" +
            (sk ? '<span class="skLv">' + sk.level + "</span>" : "") +
            "</div>";
        }).join("") + "</div>" +
      (owned.length === 0 ? '<div class="mute tiny center mt4">Aucune compétence — invoque avec des Éclats.</div>' : "") +
    '<div style="height:2px"></div></div>';
}

/* ---------------- FAMILIERS ---------------- */
function scrFamiliers() {
  const rates = getRates("pet", S.petMastery.level, S.ascension, starsOf(S, "pet"));
  const mreq = masteryReq(S.petMastery.level);
  const now = Date.now();
  const accelBtns = (targetType, id) => ACCEL_DEFS.filter((a) => (S.accels[a.key] || 0) > 0).map((a) =>
    '<span class="pill" data-act="accel" data-arg="' + a.key + '" data-arg2="' + (targetType === "egg" ? "egg:" + id : "tree") +
    '" style="cursor:pointer;color:#8FEFF4;border-color:var(--cyan)">' + ic("bolt", 10) + a.label + " ×" + S.accels[a.key] + "</span>").join("");

  let eggCells = "";
  const hatching = eggsHatching(S);
  const stored = eggsStored(S);
  for (let i = 0; i < S.eggSlots; i++) {
    const egg = hatching[i];
    const eggArt = (r) => ASSETS["egg_" + String(r).toLowerCase()];
    if (!egg) { eggCells += '<div class="eggCard mute" style="opacity:.35">' +
      (eggArt("commun") ? '<img src="' + eggArt("commun") + '" style="width:22px;height:22px;object-fit:contain;filter:grayscale(1)">' : ic("egg", 20)) +
      '<div class="tiny b mt4">Vide</div></div>'; continue; }
    const remain = (egg.hatchEnd - now) / 1000;
    const ready = remain <= 0;
    eggCells += '<div class="eggCard rf" style="border-color:' + RARITY[egg.rarity].c + ";--rc:" + RARITY[egg.rarity].c + '">' +
      '<div style="position:relative;z-index:1">' +
        (eggArt(egg.rarity) ? '<img src="' + eggArt(egg.rarity) +
          '" style="width:32px;height:32px;object-fit:contain;display:block;margin:0 auto;' +
          "filter:drop-shadow(0 2px 5px #000a)\">" : ic("egg", 28)) + "</div>" + rtag(egg.rarity) +
      '<div class="tiny b" style="color:' + petElement(egg).c + ';margin-top:3px">' +
        ic(petElement(egg).icon, 9) + petElement(egg).label + "</div>" +
      '<div class="mt6">' + (ready
        ? btn("Éclore", { small: true, cls: "green", act: "collectEgg", arg: egg.id })
        : '<div class="b tiny row gap4" style="color:var(--goldLit);justify-content:center">' + ic("clock", 10) + fmtTime(remain) + "</div>" +
          '<div class="row gap4 mt6" style="flex-wrap:wrap;justify-content:center">' + accelBtns("egg", egg.id) + "</div>") +
      "</div></div>";
  }

  const byRar = {};
  S.pets.forEach((p) => { byRar[p.rarity] = (byRar[p.rarity] || []).concat([p]); });

  const ORANGE = "#FF7A3D";
  return topbar("Familiers", '<span class="pill" data-act="resInfo" data-arg="essence" style="cursor:pointer;color:#FFC29B;border-color:' + ORANGE + '">' + ic("essence", 11) + fmt(S.essence) + "</span>") +
    '<div class="pad mt6">' +
      (() => {
        const p = S.pets.find((x) => x.id === S.activePetId);
        if (!p) {
          return '<div class="mute tiny b row gap6" style="margin-bottom:4px"><img src="' + petArt(null) +
            '" style="width:18px;height:18px;object-fit:contain;filter:grayscale(1);opacity:.5">' +
            "Aucun familier actif</div>";
        }
        const rc = RARITY[p.rarity].c;
        const lv = p.level || 0;
        const mx = petMaxLevel(p.rarity);
        const pct = petBonus(p);
        const nextPct = lv < mx ? petBonusAt(p.rarity, lv + 1, starsOf(S, "pet")) : pct;
        const cost = petUpgradeCost(p.rarity, lv);
        const treeDmg = treeSum(S, "petDmg");
        return '<div class="card frame rf" style="border-color:' + rc + ";--rc:" + rc + '">' +
          '<div class="row gap10"><img src="' + petArt(p) +
            '" style="width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 4px 10px #000c)">' +
          '<div class="flex1"><div class="row gap6" style="flex-wrap:wrap">' + rtag(p.rarity) +
            '<span class="pill">' + ic(petSpecies(p).icon, 10) + petSpecies(p).label + "</span>" +
            '<span class="pill" style="color:' + petElement(p).c + ";border-color:" + petElement(p).c +
              '99">' + ic(petElement(p).icon, 10) + petElement(p).label + "</span>" +
            '<span class="pill">Niv. ' + lv + "/" + mx + "</span></div>" +
          '<div class="row gap10 mt6">' +
            '<span class="b small row gap4" style="color:#FF9C6B">' + ic("sword", 12) + "+" + fmt(Math.round(pct * (1 + treeDmg / 100))) + "%</span>" +
            '<span class="b small row gap4" style="color:var(--redLit)">' + ic("heart", 12) + "+" + fmt(Math.round(pct)) + "%</span>" +
          "</div>" +
          '<div class="mt6">' + meter((lv / mx) * 100, rc, lv + " / " + mx) + "</div></div></div>" +
          '<div class="tiny b mt6 row gap4" style="color:' + petElement(p).c + '">' +
            ic(petElement(p).icon, 11) + petElement(p).desc + "</div>" +
          (treeDmg > 0 ? '<div class="tiny b mt6 row gap4" style="color:#8FEFF4">' + ic("bolt", 10) +
            "Arbre : +" + treeDmg + "% aux dégâts des Familiers</div>" : "") +
          '<div class="divider"></div>' +
          (lv >= mx
            ? '<div class="center"><span class="pill" style="border-color:#3FB950;color:var(--greenLit)">Amélioration maximale</span>' +
              '<div class="mute tiny mt6">Fusionne pour atteindre la rareté suivante</div></div>'
            : '<div class="between"><div class="mute tiny b">PROCHAIN NIVEAU</div>' +
              '<div class="b tiny" style="color:var(--greenLit)">+' + fmt(Math.round(pct)) + "% → +" + fmt(Math.round(nextPct)) + "%</div></div>" +
              '<div class="mt6">' + btn(ic("essence", 13) + "Améliorer · " + fmt(cost),
                { small: true, act: "upgradePet", arg: p.id, dis: S.essence < cost,
                  style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03" }) + "</div>") +
        "</div>";
      })() +
      '<div class="card mt6"><div class="between"><div style="min-width:0"><div class="row gap4"><div class="bb gt" style="font-size:13px;letter-spacing:1px">MAÎTRISE FAMILIER</div>' +
        starRow("pet", "#FFC29B") + "</div>" +
        '<div class="mute tiny b">' + S.petMastery.progress + "/" + mreq + " invocations</div></div>" +
        '<b style="color:#FFC29B;font-size:18px;text-shadow:0 0 12px ' + ORANGE + '80">' + S.petMastery.level + "/" + RULES.MASTERY_MAX + "</b></div>" +
        '<div class="mt6">' + meter((S.petMastery.progress / mreq) * 100, ORANGE, S.petMastery.progress + " / " + mreq) + "</div>" +
        ascendCta("pet") +
        ratesTable(rates, S.petMastery.level < RULES.MASTERY_MAX ? getRates("pet", S.petMastery.level + 1, S.ascension, starsOf(S, "pet")) : null,
          "Actuel", "Niv." + (S.petMastery.level + 1)) +
        '<div class="row gap6 mt6">' +
          btn(ic("egg", 14) + "Invoquer · 10", { small: true, act: "summonEgg", arg: 1,
            dis: S.essence < 10,
            style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03" }) +
          btn("x10", { small: true, act: "summonEgg", arg: 10,
            dis: S.essence < 10,
            style: "--bA:#FFA872;--bB:#DB6224;--bS:#7A310C;--bE:#FFD9C0;--bT:#2A0F03;max-width:62px" }) +
        "</div>" +
        // the nest being full is no longer a reason not to summon
        (stored.length ? '<div class="mute tiny center mt6">' + stored.length +
          " œuf" + (stored.length > 1 ? "s" : "") + " en réserve · éclosion dès qu'un emplacement se libère</div>" : "") +
      "</div>" +
      '<div class="sect" style="margin:16px 0 9px">Éclosion (' + hatching.length + "/" + S.eggSlots +
        (stored.length ? ") · " + stored.length + " en réserve" : ")") + "</div>" +
      '<div class="slotGrid">' + eggCells + "</div>" +
      (S.eggSlots < RULES.EGG_SLOT_MAX ? '<div class="mt4" style="margin-top:4px">' +
        btn("+1 Emplacement · " + ic("gem", 12) + "300" + (S.level < 10 ? " · niv. 10" : ""),
          { cls: "purple", small: true, act: "buyEggSlot",
            dis: S.level < 10 || S.gems < 300, style: "padding:4px 9px;font-size:10.5px" }) + "</div>" : "") +
      '<div class="sect" style="margin:16px 0 9px">Collection (' + S.pets.length + ")</div>" +
      '<div class="mute tiny" style="margin-bottom:2px;line-height:1.35">Fusion : ' +
        RARITY_ORDER.slice(0, -1).map((r) => petFuseNeed(r) + " " + RARITY[r].label).join(" → ") +
        " → " + RARITY[RARITY_ORDER[RARITY_ORDER.length - 1]].label +
        ". Les doublons les moins améliorés partent en premier.</div>" +
      (S.pets.length === 0 ? '<div class="mute tiny center" style="padding:6px 0">Aucun familier. Fais éclore un œuf.</div>'
        : RARITY_ORDER.filter((r) => byRar[r]).map((r) => {
        const list = byRar[r];
        const rc = RARITY[r].c;
        const need = petFuseNeed(r);
        const isTop = RARITY_ORDER.indexOf(r) >= RARITY_ORDER.length - 1;
        const canFuse = need > 0 && list.length >= need;
        const best = list.slice().sort((a, b) => (b.level || 0) - (a.level || 0))[0];
        const activeHere = list.some((p) => p.id === S.activePetId);
        return '<div class="itemRow" style="border-left-color:' + rc + ';flex-wrap:wrap">' +
          '<div class="imini" style="width:32px;height:32px;border-color:' + rc + '80;box-shadow:0 0 10px ' +
            rc + '3d">' + ic("paw", 19) + "</div>" +
          '<div class="flex1"><div class="b small" style="color:' + rc + '">' + RARITY[r].label + " ×" + list.length + "</div>" +
          '<div class="mute tiny b row gap6">' +
            '<span>' + ic("sword", 9) + " base +" + fmt(PET_BASE[r]) + "%</span>" +
            '<span>' + ic("heart", 9) + " base +" + fmt(PET_BASE[r]) + "%</span>" +
            '<span>max +' + fmt(Math.round(petBonusAt(r, petMaxLevel(r), starsOf(S, "pet")))) + "%</span>" +
          "</div>" +
          (best ? '<div class="mute tiny b">Meilleur : ' + esc(petFullName(best)) +
            " · niv. " + (best.level || 0) + "/" + petMaxLevel(r) + "</div>" : "") +
          '<div class="row gap4 mt6" style="flex-wrap:wrap">' +
            PET_ELEMENTS.map((el) => {
              const cnt = list.filter((p) => petElement(p).id === el.id).length;
              return cnt ? '<span class="tag" style="color:' + el.c + ";border-color:" + el.c +
                '66">' + ic(el.icon, 9) + el.label + " ×" + cnt + "</span>" : "";
            }).join("") + "</div>" +
          "</div>" +
          '<div class="col gap4">' +
          (activeHere
            ? '<span class="pill" style="color:var(--greenLit);border-color:#3FB950">Actif</span>'
            : btn("Activer", { small: true, cls: "ghost", act: "setPet", arg: best.id, style: "padding:5px 8px;font-size:10.5px" })) +
          (isTop ? "" : btn("Fusion", { small: true, cls: "purple", act: "fuse", arg: r,
            dis: !canFuse, style: "padding:5px 8px;font-size:10.5px" })) +
          "</div>" +
          (isTop ? "" : '<div style="width:100%;margin-top:7px">' +
            '<div class="between tiny b" style="margin-bottom:3px">' +
              '<span class="mute">DOUBLONS POUR FUSION</span>' +
              '<span style="color:' + (canFuse ? "var(--greenLit)" : "var(--textMute)") + '">' +
              Math.min(list.length, need) + " / " + need + "</span></div>" +
            meter((Math.min(list.length, need) / need) * 100, canFuse ? C.green : rc) + "</div>") +
          "</div>";
      }).join("")) +
    '<div style="height:2px"></div></div>';
}
/* ---------------- RAID ---------------- */
function scrRaid() {
  const running = combat && combat.ctx === "raid" && !combat.trial;
  if (S.level < RULES.RAID_UNLOCK_LEVEL) {
    return topbar("Raids") + '<div class="pad mt6"><div class="notice center">Les Raids se débloquent au Niveau ' +
      RULES.RAID_UNLOCK_LEVEL + ".</div></div>";
  }
  if (running) {
    const rm = RAIDS[combat.raidId];
    return topbar(rm.name) + '<div id="arenaSlot"></div>' + combatBarHTML() +
      '<div class="pad mt6"><div class="card frame center">' +
      '<div class="row gap8" style="justify-content:center">' + ic(rm.icon, 22) +
      '<span class="bb gt" style="font-size:14px;letter-spacing:1.2px">RAID EN COURS</span></div>' +
      '<div class="mute small mt6">Niveau ' + combat.raidLevel + " · récompense " +
      '<b style="color:' + rm.color + '">' + fmt(raidReward(combat.raidId, combat.raidLevel)) + " " + rm.reward + "</b></div>" +
      '<div class="mt10">' + btn("Abandonner", { cls: "dark", small: true, act: "abortRaid" }) + "</div></div></div>";
  }
  const cards = RAID_IDS.map((id) => {
    const r = S.raids[id], meta = RAIDS[id];
    const bonus = S.raidKeyBonus === id ? 1 : 0;
    const cap = RULES.RAID_KEY_CAP + bonus;
    const st = raidStars(S, id);
    const detail = (st ? "★" + st + " · " : "") +
      "Niv " + r.level + "/" + RULES.RAID_MAX_LEVEL + " · rec " + r.record +
      " · " + raidEnemyCount(id, r.level) + " ennemis · " + fmt(raidEnemyHP(id, r.level)) + " PV";
    return '<div class="raidCard" style="border-left-color:' + meta.color + '" title="' + esc(detail) +
      " · " + fmt(raidEnemyDamage(id, r.level)) + ' dégâts">' +
      '<div class="row gap8">' +
        '<div class="imini" style="width:28px;height:28px;background:linear-gradient(180deg,' + meta.color + '33,' + meta.color +
        '0f);border-color:' + meta.color + ';box-shadow:0 0 11px ' + meta.color + '47">' + ic(meta.icon, 16) + "</div>" +

/* ---------------------------- tree node types -----------------------------
   The reference sheet groups nodes by PURPOSE rather than by section, and
   colours both the node ring and the connecting path by that type. Every
   effect in the tree maps onto one of these.
   -------------------------------------------------------------------------- */
const TREE_TYPES = {
  COMBAT:      { label: "Combat",      c: "#E5484D", icon: "sword",   desc: "Augmente ta puissance offensive." },
  SURVIE:      { label: "Survie",      c: "#3FB950", icon: "heart",   desc: "Prolonge ton autonomie de récolte." },
  VITESSE:     { label: "Vitesse",     c: "#4A90D9", icon: "haste",   desc: "Réduit les temps d'attente." },
  RESSOURCES:  { label: "Ressources",  c: "#B15CF6", icon: "poussiere", desc: "Améliore tes gains et ton économie." },
  FAMILIERS:   { label: "Familiers",   c: "#F5C542", icon: "crown",   desc: "Renforce tes familiers et l'éclosion." },
  COMPETENCES: { label: "Compétences", c: "#3FE0C0", icon: "sparkle", desc: "Renforce tes compétences." },
  SPECIAL:     { label: "Nœuds spéciaux", c: "#FFD65E", icon: "key",  desc: "Gros bonus uniques et structurants." },
};
const TREE_TYPE_ORDER = ["COMBAT", "SURVIE", "VITESSE", "RESSOURCES", "FAMILIERS", "COMPETENCES", "SPECIAL"];
/* One entry per family in the official list, so a node never falls back to a
   default category and the colours on the graph mean something. */
const EFFECT_TYPE = {
  // the eight equipment bonuses split the way section 14 splits them
  eq_arme: "COMBAT", eq_gants: "COMBAT", eq_collier: "COMBAT", eq_anneau: "COMBAT",
  eq_casque: "SURVIE", eq_armure: "SURVIE", eq_bottes: "SURVIE", eq_ceinture: "SURVIE",
  passDmg: "COMBAT", skillDmg: "COMPETENCES", skillFree: "COMPETENCES",
  skillCost: "COMPETENCES", passHp: "SURVIE",
  petDmg: "FAMILIERS", petHp: "FAMILIERS", eggFree: "FAMILIERS", eggSlot: "FAMILIERS",
  hatch_COMMUN: "FAMILIERS", hatch_RARE: "FAMILIERS", hatch_EPIQUE: "FAMILIERS",
  hatch_MYTHIQUE: "FAMILIERS", hatch_LEGENDAIRE: "FAMILIERS",
  forgeTime: "VITESSE", research: "VITESSE", afkTime: "VITESSE",
  forgeCost: "RESSOURCES", forgeFree: "RESSOURCES", techCost: "RESSOURCES",
  goldAll: "RESSOURCES", afkGain: "RESSOURCES", peRaid: "RESSOURCES",
  forgeMult: "SPECIAL", raidKey: "SPECIAL",
};
function nodeType(node) { return TREE_TYPES[EFFECT_TYPE[node.effect] || "RESSOURCES"]; }
function isSpecialNode(node) { return !!node.special; }

function hexPath(cx, cy, r) {
  const k = r * 0.866;
  return "M" + cx + " " + (cy - r) + "L" + (cx + k) + " " + (cy - r / 2) + "L" + (cx + k) + " " + (cy + r / 2) +
    "L" + cx + " " + (cy + r) + "L" + (cx - k) + " " + (cy + r / 2) + "L" + (cx - k) + " " + (cy - r / 2) + "Z";
}
/* node state: maxed | busy | part(Open) | open | wait | lock */
function treeState(s, n, active) {
  const lv = treeLv(s, n.id);
  if (active === n.id) return "busy";
  if (lv >= n.max) return "maxed";
  if (!treeReqOk(s, n)) return "lock";
  const affordable = !active && treeAfford(s, n);
  if (lv > 0) return affordable ? "partOpen" : "part";
  return affordable ? "open" : "wait";
}
/* The node art is greyscale with binary alpha: the metal's relief lives in the
   GREY, not the alpha, so masking it would flatten it. Instead each piece is
   multiplied by its colour -- feColorMatrix pulls luminance out of the red
   channel and scales it into RGB, which keeps the shading and the highlights.
   Filters are shared by colour, so the whole tree needs about a dozen. */
const TREE_TINT_GAIN = 1.85;          // mean luminance is ~0.43; this lands it near 0.8
function treeTint(col, reg) {
  const id = "tt" + col.replace("#", "");
  if (!reg[id]) {
    const c = (i) => (parseInt(col.slice(1 + i * 2, 3 + i * 2), 16) / 255 * TREE_TINT_GAIN).toFixed(4);
    reg[id] = '<filter id="' + id + '" x="-30%" y="-30%" width="160%" height="160%" ' +
      'color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="' +
      c(0) + ' 0 0 0 0  ' + c(1) + ' 0 0 0 0  ' + c(2) + ' 0 0 0 0  0 0 0 1 0"/></filter>';
  }
  return id;
}
function treePiece(key, cx, cy, size, col, reg, extra) {
  return '<image href="' + ASSETS["tree_" + key] + '" x="' + (cx - size / 2).toFixed(1) +
    '" y="' + (cy - size / 2).toFixed(1) + '" width="' + size.toFixed(1) + '" height="' + size.toFixed(1) +
    '" filter="url(#' + treeTint(col, reg) + ')" preserveAspectRatio="xMidYMid meet"' +
    (extra || "") + "/>";
}

/* The four paliers, drawn as bands behind the nodes so the depth is readable
   at a glance, and the links that cross between them drawn differently so the
   routes from one palier to the next are the thing you notice first. */
const PALIER_BAND = [
  { label: "PROFONDEUR I",   c: "#3FA7FF" },
  { label: "PROFONDEUR II",  c: "#57E07A" },
  { label: "PROFONDEUR III", c: "#B15CF6" },
  { label: "PROFONDEUR IV",  c: "#E8B44A" },
];
function treeGraph(active, remain) {
  const R = 19, W = 400;
  const maxRow = TREE_NODES.reduce((m, n) => Math.max(m, n.row), 0);
  const H = TREE_ROW_Y(maxRow) + R + 46;

  let links = "", nodes = "", defs = "", beads = "", bands = "";
  const filters = {};

  // ---- one band per palier, with its name down the side ----
  for (let p = 1; p <= 4; p++) {
    const rows = TREE_NODES.filter((n) => n.tier === p).map((n) => n.row);
    if (!rows.length) continue;
    const y0 = TREE_ROW_Y(Math.min.apply(null, rows)) - R - 16;
    const y1 = TREE_ROW_Y(Math.max.apply(null, rows)) + R + 16;
    const b = PALIER_BAND[p - 1];
    bands += '<rect x="6" y="' + y0 + '" width="' + (W - 12) + '" height="' + (y1 - y0) +
      '" rx="16" fill="' + b.c + '" opacity="0.055"/>' +
      '<rect x="6" y="' + y0 + '" width="' + (W - 12) + '" height="' + (y1 - y0) +
      '" rx="16" fill="none" stroke="' + b.c + '" stroke-width="1" opacity="0.30"/>' +
      '<text x="16" y="' + (y0 + 15) + '" fill="' + b.c + '" opacity="0.85" font-size="10"' +
      ' font-weight="800" letter-spacing="1.4">' + b.label + " · 30 NŒUDS</text>";
  }

  // ---- paths take the colour of the node they lead to (reference sheet) ----
  TREE_NODES.forEach((n) => {
    const ty = nodeType(n);
    n.req.forEach((rq) => {
      const q = TREE_BY_ID[rq];
      if (!q) return;
      const lit = treeLv(S, rq) >= 1;          // prerequisite satisfied
      const done = treeLv(S, n.id) >= 1;       // this branch already taken
      const rq2 = isSpecialNode(n) ? R + 6 : R;
      const bow = Math.min(46, 26 + Math.abs(n.x - q.x) * 0.28);
      // a link that changes palier IS the passage: draw it as a road, not a twig
      const cross = q.tier !== n.tier;
      const pc = cross ? PALIER_BAND[n.tier - 1].c : ty.c;
      const d = "M" + q.x + " " + (q.y + R) + "C" + q.x + " " + (q.y + R + bow) +
        " " + n.x + " " + (n.y - rq2 - bow) + " " + n.x + " " + (n.y - rq2);
      if (cross) {
        links += '<path d="' + d + '" fill="none" stroke="' + pc +
          '" stroke-width="9" stroke-linecap="round" opacity="' + (done || lit ? 0.22 : 0.10) + '"/>';
      }
      links += '<path d="' + d + '" fill="none" stroke="' +
        (done || lit ? pc : cross ? "#3A4E74" : "#26344F") + '" stroke-width="' +
        (cross ? (done ? 4.2 : lit ? 3.4 : 2.6) : (done ? 3 : lit ? 2.2 : 1.6)) +
        '" stroke-linecap="round"' + (cross && !done && !lit ? ' stroke-dasharray="7 6"' : "") +
        ' opacity="' + (done ? 0.95 : lit ? 0.7 : cross ? 0.5 : 0.35) + '"/>';
      if (done || lit) {
        beads += treePiece("bead", (q.x + n.x) / 2, ((q.y + R) + (n.y - rq2)) / 2,
          done ? 11 : 8, done ? ty.c : "#54709E", filters);
      }
      if (done) {  // travelled paths get a soft glow
        links += '<path d="M' + q.x + " " + (q.y + R) + "C" + q.x + " " + (q.y + R + bow) +
          " " + n.x + " " + (n.y - rq2 - bow) + " " + n.x + " " + (n.y - rq2) +
          '" fill="none" stroke="' + ty.c + '" stroke-width="7" stroke-linecap="round" opacity="0.13"/>';
      }
    });
  });

  TREE_NODES.forEach((n) => {
    const st = treeState(S, n, active);
    const lv = treeLv(S, n.id);
    const ty = nodeType(n);
    const special = isSpecialNode(n);
    const r = special ? R + 6 : R;
    const locked = st === "lock";
    const clickable = st === "open" || st === "partOpen";

    // ring colour reports STATE, fill reports TYPE
    const ring = locked ? "#2E4269"
      : st === "maxed" ? "#3FB950"
      : st === "busy" ? "#E8B44A"
      : (st === "part" || st === "partOpen") ? "#7FD4FF"
      : clickable ? ty.c : "#4A6494";
    const op = locked ? 0.5 : st === "wait" ? 0.82 : 1;
    const glow = !locked && (st === "maxed" || st === "busy" || clickable);

    /* The reference sheet puts the bonus on the node itself, not its price, so
       you can read the tree without opening anything. The PE cost lives in the
       detail panel, which section 27 requires it to show regardless. */
    let sub;
    if (st === "busy") sub = fmtTime(remain);
    else if (st === "maxed") sub = "MAX";
    else if (special) sub = "0/1";
    else sub = treeEffectValue(n, n.max);
    const subCol = st === "maxed" ? "#84E891" : st === "busy" ? "#FBDD8C"
      : locked ? "#6A7B9C" : "#FBDD8C";

    // plate carries the CATEGORY colour, ring carries the STATE colour
    const plateCol = locked ? "#33415E" : shade(ty.c, st === "maxed" ? -26 : -20);
    const shape =
      treePiece(special ? "plate_oct" : "plate", n.x, n.y, r * 2, plateCol, filters) +
      treePiece(special ? "ring_oct" : (st === "maxed" ? "ring_max" : "ring"),
        n.x, n.y, r * 2 * (st === "maxed" && !special ? 1.34 : 1.06), ring, filters);
    const halo = treePiece("glow", n.x, n.y, (r + 13) * 2, ring, filters, ' opacity="0.5"');

    // every node opens its detail popup, locked ones included
    nodes += '<g data-act="treeNode" data-arg="' + n.id + '" style="cursor:pointer" opacity="' + op + '">' +
      (glow ? halo : "") + shape +
      // locked nodes show a padlock instead of their own glyph
      '<g transform="translate(' + (n.x - 9.5) + " " + (n.y - 10.5) + ') scale(0.79)">' +
        (locked ? "" : (ICO[n.icon] || "")) + "</g>" +
      (locked ? treePiece("lock", n.x, n.y, r * 1.15, "#8FA4CC", filters) : "") +
      // level pill
      '<rect x="' + (n.x + 1) + '" y="' + (n.y + r - 9) + '" width="27" height="13" rx="6.5" ' +
        'fill="#050A12" stroke="' + ring + '" stroke-width="1" opacity="0.96"/>' +
      '<text x="' + (n.x + 14.5) + '" y="' + (n.y + r + 0.6) + '" text-anchor="middle" font-size="8.5" ' +
        'font-weight="900" font-family="Segoe UI,Roboto,sans-serif" fill="' +
        (lv >= n.max ? "#84E891" : lv > 0 ? "#BFE6FF" : "#8496B8") + '">' + lv + "/" + n.max + "</text>" +
      '<text x="' + n.x + '" y="' + (n.y + r + 18) + '" text-anchor="middle" font-size="8.5" font-weight="800" ' +
        'font-family="Segoe UI,Roboto,sans-serif" fill="#EDF1FA">' + esc(n.short) + "</text>" +
      '<text x="' + n.x + '" y="' + (n.y + r + 28) + '" text-anchor="middle" font-size="7.5" font-weight="700" ' +
        'font-family="Segoe UI,Roboto,sans-serif" fill="' + subCol + '">' + esc(sub) + "</text>" +
      "</g>";
  });

  /* The old layout gave each lane a theme -- FORGE, ECLOSION, COMPET.,
     UTILITAIRE -- and printed it as a banner at the top. Sections 16 and 17 ask
     for the opposite: families deliberately scattered across the width, so a
     lane means nothing now and a heading claiming otherwise would be a lie. The
     palier bands carry the structure instead. */
  const caps = "";

  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="display:block">' +
    bands +
    "<defs>" + defs + Object.keys(filters).map((k) => filters[k]).join("") + "</defs>" +
    caps + links + beads + nodes + "</svg>";
}

function checkNotable() {
  if (!notable) return;
  const n = notable; notable = null;
  toast(n.msg, true, null, n.icon);
}
function checkBossReward() {
  if (!bossReward) return;
  const r = bossReward; bossReward = null;
  const def = ACCEL_DEFS.find((a) => a.key === r.key);
  toast("Boss " + r.floor + " · +" + r.qty + " Accélérateur " + (def ? def.label : ""), true);

function checkLevelUp() {
  if (seenLevel === null) { seenLevel = S.level; return; }
  if (S.level > seenLevel) {
    const from = seenLevel;
    seenLevel = S.level;
    if (!document.getElementById("overlay")) showLevelUp(from, S.level);
  } else if (S.level < seenLevel) {
    seenLevel = S.level;   // rebirth / ascension reset the level
  }
}

  const fn = SCREENS[route] || scrAccueil;
  sc.className = route === "accueil" ? "fixed" : "";

  sc.scrollTop = keep;
}
